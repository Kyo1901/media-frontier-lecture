<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>실습 ① — 콘솔</title>

  <!-- 🔴 defer 를 빼지 마세요.
       head 에서 script 를 만나면 브라우저는 HTML 읽기를 «멈추고» JS 부터 받습니다.
       defer 는 「받아만 두고, HTML 을 다 읽은 다음 돌려라」는 뜻입니다.
       1차시에 이 줄을 지웠다 살렸다 해 봅니다. -->
  <script src="practice.js" defer></script>
</head>
<body>

  <h1>실습 ①</h1>

  <p>🔴 이 화면에는 아무것도 안 나옵니다. <strong>F12 → Console</strong> 을 보세요.</p>

  <p>답은 <code>practice.js</code> 에 씁니다. 저장하고 새로고침하면 다시 돕니다.</p>

</body>
</html>
