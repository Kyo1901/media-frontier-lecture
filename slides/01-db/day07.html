</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-class="section" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" class="section" data-marpit-pagination="3" style="--paginate:true;--class:section;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="1%EC%B0%A8%EC%8B%9C">1차시</h1>
<h2 id="%EC%B2%98%EC%9D%8C%EB%B6%80%ED%84%B0-%EB%8B%A4%EC%8B%9C-%EC%84%A4%EA%B3%84%ED%95%9C%EB%8B%A4">처음부터 다시 설계한다</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="articles-%EB%A5%BC-%EB%8B%A4%EC%8B%9C-%EC%84%A4%EA%B3%84%ED%95%9C%EB%8B%A4%EB%A9%B4">articles 를 다시 설계한다면</h1>
<table>
<thead>
<tr>
<th>지금</th>
<th>바꿀 것</th>
<th>왜</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>title TEXT</code></td>
<td><code>VARCHAR(200) NOT NULL</code></td>
<td>길이를 안다</td>
</tr>
<tr>
<td><code>section VARCHAR(20)</code></td>
<td><code>section_id INT</code> + 외래키</td>
<td>오타를 막는다</td>
</tr>
<tr>
<td><code>reporter VARCHAR(20)</code></td>
<td><strong>없앤다</strong></td>
<td><code>reporter_id</code> 와 중복</td>
</tr>
<tr>
<td><code>reporter_id INT</code></td>
<td><code>NOT NULL</code> + 외래키</td>
<td>없는 기자를 막는다</td>
</tr>
<tr>
<td><code>views INT</code></td>
<td><strong>그대로</strong></td>
<td><code>NULL</code> 의 뜻을 지킨다</td>
</tr>
</tbody>
</table>
<blockquote>
<p>다섯 줄 중 <strong>하나는 &quot;그대로&quot;</strong> 입니다. 바꾸지 않는 것도 설계 결정입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%8B%AC%EB%9D%BC%EC%A7%80%EB%8A%94%EA%B0%80">무엇이 달라지는가</h1>
<svg style="display:block;margin:0 auto 18px" id="dg1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" aria-label="왼쪽 v1 은 섹션과 기자 이름을 글자로 직접 저장해 오타와 중복이 들어갈 수 있고, 오른쪽 v2 는 두 열이 모두 참조표를 가리키는 번호로 바뀌어 없는 값이 들어갈 수 없다">
  <style>
#dg1 .ttl{ font-family:var(--sans); font-size:19px; font-weight:600; fill:#FFFFFF; }
#dg1 .lbl{ font-family:var(--sans); font-size:14px; fill:#9DB0BE; }
#dg1 .bad{ font-family:var(--sans); font-size:14px; font-weight:600; fill:#EC8B81; }
#dg1 .hot{ font-family:var(--sans); font-size:15px; font-weight:600; fill:#F2C879; }
#dg1 .mono{ font-family:var(--mono); font-size:14px; fill:#FFFFFF; }
#dg1 .monod{ font-family:var(--mono); font-size:14px; fill:#EC8B81; }
#dg1 .monoc{ font-family:var(--mono); font-size:14px; fill:#5CC6DE; }
  </style>
  <text x="20" y="26" class="ttl">v1 — 글자로 저장</text>
  <text x="520" y="26" class="ttl">v2 — 번호로 가리킴</text>
  <rect x="20" y="46" width="330" height="176" rx="8" fill="#344A59" stroke="#6D869A" stroke-width="2" />
  <text x="38" y="72" class="lbl">articles</text>
  <text x="38" y="102" class="mono">id</text>
  <text x="38" y="128" class="mono">title</text>
  <text x="38" y="154" class="monod">section    '정치'</text>
  <text x="38" y="180" class="monod">reporter   '김예은'</text>
  <text x="38" y="206" class="mono">reporter_id  4</text>
  <text x="38" y="252" class="bad">같은 사실이 두 곳에 · 오타를 못 막음</text>
  <rect x="520" y="46" width="330" height="176" rx="8" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" />
  <text x="538" y="72" class="lbl">articles_v2</text>
  <text x="538" y="102" class="mono">id</text>
  <text x="538" y="128" class="mono">title</text>
  <text x="538" y="154" class="monoc">section_id   3</text>
  <text x="538" y="180" class="monoc">reporter_id  4</text>
  <text x="538" y="206" class="mono">views  comments</text>
  <rect x="520" y="278" width="150" height="66" rx="6" fill="#344A59" stroke="#6D869A" stroke-width="2" />
  <text x="536" y="302" class="lbl">sections</text>
  <text x="536" y="328" class="mono">3  '정치'</text>
  <rect x="700" y="278" width="150" height="66" rx="6" fill="#344A59" stroke="#6D869A" stroke-width="2" />
  <text x="716" y="302" class="lbl">reporters</text>
  <text x="716" y="328" class="mono">4  '김예은'</text>
  <path d="M 595 222 L 595 274" fill="none" stroke="#5CC6DE" stroke-width="2" marker-end="url(#dg1-b1)" />
  <path d="M 775 222 L 775 274" fill="none" stroke="#5CC6DE" stroke-width="2" marker-end="url(#dg1-b1)" />
  <text x="520" y="378" class="hot">번호가 가리키는 곳이 없으면 저장 자체가 거절된다</text>
  <text x="20" y="378" class="lbl">줄 수는 그대로 500건 —</text>
  <text x="20" y="402" class="lbl">달라진 것은 앞으로 들어올 수 있는 값이다</text>
  <defs>
    <marker id="dg1-b1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5CC6DE" />
    </marker>
  </defs>
</svg>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="compact" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" class="compact" data-marpit-pagination="6" style="--paginate:true;--class:compact;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EB%A7%8C%EB%93%AD%EB%8B%88%EB%8B%A4">만듭니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> articles_v2 (
    id           <span class="hljs-type">INT</span> AUTO_INCREMENT <span class="hljs-keyword">PRIMARY KEY</span>,
    title        <span class="hljs-type">VARCHAR</span>(<span class="hljs-number">200</span>) <span class="hljs-keyword">NOT NULL</span>,
    section_id   <span class="hljs-type">INT</span>          <span class="hljs-keyword">NOT NULL</span>,
    reporter_id  <span class="hljs-type">INT</span>          <span class="hljs-keyword">NOT NULL</span>,
    published_at DATETIME     <span class="hljs-keyword">NOT NULL</span>,
    views        <span class="hljs-type">INT</span>          <span class="hljs-keyword">CHECK</span> (views <span class="hljs-operator">&gt;=</span> <span class="hljs-number">0</span>),
    comments     <span class="hljs-type">INT</span>          <span class="hljs-keyword">NOT NULL</span> <span class="hljs-keyword">DEFAULT</span> <span class="hljs-number">0</span>,
    <span class="hljs-keyword">FOREIGN KEY</span> (section_id)  <span class="hljs-keyword">REFERENCES</span> sections(id),
    <span class="hljs-keyword">FOREIGN KEY</span> (reporter_id) <span class="hljs-keyword">REFERENCES</span> reporters(id)
);
</code></pre>
<blockquote>
<p><code>views</code> 에만 <code>NOT NULL</code> 이 없습니다. <strong>의도한 것입니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="compact" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" class="compact" data-marpit-pagination="7" style="--paginate:true;--class:compact;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EC%98%AE%EA%B2%A8-%EB%8B%B4%EC%8A%B5%EB%8B%88%EB%8B%A4">옮겨 담습니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> articles_v2
       (title, section_id, reporter_id, published_at, views, comments)
<span class="hljs-keyword">SELECT</span> a.title, s.id, a.reporter_id, a.published_at, a.views, a.comments
<span class="hljs-keyword">FROM</span>   articles a
<span class="hljs-keyword">JOIN</span>   sections s <span class="hljs-keyword">ON</span> s.name <span class="hljs-operator">=</span> a.section
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> a.id;
</code></pre>
<p><code>INSERT ... SELECT</code> — <strong>조회 결과를 그대로 넣습니다.</strong> 한 줄씩 옮기지 않습니다.</p>
<blockquote>
<p>여기서 <code>JOIN</code> 이 하는 일은 <code>'정치'</code> 라는 <strong>글자를 번호로 바꾸는 것</strong>입니다.<br />
<code>ORDER BY</code> 가 없으면 새 번호가 <strong>어떤 순서로 붙을지 보장되지 않습니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%ED%99%95%EC%9D%B8">확인</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FROM</span> articles_v2;
</code></pre>
<p><strong>500건.</strong> 하나도 잃지 않았습니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FROM</span> articles_v2 <span class="hljs-keyword">WHERE</span> views <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NULL</span>;
</code></pre>
<p><strong>25건.</strong> <code>NULL</code> 도 그대로 살아 있습니다.</p>
<blockquote>
<p>옮긴 뒤에는 <strong>건수를 반드시 대조하십시오.</strong> 조용히 줄어 있는 것이 가장 무섭습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="quiz" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" class="quiz" data-marpit-pagination="9" style="--paginate:true;--class:quiz;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A0--%EC%A2%85%ED%95%A9-%EC%84%A4%EA%B3%84--%EB%8C%80%EB%8C%93%EA%B8%80">실습 ① — 종합 설계 · 대댓글</h1>
<p><code>labs/01-db/day07/practice-1.sql</code></p>
<ol>
<li><strong>댓글 표</strong>를 설계해 만들기 — 타입 · 비어도 되나 · 기본값 · 외래키, 이유를 주석으로</li>
<li>정상 댓글 두 건 · 잘못된 값 세 가지가 <strong>전부 막히는지</strong></li>
<li><strong>대댓글</strong> — <code>parent_id</code> 열이 <strong>같은 표의 <code>id</code></strong> 를 가리키게 (<code>REFERENCES comments_tbl(id)</code>)</li>
<li>답글과 원댓글을 한 줄에 — <strong>4일차 셀프 조인</strong> · 막히는 것 두 가지(1452 · 1451)</li>
</ol>
<blockquote>
<p>25분. <strong>정답이 하나가 아닙니다</strong> — 왜 그렇게 정했는지 주석으로 적으세요.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="section" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" class="section" data-marpit-pagination="10" style="--paginate:true;--class:section;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="2%EC%B0%A8%EC%8B%9C">2차시</h1>
<h2 id="%EC%9D%B4%EB%A6%84%EC%9D%84-%EB%B6%99%EC%9D%B8%EB%8B%A4">이름을 붙인다</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EC%96%B4%EC%A0%9C-%EA%B3%BC%EC%A0%9C--department-%EB%A5%BC-%EB%B9%BC%EC%95%BC-%ED%95%A0%EA%B9%8C%EC%9A%94">어제 과제 — <code>department</code> 를 빼야 할까요</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span>   department, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> 기자수
<span class="hljs-keyword">FROM</span>     reporters
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> department
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> department;
</code></pre>
<blockquote>
<p><code>reporters</code> 는 <strong>19줄</strong>입니다. 부서 이름은 <strong>몇 종류</strong>일까요?</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EA%B2%B0%EA%B3%BC--19%EC%A4%84%EC%97%90-6%EC%A2%85%EB%A5%98">결과 — 19줄에 6종류</h1>
<table>
<thead>
<tr>
<th>부서</th>
<th style="text-align:right">기자수</th>
</tr>
</thead>
<tbody>
<tr>
<td>IT부 · 경제부 · 문화부</td>
<td style="text-align:right">각 3</td>
</tr>
<tr>
<td>사회부</td>
<td style="text-align:right">4</td>
</tr>
<tr>
<td>스포츠부 · 정치부</td>
<td style="text-align:right">각 3</td>
</tr>
</tbody>
</table>
<p><strong><code>'문화부'</code> 라는 글자가 3번, <code>'사회부'</code> 는 4번 따로 저장되어 있습니다.</strong></p>
<blockquote>
<p>1차시에 <code>section</code> 을 뺀 것과 <strong>똑같은 상황</strong>입니다. 그럼 이것도 빼야 할까요?<br />
오늘 그 판단에 <strong>이름을 붙입니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EC%A7%80%EA%B8%88%EA%B9%8C%EC%A7%80-%EC%9A%B0%EB%A6%AC%EA%B0%80-%ED%95%9C-%EC%9D%BC">지금까지 우리가 한 일</h1>
<table>
<thead>
<tr>
<th>무엇을 봤나</th>
<th>어떻게 했나</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>section</code> 이 글자라 오타가 들어간다</td>
<td><code>sections</code> 표로 빼고 번호로 가리켰다</td>
</tr>
<tr>
<td><code>reporter</code> 이름이 두 곳에 있다</td>
<td>열을 없애고 <code>reporter_id</code> 만 남겼다</td>
</tr>
</tbody>
</table>
<p><strong>규칙을 외워서 한 게 아닙니다.</strong> 불편해서, 어긋날 것 같아서 그렇게 했습니다.</p>
<blockquote>
<p>그 판단에는 <strong>60년 된 이름</strong>이 있습니다. 오늘 그것을 배웁니다.<br />
이름을 알면 <strong>처음 보는 표에서도 같은 판단</strong>을 할 수 있습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="1%EC%A0%95%EA%B7%9C%ED%98%95--%ED%95%9C-%EC%B9%B8%EC%97%90-%ED%95%98%EB%82%98%EB%A7%8C">1정규형 — 한 칸에 하나만</h1>
<p>이런 표가 있다고 해봅시다.</p>
<table>
<thead>
<tr>
<th>id</th>
<th>name</th>
<th>담당섹션</th>
</tr>
</thead>
<tbody>
<tr>
<td>4</td>
<td>김예은</td>
<td><code>정치, 사회</code></td>
</tr>
<tr>
<td>16</td>
<td>정다은</td>
<td><code>문화</code></td>
</tr>
</tbody>
</table>
<p><strong>한 칸에 값이 두 개</strong> 들어 있습니다.</p>
<blockquote>
<p>「사회를 담당하는 기자」를 찾으려면 어떻게 하죠? <code>LIKE '%사회%'</code> 로요?<br />
그러면 <code>'사회'</code> 와 <code>'사회복지'</code> 를 구분할 수 없습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="1%EC%A0%95%EA%B7%9C%ED%98%95--%EB%82%98%EB%88%84%EB%A9%B4">1정규형 — 나누면</h1>
<table>
<thead>
<tr>
<th>reporter_id</th>
<th>section</th>
</tr>
</thead>
<tbody>
<tr>
<td>4</td>
<td>정치</td>
</tr>
<tr>
<td>4</td>
<td>사회</td>
</tr>
</tbody>
</table>
<p><strong>한 줄에 하나씩.</strong> 이제 <code>WHERE section = '사회'</code> 로 정확히 찾습니다.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>우리 표들은 이미 1정규형입니다.</strong> 진짜 문제는 <strong>2·3정규형</strong>입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="2%EC%A0%95%EA%B7%9C%ED%98%95--%ED%82%A4%EC%9D%98-%EC%9D%BC%EB%B6%80%EC%97%90%EB%A7%8C-%EB%94%B8%EB%A6%B0-%EA%B2%83">2정규형 — 키의 「일부」에만 딸린 것</h1>
<p><strong>기본키를 열 두 개로 잡을 수도 있습니다.</strong> 태그는 <code>(기사번호, 태그)</code> 둘이 합쳐져야 한 줄이 정해집니다.</p>
<table>
<thead>
<tr>
<th>기사번호</th>
<th>태그</th>
<th>태그설명</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>예산</td>
<td>나라 살림</td>
</tr>
<tr>
<td>2</td>
<td>예산</td>
<td>나라 살림</td>
</tr>
</tbody>
</table>
<p><strong><code>태그설명</code> 은 <code>태그</code> 만 알면 정해집니다.</strong> 기사번호와는 상관없죠.</p>
<blockquote>
<p>「예산」이 100개 기사에 붙으면 <strong><code>나라 살림</code> 이 100번 저장</strong>됩니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="2%EC%A0%95%EA%B7%9C%ED%98%95--%EB%82%98%EB%88%84%EB%A9%B4">2정규형 — 나누면</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>기사태그(기사번호, 태그)          ← 어느 기사에 어떤 태그가
태그(태그, 설명)                  ← 태그의 설명은 한 곳에만
</code></pre>
<p><strong>복합키의 일부에만 딸린 열을 밖으로 뺀다.</strong> 이것이 2정규형입니다.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>기본키가 열 하나면 2정규형은 자동으로 만족합니다.</strong><br />
「일부」가 없으니까요. 우리 표들이 그렇습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="3%EC%A0%95%EA%B7%9C%ED%98%95--%ED%82%A4%EA%B0%80-%EC%95%84%EB%8B%8C-%EA%B2%83%EC%97%90-%EB%94%B8%EB%A6%B0-%EA%B2%83">3정규형 — 키가 아닌 것에 딸린 것</h1>
<p>1차시에 <code>articles_v2</code> 를 만들면서 본 그것입니다.</p>
<table>
<thead>
<tr>
<th>id</th>
<th>title</th>
<th>reporter_id</th>
<th>reporter</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>여야 예산안…</td>
<td>18</td>
<td>조채원</td>
</tr>
</tbody>
</table>
<p><code>reporter</code> 는 <code>id</code> 가 아니라 <strong><code>reporter_id</code> 를 알면 정해집니다.</strong></p>
<p><strong>키 → 다른 열 → 또 다른 열.</strong> 이렇게 한 다리 건너 딸린 것을 <strong>이행 종속</strong>이라 합니다.</p>
<blockquote>
<p>1차시에 <code>reporter</code> 열을 없앤 것이 <strong>3정규형을 맞춘 것</strong>이었습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%ED%95%9C-%ED%91%9C%EB%A1%9C-%EB%94%B0%EB%9D%BC%EA%B0%80%EA%B8%B0-%E2%93%AA--%ED%95%9C-%EC%B9%B8%EC%97%90-%EC%97%AC%EB%9F%AC-%EA%B0%92">한 표로 따라가기 ⓪ — 한 칸에 여러 값</h1>
<p>지금까지는 단계마다 <strong>다른 표</strong>를 봤습니다. 이번엔 <strong>표 하나</strong>를 처음부터 끝까지 나눕니다.</p>
<svg style="display:block;margin:0 auto 18px" id="dg2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 779 246" width="780" height="246" role="img" aria-label="비정규형 기사 표. 기사 1번 한 줄의 태그 칸에 예산과 국회 두 값이, 태그설명 칸에 나라 살림과 입법부 두 값이 들어 있다">
  <g font-family="'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
<text x="10" y="26" fill="#9DB0BE" font-size="16">기사 (비정규형)</text><rect x="10" y="36" width="759" height="144" fill="#344A59" stroke="#6D869A" stroke-width="1.5" /><rect x="10" y="36" width="759" height="36" fill="#5CC6DE" /><text x="24" y="60" fill="#0A1218" font-size="17" font-weight="600" text-decoration="underline">기사번호</text><text x="24" y="96" fill="#FFFFFF" font-size="17">1</text><text x="24" y="132" fill="#FFFFFF" font-size="17">10</text><text x="24" y="168" fill="#FFFFFF" font-size="17">16</text><line x1="106" y1="36" x2="106" y2="180" stroke="#6D869A" stroke-width="1" /><text x="120" y="60" fill="#0A1218" font-size="17" font-weight="600">제목</text><text x="120" y="96" fill="#FFFFFF" font-size="17">여야 예산안 놓고 공방</text><text x="120" y="132" fill="#FFFFFF" font-size="17">국회 개편안 국회 제출</text><text x="120" y="168" fill="#FFFFFF" font-size="17">미술관 신작 공개</text><line x1="316" y1="36" x2="316" y2="180" stroke="#6D869A" stroke-width="1" /><text x="330" y="60" fill="#0A1218" font-size="17" font-weight="600">기자ID</text><text x="330" y="96" fill="#FFFFFF" font-size="17">18</text><text x="330" y="132" fill="#FFFFFF" font-size="17">18</text><text x="330" y="168" fill="#FFFFFF" font-size="17">16</text><line x1="398" y1="36" x2="398" y2="180" stroke="#6D869A" stroke-width="1" /><text x="412" y="60" fill="#0A1218" font-size="17" font-weight="600">기자명</text><text x="412" y="96" fill="#FFFFFF" font-size="17">조채원</text><text x="412" y="132" fill="#FFFFFF" font-size="17">조채원</text><text x="412" y="168" fill="#FFFFFF" font-size="17">정다은</text><line x1="477" y1="36" x2="477" y2="180" stroke="#6D869A" stroke-width="1" /><text x="491" y="60" fill="#0A1218" font-size="17" font-weight="600">태그</text><rect x="478" y="73" width="114" height="34" fill="#4A3A18" stroke="#F2C879" stroke-width="1.5" /><text x="491" y="96" fill="#F2C879" font-size="17">예산, 국회</text><text x="491" y="132" fill="#FFFFFF" font-size="17">국회</text><text x="491" y="168" fill="#FFFFFF" font-size="17">전시</text><line x1="593" y1="36" x2="593" y2="180" stroke="#6D869A" stroke-width="1" /><text x="607" y="60" fill="#0A1218" font-size="17" font-weight="600">태그설명</text><rect x="594" y="73" width="174" height="34" fill="#4A3A18" stroke="#F2C879" stroke-width="1.5" /><text x="607" y="96" fill="#F2C879" font-size="17">나라 살림, 입법부</text><text x="607" y="132" fill="#FFFFFF" font-size="17">입법부</text><text x="607" y="168" fill="#FFFFFF" font-size="17">미술·공연</text><line x1="10" y1="72" x2="769" y2="72" stroke="#6D869A" stroke-width="1" /><line x1="10" y1="108" x2="769" y2="108" stroke="#6D869A" stroke-width="1" /><line x1="10" y1="144" x2="769" y2="144" stroke="#6D869A" stroke-width="1" /><rect x="10" y="210" width="18" height="18" fill="#4A3A18" stroke="#F2C879" stroke-width="1.5" /><text x="36" y="225" fill="#9DB0BE" font-size="16">노란 칸 = 한 칸에 값이 둘  ·  밑줄 = 기본키</text>
  </g>
</svg>
<blockquote>
<p>기사 1번의 태그 칸에 <strong>값이 둘</strong>입니다. 「국회 태그가 붙은 기사」를 <code>=</code> 로 못 찾습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%E2%91%A0-1%EC%A0%95%EA%B7%9C%ED%99%94--%EC%B9%B8%EB%A7%88%EB%8B%A4-%EA%B0%92-%ED%95%98%EB%82%98-%EC%A4%84%EB%A1%9C-%EB%82%98%EB%88%88%EB%8B%A4">① 1정규화 — 칸마다 값 하나, 줄로 나눈다</h1>
<svg style="display:block;margin:0 auto 18px" id="dg3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 655 282" width="620" height="267" role="img" aria-label="1정규형 기사 표. 태그를 한 줄에 하나씩 나눠 네 줄이 되고 기본키는 기사번호와 태그 둘이다. 기사 1번의 제목과 기자 정보가 두 번, 국회의 태그설명 입법부가 두 번 저장되어 노랗게 표시된다">
  <g font-family="'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
<text x="10" y="26" fill="#9DB0BE" font-size="16">기사 (1정규형) — 키가 (기사번호, 태그) 둘</text><rect x="10" y="36" width="635" height="180" fill="#344A59" stroke="#6D869A" stroke-width="1.5" /><rect x="10" y="36" width="635" height="36" fill="#5CC6DE" /><text x="24" y="60" fill="#0A1218" font-size="17" font-weight="600" text-decoration="underline">기사번호</text><text x="24" y="96" fill="#FFFFFF" font-size="17">1</text><text x="24" y="132" fill="#FFFFFF" font-size="17">1</text><text x="24" y="168" fill="#FFFFFF" font-size="17">10</text><text x="24" y="204" fill="#FFFFFF" font-size="17">16</text><line x1="106" y1="36" x2="106" y2="216" stroke="#6D869A" stroke-width="1" /><text x="120" y="60" fill="#0A1218" font-size="17" font-weight="600">제목</text><rect x="107" y="73" width="208" height="34" fill="#4A3A18" stroke="#F2C879" stroke-width="1.5" /><text x="120" y="96" fill="#F2C879" font-size="17">여야 예산안 놓고 공방</text><rect x="107" y="109" width="208" height="34" fill="#4A3A18" stroke="#F2C879" stroke-width="1.5" /><text x="120" y="132" fill="#F2C879" font-size="17">여야 예산안 놓고 공방</text><text x="120" y="168" fill="#FFFFFF" font-size="17">국회 개편안 국회 제출</text><text x="120" y="204" fill="#FFFFFF" font-size="17">미술관 신작 공개</text><line x1="316" y1="36" x2="316" y2="216" stroke="#6D869A" stroke-width="1" /><text x="330" y="60" fill="#0A1218" font-size="17" font-weight="600">기자ID</text><rect x="317" y="73" width="80" height="34" fill="#4A3A18" stroke="#F2C879" stroke-width="1.5" /><text x="330" y="96" fill="#F2C879" font-size="17">18</text><rect x="317" y="109" width="80" height="34" fill="#4A3A18" stroke="#F2C879" stroke-width="1.5" /><text x="330" y="132" fill="#F2C879" font-size="17">18</text><text x="330" y="168" fill="#FFFFFF" font-size="17">18</text><text x="330" y="204" fill="#FFFFFF" font-size="17">16</text><line x1="398" y1="36" x2="398" y2="216" stroke="#6D869A" stroke-width="1" /><text x="412" y="60" fill="#0A1218" font-size="17" font-weight="600">기자명</text><rect x="399" y="73" width="77" height="34" fill="#4A3A18" stroke="#F2C879" stroke-width="1.5" /><text x="412" y="96" fill="#F2C879" font-size="17">조채원</text><rect x="399" y="109" width="77" height="34" fill="#4A3A18" stroke="#F2C879" stroke-width="1.5" /><text x="412" y="132" fill="#F2C879" font-size="17">조채원</text><text x="412" y="168" fill="#FFFFFF" font-size="17">조채원</text><text x="412" y="204" fill="#FFFFFF" font-size="17">정다은</text><line x1="477" y1="36" x2="477" y2="216" stroke="#6D869A" stroke-width="1" /><text x="491" y="60" fill="#0A1218" font-size="17" font-weight="600" text-decoration="underline">태그</text><text x="491" y="96" fill="#FFFFFF" font-size="17">예산</text><text x="491" y="132" fill="#FFFFFF" font-size="17">국회</text><text x="491" y="168" fill="#FFFFFF" font-size="17">국회</text><text x="491" y="204" fill="#FFFFFF" font-size="17">전시</text><line x1="539" y1="36" x2="539" y2="216" stroke="#6D869A" stroke-width="1" /><text x="553" y="60" fill="#0A1218" font-size="17" font-weight="600">태그설명</text><text x="553" y="96" fill="#FFFFFF" font-size="17">나라 살림</text><rect x="540" y="109" width="104" height="34" fill="#4A3A18" stroke="#F2C879" stroke-width="1.5" /><text x="553" y="132" fill="#F2C879" font-size="17">입법부</text><rect x="540" y="145" width="104" height="34" fill="#4A3A18" stroke="#F2C879" stroke-width="1.5" /><text x="553" y="168" fill="#F2C879" font-size="17">입법부</text><text x="553" y="204" fill="#FFFFFF" font-size="17">미술·공연</text><line x1="10" y1="72" x2="645" y2="72" stroke="#6D869A" stroke-width="1" /><line x1="10" y1="108" x2="645" y2="108" stroke="#6D869A" stroke-width="1" /><line x1="10" y1="144" x2="645" y2="144" stroke="#6D869A" stroke-width="1" /><line x1="10" y1="180" x2="645" y2="180" stroke="#6D869A" stroke-width="1" /><rect x="10" y="246" width="18" height="18" fill="#4A3A18" stroke="#F2C879" stroke-width="1.5" /><text x="36" y="261" fill="#9DB0BE" font-size="16">노란 칸 = 같은 사실이 두 번 이상 저장된 칸  ·  밑줄 = 기본키</text>
  </g>
</svg>
<blockquote>
<p>키가 <strong>(기사번호, 태그)</strong> 둘이 됐습니다. 그런데 노란 칸 — <strong>같은 사실이 두 번</strong> 저장됩니다.<br />
제목·기자는 <strong>기사번호만</strong>, 태그설명은 <strong>태그만</strong> 알면 정해지기 때문입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%E2%91%A1-2%EC%A0%95%EA%B7%9C%ED%99%94--%ED%82%A4%EC%9D%98-%EC%9D%BC%EB%B6%80%EC%97%90-%EB%94%B8%EB%A6%B0-%EC%97%B4%EC%9D%84-%EB%BA%80%EB%8B%A4">② 2정규화 — 키의 일부에 딸린 열을 뺀다</h1>
<svg style="display:block;margin:0 auto 18px" id="dg4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 881 282" width="780" height="250" role="img" aria-label="2정규형. 기사 표(기사번호, 제목, 기자ID, 기자명), 태그 표(태그, 태그설명), 기사태그 표(기사번호, 태그) 셋으로 나뉜다. 기사 표의 기자명 조채원이 두 번 저장되어 노랗게 남아 있다">
  <g font-family="'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">

8" font-size="17" font-weight="600">기자명</text><text x="575" y="96" fill="#FFFFFF" font-size="17">조채원</text><text x="575" y="132" fill="#FFFFFF" font-size="17">정다은</text><line x1="479" y1="72" x2="640" y2="72" stroke="#6D869A" stroke-width="1" /><line x1="479" y1="108" x2="640" y2="108" stroke="#6D869A" stroke-width="1" /><text x="674" y="26" fill="#9DB0BE" font-size="16">태그</text><rect x="674" y="36" width="168" height="144" fill="#344A59" stroke="#6D869A" stroke-width="1.5" /><rect x="674" y="36" width="168" height="36" fill="#5CC6DE" /><text x="688" y="60" fill="#0A1218" font-size="17" font-weight="600" text-decoration="underline">태그</text><text x="688" y="96" fill="#FFFFFF" font-size="17">예산</text><text x="688" y="132" fill="#FFFFFF" font-size="17">국회</text><text x="688" y="168" fill="#FFFFFF" font-size="17">전시</text><line x1="736" y1="36" x2="736" y2="180" stroke="#6D869A" stroke-width="1" /><text x="750" y="60" fill="#0A1218" font-size="17" font-weight="600">태그설명</text><text x="750" y="96" fill="#FFFFFF" font-size="17">나라 살림</text><text x="750" y="132" fill="#FFFFFF" font-size="17">입법부</text><text x="750" y="168" fill="#FFFFFF" font-size="17">미술·공연</text><line x1="674" y1="72" x2="842" y2="72" stroke="#6D869A" stroke-width="1" /><line x1="674" y1="108" x2="842" y2="108" stroke="#6D869A" stroke-width="1" /><line x1="674" y1="144" x2="842" y2="144" stroke="#6D869A" stroke-width="1" /><text x="876" y="26" fill="#9DB0BE" font-size="16">기사태그</text><rect x="876" y="36" width="158" height="180" fill="#344A59" stroke="#6D869A" stroke-width="1.5" /><rect x="876" y="36" width="158" height="36" fill="#5CC6DE" /><text x="890" y="60" fill="#0A1218" font-size="17" font-weight="600" text-decoration="underline">기사번호</text><text x="890" y="96" fill="#FFFFFF" font-size="17">1</text><text x="890" y="132" fill="#FFFFFF" font-size="17">1</text><text x="890" y="168" fill="#FFFFFF" font-size="17">10</text><text x="890" y="204" fill="#FFFFFF" font-size="17">16</text><line x1="972" y1="36" x2="972" y2="216" stroke="#6D869A" stroke-width="1" /><text x="986" y="60" fill="#0A1218" font-size="17" font-weight="600" text-decoration="underline">태그</text><text x="986" y="96" fill="#FFFFFF" font-size="17">예산</text><text x="986" y="132" fill="#FFFFFF" font-size="17">국회</text><text x="986" y="168" fill="#FFFFFF" font-size="17">국회</text><text x="986" y="204" fill="#FFFFFF" font-size="17">전시</text><line x1="876" y1="72" x2="1034" y2="72" stroke="#6D869A" stroke-width="1" /><line x1="876" y1="108" x2="1034" y2="108" stroke="#6D869A" stroke-width="1" /><line x1="876" y1="144" x2="1034" y2="144" stroke="#6D869A" stroke-width="1" /><line x1="876" y1="180" x2="1034" y2="180" stroke="#6D869A" stroke-width="1" /><text x="10" y="261" fill="#9DB0BE" font-size="16">같은 사실은 한 곳에만  ·  밑줄 = 기본키  ·  FK = 다른 표의 키를 가리킨다</text>
  </g>

<blockquote>
<p><strong>기사번호 → 기자ID → 기자명</strong> — 한 다리 건너 딸린 <code>기자명</code> 을 <strong>기자</strong> 표로 뺐습니다.<br />
노란 칸이 없습니다. 이 「기사 · 기자」가 1차시의 <code>articles_v2</code> · <code>reporters</code> 입니다.</p>
</blockquote>

<h1 id="%EB%8B%A8%EA%B3%84%EB%B3%84-%ED%95%B5%EC%8B%AC--%ED%95%9C-%ED%91%9C%EB%A1%9C-%EC%A0%95%EB%A6%AC">단계별 핵심 — 한 표로 정리</h1>
<table>
<thead>
<tr>
<th>단계</th>
<th>조건</th>
<th>없애는 것</th>
<th>이 표에서 한 일</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1NF</strong></td>
<td>모든 칸이 <strong>값 하나</strong></td>
<td>한 칸의 여러 값</td>
<td><code>예산, 국회</code> 를 줄로 나누고 키를 <strong>(기사번호, 태그)</strong> 로</td>
</tr>
<tr>
<td><strong>2NF</strong></td>
<td>1NF + <strong>부분 종속 없음</strong></td>
<td>복합키의 <strong>일부에만</strong> 딸린 열</td>
<td>제목·기자는 기사번호에, 태그설명은 태그에 딸리므로 → 기사 · 태그 · 기사태그</td>
</tr>
<tr>
<td><strong>3NF</strong></td>
<td>2NF + <strong>이행 종속 없음</strong></td>
<td>키가 아닌 열에 딸린 열</td>
<td>기사번호 → 기자ID → 기자명 이므로 기자명을 <strong>기자</strong> 표로</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 셋 다 목적은 하나 — <strong>같은 사실이 두 곳에 있지 않게.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EC%84%B8-%EB%8B%A8%EA%B3%84%EB%A5%BC-%ED%95%9C-%EC%9E%A5%EC%9C%BC%EB%A1%9C">세 단계를 한 장으로</h1>
<svg style="display:block;margin:0 auto 18px" id="dg6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="1030" height="416" aria-label="1정규형은 한 칸에 값 하나, 2정규형은 복합키의 일부에만 딸린 열을 분리, 3정규형은 키가 아닌 열에 딸린 열을 분리하는 것을 단계로 보여준다">
  <style>
#dg6 .stg{ font-family:var(--sans); font-size:21px; font-weight:600; fill:#5CC6DE; }
#dg6 .ttl{ font-family:var(--sans); font-size:17px; font-weight:600; fill:#FFFFFF; }
#dg6 .lbl{ font-family:var(--sans); font-size:15px; fill:#9DB0BE; }
#dg6 .bad{ font-family:var(--mono); font-size:15px; fill:#EC8B81; }
#dg6 .good{ font-family:var(--mono); font-size:15px; fill:#FFFFFF; }
#dg6 .hot{ font-family:var(--sans); font-size:19px; font-weight:600; fill:#F2C879; }
  </style>
  <rect x="20" y="46" width="280" height="180" rx="9" fill="#4A211E" stroke="#EC8B81" stroke-width="2" />
  <text x="34" y="30" class="stg">1정규형</text>
  <text x="40" y="74" class="ttl">한 칸에 하나만</text>
  <text x="40" y="106" class="bad">담당섹션</text>
  <text x="40" y="132" class="bad">'정치, 사회'</text>
  <text x="40" y="170" class="lbl">한 칸에 값이 둘 —</text>
  <text x="40" y="194" class="lbl">찾을 수가 없다</text>
  <rect x="330" y="46" width="280" height="180" rx="9" fill="#4A211E" stroke="#EC8B81" stroke-width="2" />
  <text x="344" y="30" class="stg">2정규형</text>
  <text x="350" y="74" class="ttl">키의 일부에 딸린 것</text>
  <text x="350" y="106" class="good">기사번호 · 태그  ← 키</text>
  <text x="350" y="132" class="bad">태그설명</text>
  <text x="350" y="170" class="lbl">태그만 알면 정해진다</text>
  <text x="350" y="194" class="lbl">기사번호와 무관</text>
  <rect x="640" y="46" width="280" height="180" rx="9" fill="#4A211E" stroke="#EC8B81" stroke-width="2" />
  <text x="654" y="30" class="stg">3정규형</text>
  <text x="660" y="74" class="ttl">다리 건너 딸린 것</text>
  <text x="660" y="106" class="good">id  ← 키</text>
  <text x="660" y="132" class="good">reporter_id</text>
  <text x="660" y="158" class="bad">reporter</text>
  <text x="660" y="194" class="lbl">id → reporter_id → 이름</text>
  <path d="M 160 226 L 160 268" fill="none" stroke="#5CC6DE" stroke-width="2.5" marker-end="url(#dg6-n1)" />
  <path d="M 470 226 L 470 268" fill="none" stroke="#5CC6DE" stroke-width="2.5" marker-end="url(#dg6-n1)" />
  <path d="M 780 226 L 780 268" fill="none" stroke="#5CC6DE" stroke-width="2.5" marker-end="url(#dg6-n1)" />
  <rect x="20" y="274" width="280" height="46" rx="7" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" />
  <text x="160" y="303" class="ttl" text-anchor="middle">줄을 나눈다</text>
  <rect x="330" y="274" width="280" height="46" rx="7" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" />
  <text x="470" y="303" class="ttl" text-anchor="middle">태그 표로 뺀다</text>
  <rect x="640" y="274" width="280" height="46" rx="7" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" />

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-class="quiz" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" class="quiz" data-marpit-pagination="25" style="--paginate:true;--class:quiz;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A1">실습 ②</h1>
<p><code>labs/01-db/day07/practice-2.sql</code></p>
<p><strong>표를 보고 몇 정규형을 어겼는지 판단</strong>합니다. 고치지는 않습니다.</p>
<ol>
<li>우리 <code>reporters</code> 표는 몇 정규형까지 만족합니까?</li>
<li><code>department</code> 를 빼면 무엇이 좋아집니까</li>
<li>주어진 표 세 개가 각각 어디를 어겼는지 찾기</li>
</ol>
<blockquote>
<p>12분. <strong>판단에는 근거를 한 줄씩 적으세요.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="section" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" class="section" data-marpit-pagination="26" style="--paginate:true;--class:section;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="3%EC%B0%A8%EC%8B%9C">3차시</h1>
<h2 id="%EC%8B%A4%EC%A0%9C%EB%A1%9C-%EB%82%98%EB%88%88%EB%8B%A4">실제로 나눈다</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EB%B6%80%EC%84%9C%EB%A5%BC-%ED%91%9C%EB%A1%9C-%EB%B9%BC%EA%B8%B0">부서를 표로 빼기</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> departments (
    id   <span class="hljs-type">INT</span> AUTO_INCREMENT <span class="hljs-keyword">PRIMARY KEY</span>,
    name <span class="hljs-type">VARCHAR</span>(<span class="hljs-number">20</span>) <span class="hljs-keyword">NOT NULL</span> <span class="hljs-keyword">UNIQUE</span>
);

<span class="hljs-keyword">INSERT INTO</span> departments (name)
<span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">DISTINCT</span> department <span class="hljs-keyword">FROM</span> reporters <span class="hljs-keyword">WHERE</span> department <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NOT NULL</span>;
</code></pre>
<p><code>DISTINCT</code> 로 <strong>있는 부서만</strong> 그대로 옮깁니다.</p>
<blockquote>
<p>어제 <code>sections</code> 는 손으로 적었습니다. <strong>표가 커지면 손으로 못 적습니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="compact" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" class="compact" data-marpit-pagination="28" style="--paginate:true;--class:compact;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EA%B8%B0%EC%9E%90-%ED%91%9C%EC%97%90-%EB%B6%80%EC%84%9C-%EB%B2%88%ED%98%B8-%EB%8B%AC%EA%B8%B0">기자 표에 부서 번호 달기</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> reporters <span class="hljs-keyword">ADD</span> <span class="hljs-keyword">COLUMN</span> dept_id <span class="hljs-type">INT</span>;

<span class="hljs-keyword">SET</span> SQL_SAFE_UPDATES <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;      <span class="hljs-comment">-- 표 전체를 바꿉니다. 끝나면 되돌립니다</span>

<span class="hljs-keyword">UPDATE</span> reporters r
<span class="hljs-keyword">JOIN</span>   departments d <span class="hljs-keyword">ON</span> d.name <span class="hljs-operator">=</span> r.department
<span class="hljs-keyword">SET</span>    r.dept_id <span class="hljs-operator">=</span> d.id;

<span class="hljs-keyword">SET</span> SQL_SAFE_UPDATES <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;      <span class="hljs-comment">-- 반드시 되돌릴 것</span>
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 어제 <strong>끄지 말라</strong>고 한 그 안전장치입니다. 표 전체를 일부러 바꾸는 지금만 끕니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EC%99%B8%EB%9E%98%ED%82%A4%EB%A1%9C-%EC%9E%A0%EA%B7%BC%EB%8B%A4">외래키로 잠근다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> reporters
  <span class="hljs-keyword">ADD CONSTRAINT</span> fk_reporters_dept
  <span class="hljs-keyword">FOREIGN KEY</span> (dept_id) <span class="hljs-keyword">REFERENCES</span> departments(id);
</code></pre>
<p><strong>붙이고 → 채우고 → 잠근다.</strong> 순서가 중요합니다.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>제약은 데이터가 맞은 뒤에 붙입니다.</strong> 어긋난 값이 하나라도 있으면 거부됩니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%ED%99%95%EC%9D%B8--%EA%B7%B8%EB%A6%AC%EA%B3%A0-%EC%9B%90%EB%9E%98-%EC%97%B4%EC%9D%80">확인 — 그리고 원래 열은?</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> 안채워진기자 <span class="hljs-keyword">FROM</span> reporters <span class="hljs-keyword">WHERE</span> dept_id <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NULL</span>;
</code></pre>
<p><strong>0명.</strong> 전부 채워졌습니다.</p>
<p>이제 <code>reporters.department</code> 는 <strong>같은 사실을 두 번째로</strong> 갖고 있습니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> reporters <span class="hljs-keyword">DROP</span> <span class="hljs-keyword">COLUMN</span> department;
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>오늘은 지우지 않습니다</strong> — 내일 1차시 실습에서 비교에 씁니다. 지운 열은 안 돌아옵니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-class="compact" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" class="compact" data-marpit-pagination="31" style="--paginate:true;--class:compact;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="alter-table--%EC%9D%B4%EB%AF%B8-%EC%9E%88%EB%8A%94-%ED%91%9C-%EA%B3%A0%EC%B9%98%EA%B8%B0">ALTER TABLE — 이미 있는 표 고치기</h1>
<table>
<thead>
<tr>
<th>하고 싶은 것</th>
<th><code>ALTER TABLE 표</code> 뒤에</th>
</tr>
</thead>
<tbody>
<tr>
<td>열 추가</td>
<td><code>ADD COLUMN dept_id INT</code> — 23번</td>
</tr>
<tr>
<td>제약 붙이기</td>
<td><code>ADD CONSTRAINT … FOREIGN KEY …</code> — 24번</td>
</tr>
<tr>
<td>열 지우기</td>
<td><code>DROP COLUMN department</code> — 25번</td>
</tr>
<tr>
<td>열 타입 바꾸기</td>
<td><code>MODIFY COLUMN body VARCHAR(500)</code></td>
</tr>
<tr>
<td>열 이름 바꾸기</td>
<td><code>RENAME COLUMN body TO content</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 데이터가 있는 열을 <strong>좁히면</strong> 거부됩니다 — <code>ERROR 1406 Data too long</code>. 넓히는 것은 됩니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%F0%9F%94%B4-%EA%B7%B8%EB%9F%BC-%EB%8B%A4-%EB%82%98%EB%88%84%EB%A9%B4-%EB%90%98%EB%82%98%EC%9A%94"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 그럼 다 나누면 되나요?</h1>
<p><strong>아닙니다.</strong> 나눌수록 <strong>다시 붙이는 비용</strong>이 늘어납니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> a.title, r.name, d.name
<span class="hljs-keyword">FROM</span>   articles_v2 a
<span class="hljs-keyword">JOIN</span>   reporters r    <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id
<span class="hljs-keyword">JOIN</span>   departments d  <span class="hljs-keyword">ON</span> r.dept_id <span class="hljs-operator">=</span> d.id;
</code></pre>
<p>부서 이름 하나 보려고 <strong>표 세 개</strong>를 이어야 합니다.</p>
<blockquote>
<p>어제는 &quot;규칙을 표에 새긴다&quot; 였고, 오늘은 <strong>&quot;어디까지 새길 것인가&quot;</strong> 입니다.<br />
정답이 하나가 아닙니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EB%B9%84%EC%A0%95%EA%B7%9C%ED%99%94--%EC%9D%BC%EB%B6%80%EB%9F%AC-%EC%A4%91%EB%B3%B5%EC%9D%84-%EB%91%94%EB%8B%A4">비정규화 — 일부러 중복을 둔다</h1>
<p>1차시 실습 ① ★ 에서 남겨둔 질문입니다. 지금 함께 실행해 봅니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> a.comments <span class="hljs-keyword">AS</span> 저장된수, <span class="hljs-built_in">COUNT</span>(c.id) <span class="hljs-keyword">AS</span> 실제댓글수
<span class="hljs-keyword">FROM</span>   articles_v2 a
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> comments_tbl c <span class="hljs-keyword">ON</span> c.article_id <span class="hljs-operator">=</span> a.id
<span class="hljs-keyword">WHERE</span>  a.id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> a.id, a.comments;
</code></pre>
<p><strong>129 vs 2.</strong> 댓글 수를 열로 갖고 있는데 실제와 어긋났습니다.</p>
<blockquote>
<p>그런데 이 열을 <strong>일부러 두기도 합니다.</strong> 목록에서 매번 <code>COUNT</code> 하면 느리니까요.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EC%A0%95%EA%B7%9C%ED%99%94-%E2%86%94-%EB%B9%84%EC%A0%95%EA%B7%9C%ED%99%94">정규화 ↔ 비정규화</h1>
<table>
<thead>
<tr>
<th></th>
<th>정규화</th>
<th>비정규화</th>
</tr>
</thead>
<tbody>
<tr>
<td>같은 사실</td>
<td>한 곳에만</td>
<td>일부러 여러 곳에</td>
</tr>
<tr>
<td>어긋날 위험</td>
<td>없다</td>
<td><strong>있다</strong></td>
</tr>
<tr>
<td>읽는 속도</td>
<td><code>JOIN</code> 이 는다</td>
<td>빠르다</td>
</tr>
<tr>
<td>책임</td>
<td>구조가 진다</td>
<td><strong>사람이 진다</strong></td>
</tr>
</tbody>
</table>
<p><strong>비정규화는 &quot;틀려도 된다&quot;가 아니라 &quot;내가 맞춰 놓겠다&quot;는 약속입니다.</strong></p>
<blockquote>
<p>그 약속을 지키는 도구가 <strong>오늘 4차시</strong>입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="quiz" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" class="quiz" data-marpit-pagination="35" style="--paginate:true;--class:quiz;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A2">실습 ③</h1>
<p><code>labs/01-db/day07/practice-3.sql</code></p>
<p>부서를 실제로 표로 빼 봅니다.</p>
<ol>
<li><code>departments</code> 표 만들고 데이터에서 뽑아 넣기</li>
<li><code>reporters.dept_id</code> 붙이고 채우고 외래키 걸기</li>
<li>안 채워진 기자가 없는지 확인</li>
<li>★ 부서별 기자 수를 <strong>새 구조로</strong> 조회</li>
</ol>
<blockquote>
<p>14분. <strong><code>department</code> 열은 아직 지우지 마세요.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-class="section" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" class="section" data-marpit-pagination="36" style="--paginate:true;--class:section;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="4%EC%B0%A8%EC%8B%9C">4차시</h1>
<h2 id="%ED%8A%B8%EB%9E%9C%EC%9E%AD%EC%85%98">트랜잭션</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EB%8C%93%EA%B8%80-%ED%95%98%EB%82%98%EB%A5%BC-%EB%8B%AC%EB%A9%B4-%EB%91%90-%EA%B3%B3%EC%9D%B4-%EB%B0%94%EB%80%9D%EB%8B%88%EB%8B%A4">댓글 하나를 달면 두 곳이 바뀝니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> comments_tbl (article_id, author, body, created_at)
<span class="hljs-keyword">VALUES</span> (<span class="hljs-number">1</span>, <span class="hljs-string">&#x27;독자E&#x27;</span>, <span class="hljs-string">&#x27;좋은 기사네요&#x27;</span>, <span class="hljs-string">&#x27;2026-10-23 15:00:00&#x27;</span>);

<span class="hljs-keyword">UPDATE</span> articles_v2 <span class="hljs-keyword">SET</span> comments <span class="hljs-operator">=</span> comments <span class="hljs-operator">+</span> <span class="hljs-number">1</span> <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
<p>댓글을 <strong>넣고</strong>, 개수를 <strong>1 올립니다.</strong> 두 문장이 <strong>항상 같이</strong> 일어나야 합니다.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>첫 줄만 되고 둘째 줄이 안 되면?</strong> 댓글은 있는데 개수는 그대로입니다.<br />
3차시에 본 「129 vs 2」가 이렇게 생깁니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-class="quiz" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" class="quiz" data-marpit-pagination="38" style="--paginate:true;--class:quiz;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EC%A4%91%EA%B0%84%EC%97%90-%EB%81%8A%EA%B8%B0%EB%A9%B4-%EC%96%B4%EB%96%BB%EA%B2%8C-%EB%90%A0%EA%B9%8C%EC%9A%94">중간에 끊기면 어떻게 될까요</h1>
<p>첫 문장이 성공한 <strong>직후</strong>에 이런 일이 생긴다면:</p>
<ul>
<li>서버가 꺼진다</li>
<li>네트워크가 끊긴다</li>
<li>둘째 문장에 오타가 있어 오류가 난다</li>
</ul>
<p><strong>이미 들어간 댓글은 어떻게 됩니까?</strong></p>
<blockquote>
<p>지금까지 배운 것만으로는 <strong>되돌릴 방법이 없습니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EB%AC%B6%EC%8A%B5%EB%8B%88%EB%8B%A4--%ED%8A%B8%EB%9E%9C%EC%9E%AD%EC%85%98">묶습니다 — 트랜잭션</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">START</span> TRANSACTION;
<span class="hljs-keyword">INSERT INTO</span> comments_tbl (article_id, author, body, created_at)
<span class="hljs-keyword">VALUES</span> (<span class="hljs-number">1</span>, <span class="hljs-string">&#x27;독자E&#x27;</span>, <span class="hljs-string">&#x27;좋은 기사네요&#x27;</span>, <span class="hljs-string">&#x27;2026-10-23 15:00:00&#x27;</span>);
<span class="hljs-keyword">UPDATE</span> articles_v2 <span class="hljs-keyword">SET</span> comments <span class="hljs-operator">=</span> comments <span class="hljs-operator">+</span> <span class="hljs-number">1</span> <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
<span class="hljs-keyword">COMMIT</span>;
</code></pre>
<p><strong><code>COMMIT</code> 을 만나야 비로소 확정</strong>됩니다. 그 전까지는 나만 보는 상태입니다.</p>
<blockquote>
<p><strong>전부 되거나, 전부 안 되거나.</strong> 중간은 없습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EB%90%98%EB%8F%8C%EB%A6%AC%EA%B8%B0--rollback">되돌리기 — ROLLBACK</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">START</span> TRANSACTION;
<span class="hljs-keyword">UPDATE</span> articles_v2 <span class="hljs-keyword">SET</span> comments <span class="hljs-operator">=</span> <span class="hljs-number">9999</span> <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
<span class="hljs-keyword">SELECT</span> comments <span class="hljs-keyword">FROM</span> articles_v2 <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;   <span class="hljs-comment">-- 9999</span>
<span class="hljs-keyword">ROLLBACK</span>;
<span class="hljs-keyword">SELECT</span> comments <span class="hljs-keyword">FROM</span> articles_v2 <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;   <span class="hljs-comment">-- 원래 값</span>
</code></pre>
<p><strong><code>ROLLBACK</code> 하면 없던 일이 됩니다.</strong></p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 어제 <code>UPDATE articles SET reporter_id = 9999</code> 로 데이터를 망가뜨렸다가<br />
손으로 되돌렸던 것 — <strong>이렇게 하면 손으로 안 되돌려도 됩니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EC%BB%A4%EB%B0%8B%EA%B3%BC-%EB%A1%A4%EB%B0%B1">커밋과 롤백</h1>
<svg style="display:block;margin:0 auto 18px" id="dg7" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="1000" height="400" aria-label="트랜잭션을 시작하면 변경이 임시로 쌓이고 커밋하면 확정되며 롤백하면 시작 전 상태로 되돌아간다">
  <style>
#dg7 .ttl{ font-family:var(--sans); font-size:17px; font-weight:600; fill:#FFFFFF; }
#dg7 .lbl{ font-family:var(--sans); font-size:15px; fill:#9DB0BE; }
#dg7 .mono{ font-family:var(--mono); font-size:15px; fill:#FFFFFF; }
#dg7 .ok{ font-family:var(--sans); font-size:16px; font-weight:600; fill:#F2C879; }
#dg7 .no{ font-family:var(--sans); font-size:16px; font-weight:600; fill:#EC8B81; }
  </style>
  <rect x="20" y="128" width="150" height="60" rx="8" fill="#344A59" stroke="#6D869A" stroke-width="2" />
  <text x="95" y="164" class="ttl" text-anchor="middle">시작 전</text>
  <text x="95" y="226" class="lbl" text-anchor="middle">comments = 129</text>
  <path d="M 170 158 L 224 158" fill="none" stroke="#6D869A" stroke-width="2" marker-end="url(#dg7-t1)" />
  <rect x="230" y="100" width="250" height="116" rx="8" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" />
  <text x="248" y="128" class="ttl">START TRANSACTION</text>
  <text x="248" y="158" class="mono">INSERT 댓글</text>
  <text x="248" y="184" class="mono">UPDATE comments +1</text>
  <text x="248" y="208" class="lbl">아직 나만 보인다</text>
  <path d="M 480 132 L 560 132 L 560 88 L 614 88" fill="none" stroke="#F2C879" stroke-width="2.5" marker-end="url(#dg7-t2)" />
  <path d="M 480 184 L 560 184 L 560 262 L 614 262" fill="none" stroke="#EC8B81" stroke-width="2.5" marker-end="url(#dg7-t3)" />
  <rect x="620" y="60" width="250" height="60" rx="8" fill="#4A3A18" stroke="#F2C879" stroke-width="2" />
  <text x="745" y="86" class="ok" text-anchor="middle">COMMIT</text>
  <text x="745" y="110" class="lbl" text-anchor="middle">comments = 130 · 확정</text>
  <rect x="620" y="234" width="250" height="60" rx="8" fill="#4A211E" stroke="#EC8B81" stroke-width="2" />
  <text x="745" y="260" class="no" text-anchor="middle">ROLLBACK</text>
  <text x="745" y="284" class="lbl" text-anchor="middle">comments = 129 · 없던 일</text>
  <text x="450" y="336" class="ok" text-anchor="middle">전부 되거나, 전부 안 되거나 — 중간은 없다</text>
  <defs>
    <marker id="dg7-t1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6D869A" />
    </marker>
    <marker id="dg7-t2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#F2C879" />
    </marker>
    <marker id="dg7-t3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#EC8B81" />
    </marker>
  </defs>
</svg>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EC%A7%80%EC%9A%B4-%EA%B2%83%EB%8F%84-%EB%90%98%EB%8F%8C%EB%A6%B0%EB%8B%A4--delete">지운 것도 되돌린다 — DELETE</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">START</span> TRANSACTION;
<span class="hljs-keyword">DELETE</span> <span class="hljs-keyword">FROM</span> comments_tbl <span class="hljs-keyword">WHERE</span> article_id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
<span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FROM</span> comments_tbl <span class="hljs-keyword">WHERE</span> article_id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;   <span class="hljs-comment">-- 0</span>
<span class="hljs-keyword">ROLLBACK</span>;
<span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FROM</span> comments_tbl <span class="hljs-keyword">WHERE</span> article_id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;   <span class="hljs-comment">-- 원래대로</span>
</code></pre>
<p><code>DELETE</code> 도 <code>UPDATE</code> 처럼 <strong>커밋 전이면 없던 일</strong>로 돌립니다.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>6일차 1차시의 습관 그대로 — 지우기 전에 같은 <code>WHERE</code> 로 <code>SELECT</code> 부터.</strong> <code>WHERE</code> 를 빼먹으면 <strong>전부</strong> 지워집니다 —<br />
그래서 안전장치가 <code>UPDATE</code> 처럼 1175 로 막습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="delete--truncate--drop--%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%82%A8%EB%8A%94%EA%B0%80">DELETE · TRUNCATE · DROP — 무엇이 남는가</h1>
<table>
<thead>
<tr>
<th></th>
<th>지우는 것</th>
<th><code>WHERE</code></th>
<th><code>ROLLBACK</code></th>
<th>남는 것</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>DELETE</code></td>
<td>고른 줄</td>
<td>된다</td>
<td><strong>된다</strong></td>
<td>표 · 번호는 이어서</td>
</tr>
<tr>
<td><code>TRUNCATE TABLE</code></td>
<td>모든 줄</td>
<td>안 된다</td>
<td><strong>안 된다</strong></td>
<td>표 · 번호는 1부터</td>
</tr>
<tr>
<td><code>DROP TABLE</code></td>
<td>표 자체</td>
<td>—</td>
<td><strong>안 된다</strong></td>
<td>없음</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>TRUNCATE</code> · <code>DROP</code> 은 표의 구조를 건드리는 문장이라 <strong>그 자리에서 커밋됩니다.</strong> 트랜잭션 안에서 써도 못 돌립니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-class="quiz" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" class="quiz" data-marpit-pagination="44" style="--paginate:true;--class:quiz;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A3">실습 ④</h1>
<p><code>labs/01-db/day07/practice-4.sql</code></p>
<p>트랜잭션을 직접 써 봅니다.</p>
<ol>
<li>댓글 넣기 + 개수 올리기를 <strong>한 트랜잭션으로</strong></li>
<li>일부러 틀린 문장을 넣고 <strong><code>ROLLBACK</code></strong> 으로 되돌리기</li>
<li>되돌린 뒤 숫자가 원래대로인지 확인</li>
<li><code>DELETE</code> 후 <code>ROLLBACK</code> — 더 해보기: 복사본에 <code>TRUNCATE</code></li>
</ol>
<blockquote>
<p>13분. <strong><code>ROLLBACK</code> 후에 꼭 <code>SELECT</code> 로 확인하세요.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EC%98%A4%EB%8A%98-%EB%B0%B0%EC%9A%B4-%EA%B2%83">오늘 배운 것</h1>
<table>
<thead>
<tr>
<th>무엇</th>
<th>한 줄</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1정규형</strong></td>
<td>한 칸에 하나만</td>
</tr>
<tr>
<td><strong>2정규형</strong></td>
<td>복합키의 일부에만 딸린 열을 뺀다</td>
</tr>
<tr>
<td><strong>3정규형</strong></td>
<td>키가 아닌 열에 딸린 열을 뺀다</td>
</tr>
<tr>
<td><strong>비정규화</strong></td>
<td>일부러 중복을 둔다 — 대신 내가 맞춘다</td>
</tr>
<tr>
<td><strong>트랜잭션</strong></td>
<td>여러 문장을 <strong>전부 되거나 전부 안 되게</strong></td>
</tr>
<tr>
<td><code>ROLLBACK</code></td>
<td>커밋 전이면 없던 일로</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EA%BC%AD-%EA%B8%B0%EC%96%B5%ED%95%A0-%EC%84%B8-%EA%B0%80%EC%A7%80">꼭 기억할 세 가지</h1>
<ol>
<li><strong>세 정규형은 목적이 하나입니다.</strong><br />
같은 사실이 두 곳에 있지 않게 하는 것.</li>
<li><strong>정규화가 항상 옳은 것은 아닙니다.</strong><br />
나눌수록 <code>JOIN</code> 이 늘어납니다. <strong>일부러 안 나누는 것도 설계입니다.</strong></li>
<li><strong>일부러 중복을 뒀다면 트랜잭션으로 책임지십시오.</strong><br />
구조가 안 막아주면 <strong>사람이 막아야</strong> 합니다.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EB%8B%A4%EC%9D%8C-%EC%8B%9C%EA%B0%84-1028-%EC%88%98--4%EC%B0%A8%EC%8B%9C">다음 시간 (10/28 수 · 4차시)</h1>
<ul>
<li><strong><code>ACID</code> · 잠금</strong> — 오늘 배운 트랜잭션을 마무리합니다</li>
<li><strong>인덱스</strong> — 500건에서는 안 느꼈지만, 500만 건이면 다릅니다</li>
<li><strong>실행계획</strong> — DB 가 내 쿼리를 <strong>어떻게 처리하는지 들여다봅니다</strong></li>
<li>1일차에 &quot;인덱스로 즉시 검색&quot;이라고 넘어갔던 것, 그 속을 엽니다</li>
</ul>
<blockquote>
<p>오늘까지가 <strong>「만들기」</strong> 입니다. 8일차는 <strong>「왜 빠른가」</strong> 입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:e15fizri7ik6ducdyn2tlgs7ho9yrn25ixgfhyfrzpt;" data-marpit-pagination-total="48">
<h1 id="%EA%B3%BC%EC%A0%9C">과제</h1>
<ol>
<li>실습 ①②③④ 완성해 제출</li>
<li><code>articles_v2</code> 에서 <strong>비정규화된 열을 하나 더</strong> 찾아보기<br />
→ 그 열을 유지하려면 <strong>어떤 문장들을 트랜잭션으로 묶어야</strong> 합니까?</li>
<li>여유가 되면 — <code>reporters.department</code> 를 지워도 되는지 판단하고 이유 적기</li>
