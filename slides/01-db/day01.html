<h1 id="%EC%8B%9C%EC%9E%91-%EC%A0%84%EC%97%90--%EC%84%A4%EC%B9%98-%ED%8C%8C%EC%9D%BC%EB%B6%80%ED%84%B0-%EB%B0%9B%EC%9C%BC%EC%84%B8%EC%9A%94">시작 전에 — 설치 파일부터 받으세요</h1>
<p>설치에 시간이 걸리므로 <strong>지금 다운로드를 걸어두고</strong> 강의를 듣습니다.</p>

</code></pre>

<li><code>No thanks, just start my download</code> 클릭 (로그인 필요 없음)</li>
<li>다운로드가 시작되면 그대로 두고 화면을 봐주세요</li>
</ol>
<blockquote>
<p>설치는 <strong>2차시</strong>에 함께 진행합니다. 지금 실행하지 마세요.</p>
</blockquote>

<h1 id="%EB%B0%9B%EB%8A%94-%EB%8F%99%EC%95%88--%EC%9E%91%EC%97%85-%ED%8F%B4%EB%8D%94%EB%A5%BC-%EB%A7%8C%EB%93%AD%EB%8B%88%EB%8B%A4">받는 동안 — 작업 폴더를 만듭니다</h1>

C:\dev\workspace\01-db\day01    ← 내가 푼 것 (practice-1.sql)

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-class="section" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" class="section" data-marpit-pagination="5" style="--paginate:true;--class:section;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="1%EC%B0%A8%EC%8B%9C">1차시</h1>
<h2 id="%EC%99%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%B2%A0%EC%9D%B4%EC%8A%A4%EA%B0%80-%ED%95%84%EC%9A%94%ED%95%9C%EA%B0%80">왜 데이터베이스가 필요한가</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%96%B4%EB%94%94%EC%97%90-%EB%8B%B4%EA%B3%A0-%EA%B3%84%EC%8B%A0%EA%B0%80%EC%9A%94">데이터, 어디에 담고 계신가요?</h1>
<p>기사 6개월치 · 500건. 지금까지라면 <strong>엑셀·CSV 파일 하나</strong>에 담았을 겁니다.</p>
<ul>
<li>&quot;조회수 1만 넘는 기사만 보고 싶다&quot; → 필터</li>
<li>&quot;섹션별로 몇 건인지&quot; → 피벗 테이블</li>
</ul>
<p>파일 하나로도 됩니다. <strong>그런데 이 방식이 안 통하는 순간이 옵니다.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="quiz" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" class="quiz" data-marpit-pagination="7" style="--paginate:true;--class:quiz;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%9D%B4%EB%9F%B0-%EC%83%81%ED%99%A9%EC%9D%B4%EB%9D%BC%EB%A9%B4">이런 상황이라면?</h1>
<p>신문사에서 <strong>기사 데이터를 엑셀 파일 하나</strong>로 관리한다고 해봅시다.</p>
<ol>
<li>기자 30명이 <strong>동시에</strong> 기사를 등록해야 한다면?</li>
<li>기사가 <strong>500만 건</strong>이라면?</li>
<li>누군가 실수로 <strong>조회수 열을 통째로 지웠다면</strong>?</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">

<blockquote>
<p>먼저 쓴 사람의 작업이 조용히 사라집니다. <strong>아무도 모르게.</strong></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EB%AC%B8%EC%A0%9C-2--%EC%BB%A4%EC%A7%80%EB%A9%B4-%EB%8A%90%EB%A0%A4%EC%A7%84%EB%8B%A4">문제 2 — 커지면 느려진다</h1>
<table>
<thead>
<tr>
<th>규모</th>
<th>엑셀</th>
<th>데이터베이스</th>
</tr>
</thead>
<tbody>
<tr>
<td>1천 행</td>
<td>문제없음</td>
<td>문제없음</td>
</tr>
<tr>
<td>100만 행</td>
<td>파일 열기부터 버거움</td>
<td>문제없음</td>
</tr>
<tr>
<td>5백만 행</td>
<td><strong>열리지 않음</strong></td>
<td>조건 검색 0.01초</td>
</tr>
</tbody>
</table>
<p>엑셀은 <strong>모든 데이터를 메모리에 올려야</strong> 합니다.<br />
데이터베이스는 <strong>필요한 부분만 디스크에서 꺼내 옵니다.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EB%AC%B8%EC%A0%9C-3--%EC%9E%98%EB%AA%BB%EB%90%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EB%A7%89%EC%A7%80-%EB%AA%BB%ED%95%9C%EB%8B%A4">문제 3 — 잘못된 데이터를 막지 못한다</h1>
<p>엑셀에서는 이런 게 그냥 들어갑니다.</p>
<table>
<thead>
<tr>
<th>제목</th>
<th>섹션</th>
<th>조회수</th>
</tr>
</thead>
<tbody>
<tr>
<td>예산안 논의</td>
<td>정치</td>
<td><code>12000</code></td>
</tr>
<tr>
<td>물가 상승</td>
<td><strong>경제부</strong></td>
<td><code>-500</code></td>
</tr>
<tr>
<td>개막전 승리</td>
<td>스포츠</td>
<td><code>많음</code></td>
</tr>
</tbody>
</table>
<p>섹션 이름이 제각각이라 집계가 안 맞고, 조회수에 <strong>음수</strong>와 <strong>글자</strong>가 들어갔습니다.</p>
<blockquote>
<p>DB는 <strong>&quot;조회수는 0 이상의 정수만&quot;</strong> 같은 규칙을 강제할 수 있습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EB%AC%B8%EC%A0%9C-4--%EA%B0%99%EC%9D%80-%EB%82%B4%EC%9A%A9%EC%9D%B4-%EB%B0%98%EB%B3%B5%EB%90%9C%EB%8B%A4">문제 4 — 같은 내용이 반복된다</h1>
<p>한 시트에 기사와 기자 정보를 같이 넣으면:</p>
<table>
<thead>
<tr>
<th>제목</th>
<th>기자</th>
<th>기자 이메일</th>
<th>기자 부서</th>
</tr>
</thead>
<tbody>
<tr>
<td>예산안 논의</td>
<td>김지훈</td>
<td>kim@...</td>
<td>정치부</td>
</tr>
<tr>
<td>인사 발표</td>
<td>김지훈</td>
<td>kim@...</td>
<td>정치부</td>
</tr>
<tr>
<td>법 개정안</td>
<td>김지훈</td>
<td>kim@...</td>
<td>정치부</td>
</tr>
</tbody>
</table>
<p>김지훈 기자의 이메일이 바뀌면 <strong>모든 행을 고쳐야</strong> 합니다.<br />
한 곳이라도 놓치면 데이터가 어긋납니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EA%B7%B8%EB%9E%98%EC%84%9C-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%B2%A0%EC%9D%B4%EC%8A%A4">그래서 데이터베이스</h1>
<table>
<thead>
<tr>
<th>문제</th>
<th>데이터베이스의 답</th>
</tr>
</thead>
<tbody>
<tr>
<td>동시에 못 쓴다</td>
<td><strong>트랜잭션</strong> — 여럿이 안전하게</td>
</tr>
<tr>
<td>커지면 느리다</td>
<td><strong>인덱스</strong> — 500만 건에서도 즉시 검색</td>
</tr>
<tr>
<td>이상한 값이 들어온다</td>
<td><strong>제약조건</strong> — 규칙을 강제</td>
</tr>
<tr>
<td>같은 내용이 반복된다</td>
<td><strong>관계</strong> — 나눠 저장하고 이어 붙임</td>
</tr>
</tbody>
</table>
<p><strong>이 네 가지가 앞으로 9일 동안 배울 내용입니다.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">

  <text class="side" x="724" y="254">Oracle · SQL Server …</text>
  <line class="arrow" x1="500" y1="286" x2="500" y2="374" />
  <text class="lbl" x="526" y="322">안전하게 · 빠르게</text>
  <text class="lbl" x="526" y="350">필요한 만큼만</text>
  <rect class="box" x="330" y="378" width="340" height="76" rx="10" />
  <text class="t" x="500" y="425">실제 데이터</text>
  <text class="lbl" x="304" y="425" text-anchor="end">직접 만지지 않는다</text>
</svg>
<p>우리는 데이터를 <strong>직접 만지지 않습니다.</strong> DBMS에게 <strong>부탁</strong>합니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EA%B4%80%EA%B3%84%ED%98%95-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%B2%A0%EC%9D%B4%EC%8A%A4--%ED%91%9C%EB%A1%9C-%EC%A0%80%EC%9E%A5%ED%95%9C%EB%8B%A4">관계형 데이터베이스 — 표로 저장한다</h1>
<p><strong>테이블(table)</strong> 하나가 엑셀의 시트 하나와 비슷합니다.</p>
<table>
<thead>
<tr>
<th>id</th>
<th>title</th>
<th>section</th>
<th>views</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>여야 예산안 놓고 공방</td>
<td>정치</td>
<td>3562</td>
</tr>
<tr>
<td>2</td>
<td>반도체 정책 발표</td>
<td>경제</td>
<td>5159</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>행(row)</strong> — 기사 한 건</li>
<li><strong>열(column)</strong> — 기사가 가진 속성</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%97%91%EC%85%80%EA%B3%BC-%EA%B1%B0%EC%9D%98-%EA%B0%99%EC%8A%B5%EB%8B%88%EB%8B%A4">엑셀과 거의 같습니다</h1>
<table>
<thead>
<tr>
<th>엑셀</th>
<th>데이터베이스</th>
</tr>
</thead>
<tbody>
<tr>
<td>시트 (sheet)</td>
<td>테이블 (table)</td>
</tr>
<tr>
<td>행 (row)</td>
<td>행 (row)</td>
</tr>
<tr>
<td>열 (column)</td>
<td>열 (column)</td>
</tr>
<tr>
<td>필터</td>
<td><code>WHERE</code></td>
</tr>
<tr>
<td>피벗 테이블</td>
<td><code>GROUP BY</code> (2일차)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>개념은 이미 알고 있는 것입니다. <strong>부르는 이름과 다루는 방법만 다릅니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="sql--%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%B2%A0%EC%9D%B4%EC%8A%A4%EC%97%90%EA%B2%8C-%EB%A7%90-%EA%B1%B0%EB%8A%94-%EC%96%B8%EC%96%B4">SQL — 데이터베이스에게 말 거는 언어</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> title, views
<span class="hljs-keyword">FROM</span> articles
<span class="hljs-keyword">WHERE</span> section <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;스포츠&#x27;</span>
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> views <span class="hljs-keyword">DESC</span>;
</code></pre>
<p>읽어보면 거의 영어 문장입니다.</p>
<blockquote>
<p><strong>골라라</strong> 제목과 조회수를 / <strong>어디서</strong> articles 테이블에서<br />
<strong>조건</strong> 섹션이 스포츠인 것 / <strong>정렬</strong> 조회수 내림차순으로</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="sql%EC%9D%98-%ED%8A%B9%EC%A7%95--%EC%96%B4%EB%96%BB%EA%B2%8C%EA%B0%80-%EC%95%84%EB%8B%88%EB%9D%BC-%EB%AC%B4%EC%97%87%EC%9D%84">SQL의 특징 — 어떻게가 아니라 무엇을</h1>
<p><strong>직접 한다면</strong> — 순서를 내가 다 정해야 합니다.</p>
<ol>
<li>기사를 하나씩 꺼낸다</li>
<li>섹션이 '스포츠'면 목록에 담는다</li>
<li>목록을 조회수 큰 순으로 정렬한다</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- SQL — 무엇을 원하는지만 말한다</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> articles <span class="hljs-keyword">WHERE</span> section <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;스포츠&#x27;</span> <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> views <span class="hljs-keyword">DESC</span>;
</code></pre>
<p><strong>어떻게 찾을지는 DBMS가 알아서 정합니다.</strong> (8일차에 그 속을 들여다봅니다)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%B2%A0%EC%9D%B4%EC%8A%A4-%EC%A7%80%ED%98%95%EB%8F%84">데이터베이스 지형도</h1>
<table>
<thead>
<tr>
<th>종류</th>
<th>예시</th>
<th>쓰임</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>관계형(RDB)</strong></td>
<td><strong>MySQL</strong> · PostgreSQL · Oracle</td>
<td>대부분의 서비스</td>
</tr>
<tr>
<td>문서형</td>
<td>MongoDB</td>
<td>형태가 자주 바뀌는 데이터</td>
</tr>
<tr>
<td>키-값</td>
<td>Redis</td>
<td>캐시 · 세션</td>
</tr>
<tr>
<td>검색엔진</td>
<td>Elasticsearch</td>
<td>전문 검색</td>
</tr>
</tbody>
</table>
<p>우리는 <strong>관계형</strong>을 배웁니다. 나머지는 관계형을 알아야 이해됩니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%99%9C-mysql%EC%9D%B8%EA%B0%80">왜 MySQL인가</h1>
<ul>
<li><strong>국내에서 가장 많이 씁니다</strong> → 자료·튜토리얼이 풍부하고, 취업 시장에서 바로 쓰입니다</li>
<li><strong>설치가 단순합니다</strong> → 설치 프로그램 하나로 서버 + 관리도구까지</li>
<li><strong>Node.js와 잘 맞습니다</strong> → 12월에 백엔드에서 <code>mysql2</code>로 그대로 씁니다</li>
<li><strong>표준 SQL에 가깝습니다</strong> → 다른 DB로 옮겨도 대부분 그대로 통합니다</li>
<li>무료 · 오픈소스</li>
</ul>
<blockquote>
<p>실무에서 PostgreSQL도 많이 씁니다. 문법 차이는 <strong>마지막 날에 정리</strong>합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="9%EC%9D%BC-%EB%8F%99%EC%95%88-%EB%B0%B0%EC%9A%B8-%EA%B2%83">9일 동안 배울 것</h1>
<table>
<thead>
<tr>
<th>일차</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1</strong></td>
<td><strong>왜 DB인가 · 설치 · SELECT</strong></td>
</tr>
<tr>
<td>2~3</td>
<td><code>WHERE</code> · 집계 (<code>GROUP BY</code>) · 왜 테이블을 나누는가</td>
</tr>
<tr>
<td>4~5</td>
<td>여러 테이블 잇기 (<code>JOIN</code>) · 서브쿼리</td>
</tr>
<tr>
<td>6~7</td>
<td>테이블 설계 · 정규화 · 트랜잭션</td>
</tr>
<tr>
<td>8</td>
<td>인덱스와 실행계획 — <strong>왜 빠른가</strong></td>
</tr>
<tr>
<td>9</td>
<td>윈도우 함수 · JSON · 종합 실습</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-class="section" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" class="section" data-marpit-pagination="21" style="--paginate:true;--class:section;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="2%EC%B0%A8%EC%8B%9C">2차시</h1>
<h2 id="%EC%84%A4%EC%B9%98%ED%95%98%EA%B3%A0-%EC%A0%91%EC%86%8D%ED%95%98%EA%B8%B0">설치하고 접속하기</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%84%A4%EC%B9%98--1%EB%8B%A8%EA%B3%84">설치 — 1단계</h1>
<p>받아둔 설치 파일을 실행합니다.</p>
<ul>
<li><code>Choosing a Setup Type</code> → <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong><code>Full</code></strong> 선택 → <code>Next</code></li>
<li><code>Check Requirements</code> — 빨간 항목이 있으면 <code>Execute</code>, 없으면 <code>Next</code></li>
<li>이후 <code>Download</code> · <code>Installation</code> · <code>Product Configuration</code> — <strong>전부 <code>Next</code> / <code>Execute</code></strong></li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 처음엔 <strong><code>Server only</code>가 선택돼 있습니다.</strong> 그냥 넘기면 <strong>Workbench가 안 깔려 쿼리 창을 못 엽니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%84%A4%EC%B9%98--%EB%AC%B4%EC%97%87%EC%9D%B4-%EA%B9%94%EB%A6%AC%EB%82%98">설치 — 무엇이 깔리나</h1>
<p><code>Full</code>을 고르면 오른쪽 설명에 이렇게 나옵니다.</p>
<blockquote>
<p><code>MySQL Server</code> · <code>MySQL Shell</code> · <code>MySQL Router</code> · <strong><code>MySQL Workbench</code></strong> · documentation · samples</p>
</blockquote>
<p>우리가 쓰는 것은 <strong>Server</strong>(데이터를 담는 곳)와 <strong>Workbench</strong>(쿼리 창) 둘입니다.</p>
<blockquote>
<p>나머지는 같이 깔릴 뿐 쓰지 않습니다. pgAdmin 같은 별도 도구가 필요 없습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%84%A4%EC%B9%98--2%EB%8B%A8%EA%B3%84--%EC%84%9C%EB%B2%84-%EC%84%A4%EC%A0%95%EA%B3%BC-%EB%B9%84%EB%B0%80%EB%B2%88%ED%98%B8">설치 — 2단계 · 서버 설정과 비밀번호</h1>
<p>설정 화면 여섯 개가 지나갑니다. <strong>전부 기본값</strong> (포트 <strong>3306</strong> · Strong Password · 서비스 <code>MySQL80</code>).</p>
<p><strong><code>Accounts and Roles</code></strong> 에서만 멈춥니다 — <code>root</code> 비밀번호.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>반드시 메모하세요.</strong> 수업에서는 기억하기 쉬운 것으로 — 예: <code>root</code><br />
<code>Password strength: Weak</code> 라고 빨갛게 떠도 <strong>그대로 진행하면 됩니다.</strong></p>
</blockquote>
<p><code>Add User</code>는 건너뜁니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%84%A4%EC%B9%98--3%EB%8B%A8%EA%B3%84--%EB%A7%88%EB%AC%B4%EB%A6%AC">설치 — 3단계 · 마무리</h1>
<ul>
<li><code>Server File Permissions</code> — 기본값 <code>Next</code></li>
<li><code>Apply Configuration</code> — <code>Execute</code> → 초록 체크 → <code>Finish</code></li>
<li>이후 <strong>Router · Samples</strong> 설정 — 전부 <code>Next</code> / <code>Finish</code></li>
</ul>
<blockquote>
<p>Samples 단계에서 비밀번호를 물으면 방금 정한 <code>root</code>를 넣고 <code>Check</code> → <code>Next</code>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%84%A4%EC%B9%98--%ED%99%95%EC%9D%B8">설치 — 확인</h1>
<p>설치가 끝나면 <strong>Workbench 가 자동으로 열립니다.</strong> (안 열렸으면 시작 메뉴에서)</p>
<ol>
<li><strong>왼쪽 아래</strong> <code>MySQL Connections</code> 의 <strong><code>Local instance MySQL80</code></strong> 타일 클릭</li>
<li><code>root</code> 비밀번호 입력 (<code>Save password in vault</code> 체크하면 편합니다)</li>
<li>가운데 <strong><code>Query 1</code></strong> 창이 열리면 <strong>접속 성공</strong>입니다</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 왼쪽은 처음에 <code>Administration</code> 탭입니다. DB 목록은 <strong>아래 <code>Schemas</code> 탭</strong>을 눌러야 나옵니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%95%88-%EB%90%A0-%EB%95%8C">안 될 때</h1>
<table>
<thead>
<tr>
<th>증상</th>
<th>해결</th>
</tr>
</thead>
<tbody>
<tr>
<td>설치 중 오류</td>
<td>백신 잠시 중지 후 재시도</td>
</tr>
<tr>
<td>Workbench가 안 열림</td>
<td>시작 메뉴에서 다시 실행. 그래도 안 되면 재부팅</td>
</tr>
<tr>
<td>비밀번호가 틀리다고 함</td>
<td>설치 때 정한 것과 대소문자까지 확인</td>
</tr>
<tr>
<td>포트 3306 사용 중</td>
<td>이전에 설치한 MySQL·MariaDB가 있는지 확인</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>해결 안 되면 손 드세요.</strong> 옆 사람 것으로 함께 보며 진행해도 됩니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%8B%A4%EC%8A%B5%EC%9A%A9-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%B2%A0%EC%9D%B4%EC%8A%A4-%EB%A7%8C%EB%93%A4%EA%B8%B0">실습용 데이터베이스 만들기</h1>
<p>Workbench 쿼리 창에 입력하고 실행합니다 (<strong>Ctrl+Enter</strong>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> DATABASE newsdb <span class="hljs-keyword">CHARACTER SET</span> utf8mb4;
USE newsdb;
</code></pre>
<blockquote>
<p>왼쪽 <code>SCHEMAS</code> 패널을 새로고침하면 <code>newsdb</code>가 보입니다.<br />
<code>USE</code>는 &quot;앞으로 이 데이터베이스에서 작업한다&quot;는 뜻입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%BF%BC%EB%A6%AC-%EC%8B%A4%ED%96%89%ED%95%98%EB%8A%94-%EB%B2%95">쿼리 실행하는 법</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-number">1</span>;
</code></pre>
<ul>
<li><strong>Ctrl+Enter</strong> — 커서가 놓인 문장 하나 실행</li>
<li><strong>번개 아이콘</strong> — 편집창 전체 실행</li>
</ul>
<blockquote>
<p>아래 <code>Result Grid</code>에 <code>1</code>이 나오면 정상입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%8B%A4%EC%8A%B5-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EB%84%A3%EA%B8%B0">실습 데이터 넣기</h1>
<p>배포된 <code>articles.sql</code> 파일을 엽니다.</p>
<ol>
<li>상단 메뉴 <code>File</code> → <code>Open SQL Script...</code> → <code>articles.sql</code></li>
<li>새 탭에 내용이 열립니다 → <strong>번개 아이콘</strong>(전체 실행)</li>
</ol>
<blockquote>
<p>아래 <code>Action Output</code>에 초록 체크와 <code>500 row(s) affected</code> 가 뜨면 성공입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%9E%98-%EB%93%A4%EC%96%B4%EA%B0%94%EB%8A%94%EC%A7%80-%ED%99%95%EC%9D%B8">잘 들어갔는지 확인</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FROM</span> articles;
</code></pre>
<p><code>500</code>이 나와야 합니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> articles LIMIT <span class="hljs-number">5</span>;
</code></pre>
<p>기사 5건이 표로 보이면 준비 완료입니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="section" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" class="section" data-marpit-pagination="32" style="--paginate:true;--class:section;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="3%EC%B0%A8%EC%8B%9C">3차시</h1>
<h2 id="%EC%B2%AB-select">첫 SELECT</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%9A%B0%EB%A6%AC%EA%B0%80-%EC%93%B8-%EB%8D%B0%EC%9D%B4%ED%84%B0--articles-500%EA%B1%B4">우리가 쓸 데이터 — <code>articles</code> 500건</h1>
<table>
<thead>
<tr>
<th>컬럼</th>
<th>타입</th>
<th>뜻</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>id</code></td>
<td>정수</td>
<td>기사 번호</td>
</tr>
<tr>
<td><code>title</code></td>
<td>문자열</td>
<td>제목</td>
</tr>
<tr>
<td><code>section</code></td>
<td>문자열</td>
<td>섹션 (정치·경제·사회·문화·스포츠·IT)</td>
</tr>
<tr>
<td><code>reporter</code></td>
<td>문자열</td>
<td>기자 이름</td>
</tr>
<tr>
<td><code>published_at</code></td>
<td>날짜시간</td>
<td>발행 일시</td>
</tr>
<tr>
<td><code>views</code></td>
<td>정수</td>
<td>조회수</td>
</tr>
<tr>
<td><code>comments</code></td>
<td>정수</td>
<td>댓글 수</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="select--%EA%B0%80%EC%9E%A5-%EA%B8%B0%EB%B3%B8%ED%98%95">SELECT — 가장 기본형</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span>
<span class="hljs-keyword">FROM</span> articles;
</code></pre>
<ul>
<li><code>SELECT</code> — <strong>무엇을</strong> 가져올지</li>
<li><code>*</code> — <strong>모든 열</strong></li>
<li><code>FROM</code> — <strong>어느 테이블</strong>에서</li>
</ul>
<blockquote>
<p><code>;</code> 세미콜론으로 문장을 끝냅니다. 습관을 들이세요.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%ED%95%84%EC%9A%94%ED%95%9C-%EC%97%B4%EB%A7%8C-%EA%B3%A0%EB%A5%B4%EA%B8%B0">필요한 열만 고르기</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> title, views
<span class="hljs-keyword">FROM</span> articles;
</code></pre>
<p>500건 전부 나오되 <strong>두 열만</strong> 보입니다.</p>
<blockquote>
<p>실무에서 <code>SELECT *</code> 는 피합니다. 필요 없는 열까지 옮기면 느려집니다.<br />
<strong>지금부터 필요한 열만 쓰는 습관</strong>을 들이세요.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%97%B4-%EC%9D%B4%EB%A6%84-%EB%B0%94%EA%BF%94-%EB%B3%B4%EA%B8%B0--as">열 이름 바꿔 보기 — AS</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> title <span class="hljs-keyword">AS</span> 제목,
       views <span class="hljs-keyword">AS</span> 조회수
<span class="hljs-keyword">FROM</span> articles;
</code></pre>
<p>결과의 열 제목이 바뀝니다. <strong>원본 테이블은 그대로입니다.</strong></p>
<blockquote>
<p>한글 별칭은 따옴표 없이도 되지만, 공백이 들어가면 <strong>백틱</strong>으로 감쌉니다.<br />
<code>views AS `조회 수`</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EA%B3%84%EC%82%B0%ED%95%B4%EC%84%9C-%EB%B3%B4%EA%B8%B0">계산해서 보기</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> title,
       views,
       comments,
       comments <span class="hljs-operator">*</span> <span class="hljs-number">100</span> <span class="hljs-operator">/</span> views <span class="hljs-keyword">AS</span> 댓글비율
<span class="hljs-keyword">FROM</span> articles;
</code></pre>
<p><strong>저장된 값을 계산해서 새 열처럼</strong> 보여줄 수 있습니다.</p>
<blockquote>
<p>조회수 대비 댓글이 몇 %인지 — <strong>소수점이 몇 자리로 나올까요?</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EA%B2%B0%EA%B3%BC--%EC%86%8C%EC%88%98-%EB%84%A4-%EC%9E%90%EB%A6%AC%EB%A1%9C-%EB%82%98%EC%98%B5%EB%8B%88%EB%8B%A4">결과 — 소수 <strong>네 자리</strong>로 나옵니다</h1>
<table>
<thead>
<tr>
<th>title</th>
<th style="text-align:right">views</th>
<th style="text-align:right">comments</th>
<th style="text-align:right">댓글비율</th>
</tr>
</thead>
<tbody>
<tr>
<td>여야 예산안 놓고 공방</td>
<td style="text-align:right">3562</td>
<td style="text-align:right">129</td>
<td style="text-align:right">3.6216</td>
</tr>
<tr>
<td>반도체 정책 발표에 업계 촉각</td>
<td style="text-align:right">5159</td>
<td style="text-align:right">28</td>
<td style="text-align:right">0.5427</td>
</tr>
<tr>
<td>미술관 전시 개막</td>
<td style="text-align:right">12217</td>
<td style="text-align:right">45</td>
<td style="text-align:right">0.3683</td>
</tr>
</tbody>
</table>
<blockquote>
<p>MySQL의 <code>/</code>는 <strong>항상 소수로</strong> 계산됩니다 — <code>5 / 2</code> 도 <em>2.5000</em>.<br />
정수로 나누려면 <code>DIV</code> (<code>5 DIV 2</code> = 2), 자리를 줄이려면 <code>ROUND(..., 1)</code>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%A4%91%EB%B3%B5-%EC%97%86%EC%9D%B4-%EB%B3%B4%EA%B8%B0--distinct">중복 없이 보기 — DISTINCT</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">DISTINCT</span> section
<span class="hljs-keyword">FROM</span> articles;
</code></pre>
<p>섹션 종류만 나옵니다 — 정치 · 경제 · 사회 · 문화 · 스포츠 · IT</p>
<blockquote>
<p>중복을 걷어내고 <strong>어떤 값들이 있는지</strong> 훑어볼 때 씁니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EA%B0%9C%EC%88%98-%EC%A0%9C%ED%95%9C--limit">개수 제한 — LIMIT</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> title, views
<span class="hljs-keyword">FROM</span> articles
LIMIT <span class="hljs-number">10</span>;
</code></pre>
<p>앞에서 10건만 가져옵니다.</p>
<blockquote>
<p>데이터를 처음 볼 때 <strong>항상 LIMIT을 먼저 붙이세요.</strong><br />
500만 건짜리 테이블에 <code>SELECT *</code> 를 그냥 날리면 화면이 멈춥니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%A0%95%EB%A0%AC--order-by">정렬 — ORDER BY</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> title, views
<span class="hljs-keyword">FROM</span> articles
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> views <span class="hljs-keyword">DESC</span>
LIMIT <span class="hljs-number">10</span>;
</code></pre>
<p><strong>조회수가 가장 높은 기사 10건</strong></p>
<ul>
<li><code>DESC</code> — 내림차순 (큰 것부터)</li>
<li><code>ASC</code> — 오름차순 (작은 것부터, 기본값이라 생략 가능)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%97%AC%EB%9F%AC-%EA%B8%B0%EC%A4%80%EC%9C%BC%EB%A1%9C-%EC%A0%95%EB%A0%AC">여러 기준으로 정렬</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> section, title, views
<span class="hljs-keyword">FROM</span> articles
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> section <span class="hljs-keyword">ASC</span>, views <span class="hljs-keyword">DESC</span>
LIMIT <span class="hljs-number">20</span>;
</code></pre>
<p><strong>섹션 이름 순으로 묶고, 각 섹션 안에서는 조회수 높은 순</strong></p>
<blockquote>
<p>앞의 기준이 같을 때 뒤의 기준이 적용됩니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-class="compact" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" class="compact" data-marpit-pagination="43" style="--paginate:true;--class:compact;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%A0%95%EB%A0%AC%ED%95%A0-%EB%95%8C-null-%EC%A1%B0%EC%8B%AC">정렬할 때 NULL 조심</h1>
<p><code>views</code>에는 <strong>집계가 안 된 기사</strong>가 섞여 있습니다 (<code>NULL</code>)</p>
<p>MySQL은 <code>NULL</code>을 <strong>가장 작은 값</strong>으로 봅니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> views <span class="hljs-keyword">DESC</span>   <span class="hljs-comment">-- NULL이 맨 뒤 (조회수 높은 순엔 문제 없음)</span>
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> views <span class="hljs-keyword">ASC</span>    <span class="hljs-comment">-- NULL이 맨 앞 (조회수 낮은 순엔 빈 줄이 먼저!)</span>
</code></pre>
<p>낮은 순으로 뽑을 때 <code>NULL</code>을 뒤로 밀려면:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> views <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NULL</span>, views <span class="hljs-keyword">ASC</span>
</code></pre>
<blockquote>
<p><code>NULL</code>은 &quot;값이 없음&quot;이지 0이 아닙니다. <strong>내일 1차시에 자세히 다룹니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="3%EC%B0%A8%EC%8B%9C-%EC%A0%95%EB%A6%AC--select%EB%A1%9C-%ED%95%A0-%EC%88%98-%EC%9E%88%EB%8A%94-%EA%B2%83">3차시 정리 — SELECT로 할 수 있는 것</h1>
<table>
<thead>
<tr>
<th>하고 싶은 것</th>
<th>SQL</th>
</tr>
</thead>
<tbody>
<tr>
<td>특정 열만 골라 보기</td>
<td><code>SELECT title, views</code></td>
</tr>
<tr>
<td>계산한 값을 새 열처럼</td>
<td><code>SELECT comments * 100 / views</code></td>
</tr>
<tr>
<td>중복 없이 값 종류 보기</td>
<td><code>SELECT DISTINCT section</code></td>
</tr>
<tr>
<td>앞에서 몇 건만</td>
<td><code>LIMIT 10</code></td>
</tr>
<tr>
<td>정렬 (내림차순)</td>
<td><code>ORDER BY views DESC</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-class="quiz" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" class="quiz" data-marpit-pagination="45" style="--paginate:true;--class:quiz;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A0">실습 ①</h1>
<p><code>labs/01-db/day01/practice-1.sql</code> 을 열어 풀어보세요.</p>
<ol>
<li>기사 제목과 발행일시만 5건 조회</li>
<li>섹션 종류를 중복 없이 조회</li>
<li>댓글이 많은 순으로 상위 10건 (제목·댓글수)</li>
<li>조회수 대비 댓글 비율을 계산해 상위 10건</li>
</ol>
<p><strong>12분</strong> — 막히면 손 드세요.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EA%BC%AD-%EA%B8%B0%EC%96%B5%ED%95%A0-%EC%84%B8-%EA%B0%80%EC%A7%80">꼭 기억할 세 가지</h1>
<ol>
<li><strong>처음 보는 표는 <code>LIMIT</code> 부터</strong> — <code>SELECT *</code> 를 그냥 날리지 않는다</li>
<li><strong><code>ORDER BY ... DESC</code> 는 큰 것부터</strong> — 기본은 <code>ASC</code></li>
<li><strong>문장 끝은 <code>;</code></strong> — 여러 문장을 나누는 표시</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:ph4eampalvicqj7uanfg5017eckninnx3gac27gumkrem;" data-marpit-pagination-total="48">
<h1 id="%EB%8B%A4%EC%9D%8C-%EC%8B%9C%EA%B0%84-1020-%ED%99%94--4%EC%B0%A8%EC%8B%9C">다음 시간 (10/20 화 · 4차시)</h1>
<ul>
<li><strong><code>WHERE</code></strong> — 조건으로 걸러내기 · <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong><code>NULL</code></strong></li>
<li>집계 함수 — <code>COUNT</code> · <code>SUM</code> · <code>AVG</code> · <code>MAX</code> · <code>MIN</code></li>
<li><strong><code>GROUP BY</code></strong> · <code>HAVING</code> — 묶어서 세고, 묶은 것을 거른다</li>
</ul>
<blockquote>
<p>오늘 과제에서 손으로 세어 본 것을 <strong>한 줄로</strong> 해결합니다.</p>
</blockquote>
</section>
