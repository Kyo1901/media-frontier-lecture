<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span>   r.department,
         <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> 전체,
         <span class="hljs-built_in">SUM</span>(<span class="hljs-keyword">CASE</span> <span class="hljs-keyword">WHEN</span> a.section <span class="hljs-operator">!=</span> REPLACE(r.department,<span class="hljs-string">&#x27;부&#x27;</span>,<span class="hljs-string">&#x27;&#x27;</span>)

<span class="hljs-keyword">FROM</span>     articles a
<span class="hljs-keyword">JOIN</span>     reporters r <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id

<h1 id="%EC%98%A4%EB%8A%98-%ED%95%A0-%EC%9D%BC">오늘 할 일</h1>
<table>

<tr>

</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>서브쿼리</strong> — 값 하나를 구해다 쓰기</td>
</tr>
<tr>
<td>2</td>
<td><code>IN</code> — 여러 값을 구해다 쓰기</td>
</tr>
<tr>
<td>3</td>
<td><code>FROM</code> 속 서브쿼리 — 집계를 다시 집계</td>
</tr>
<tr>
<td>4</td>
<td>언제 <code>JOIN</code>, 언제 서브쿼리</td>
</tr>
</tbody>
</table>
<blockquote>
<p>오늘이 끝나면 <strong>&quot;평균보다 많이 읽힌 기사&quot;</strong> 를 직접 씁니다.</p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-class="section" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="section" data-marpit-pagination="5" style="--paginate:true;--class:section;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="1%EC%B0%A8%EC%8B%9C">1차시</h1>
<h2 id="%EA%B0%92-%ED%95%98%EB%82%98%EB%A5%BC-%EA%B5%AC%ED%95%B4%EB%8B%A4-%EC%93%B0%EA%B8%B0">값 하나를 구해다 쓰기</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="quiz" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="quiz" data-marpit-pagination="6" style="--paginate:true;--class:quiz;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%ED%8F%89%EA%B7%A0%EB%B3%B4%EB%8B%A4-%EB%A7%8E%EC%9D%B4-%EC%9D%BD%ED%9E%8C-%EA%B8%B0%EC%82%AC%EB%A5%BC-%EB%BD%91%EC%9C%BC%EB%A0%A4%EB%A9%B4">평균보다 많이 읽힌 기사를 뽑으려면?</h1>
<p>전체 평균 조회수는 <strong>8,296.70</strong> 입니다 (2일차).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> title, views
<span class="hljs-keyword">FROM</span>   articles
<span class="hljs-keyword">WHERE</span>  views <span class="hljs-operator">&gt;</span> <span class="hljs-built_in">AVG</span>(views);
</code></pre>
<p><strong>이렇게 하면 될까요?</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EC%98%A4%EB%A5%98%EC%9E%85%EB%8B%88%EB%8B%A4--2%EC%9D%BC%EC%B0%A8%EC%97%90-%EB%B0%B0%EC%9A%B4-%EA%B7%B8%EA%B2%83">오류입니다 — 2일차에 배운 그것</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>ERROR 1111 (HY000): Invalid use of group function
</code></pre>
<p><code>WHERE</code>는 <strong>묶기 전</strong>에 실행됩니다. 그 시점에 <code>AVG</code>는 아직 없습니다.</p>
<blockquote>
<p>2일차 실행 순서: <code>FROM</code> → <strong><code>WHERE</code></strong> → <code>GROUP BY</code> → <code>HAVING</code> → <code>SELECT</code> → <code>ORDER BY</code></p>
</blockquote>
<p><strong>그럼 평균을 어떻게 알아내죠?</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EB%A8%BC%EC%A0%80-%EA%B5%AC%ED%95%B4%EC%84%9C-%EA%B7%B8-%EA%B0%92%EC%9D%84-%EC%93%B4%EB%8B%A4">먼저 구해서, 그 값을 쓴다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> title, views
<span class="hljs-keyword">FROM</span>   articles
<span class="hljs-keyword">WHERE</span>  views <span class="hljs-operator">&gt;</span> (<span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">AVG</span>(views) <span class="hljs-keyword">FROM</span> articles);
</code></pre>
<p>괄호 안의 <code>SELECT</code>가 <strong>먼저</strong> 실행되어 <code>8296.70</code> 이라는 <strong>값 하나</strong>가 되고,<br />
바깥 쿼리는 그 값을 그냥 숫자처럼 씁니다.</p>
<blockquote>
<p>이렇게 쿼리 안에 들어간 쿼리를 <strong>서브쿼리</strong>라고 합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<svg style="display:block;margin:0 auto 18px" id="dg1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 576" width="1000" height="488" role="img" aria-label="서브쿼리는 안쪽이 먼저 실행되어 값 하나가 되고 바깥 쿼리는 그 자리에 숫자가 적혀 있던 것처럼 실행된다">
  <defs>
    <marker id="dg1-p1" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#5CC6DE" />
    </marker>
    <style>
#dg1 .box{ fill:#344A59; stroke:#6D869A; stroke-width:2; }
#dg1 .box-a{ fill:#1F5065; stroke:#5CC6DE; stroke-width:3; }
#dg1 .code{ font-family:var(--mono);
               fill:#D8E6EE; font-size:22px; }

               fill:#7FD3E8; font-size:22px; font-weight:700; }
#dg1 .val{ font-family:var(--mono);
               fill:#F2C879; font-size:22px; font-weight:700; }

               fill:#F2C879; font-size:22px; font-weight:600; }

               fill:#9DB0BE; font-size:21px; text-anchor:middle; }
#dg1 .ln{ stroke:#5CC6DE; stroke-width:3; fill:none; marker-end:url(#dg1-p1); }
    </style>
  </defs>
  <text class="step" x="40" y="30">① 우리가 쓴 쿼리</text>
  <rect class="box" x="40" y="48" width="1100" height="126" rx="9" />
  <text class="kw"   x="66" y="84">SELECT</text>
  <text class="code" x="160" y="84">title, views</text>
  <text class="kw"   x="66" y="118">FROM</text>
  <text class="code" x="160" y="118">articles</text>
  <text class="kw"   x="66" y="152">WHERE</text>
  <text class="code" x="160" y="152">views &gt;</text>
  <rect x="264" y="130" width="404" height="30" rx="5" fill="#4A3A18" stroke="#F2C879" stroke-width="2" />
  <text class="val"  x="278" y="152">(SELECT AVG(views) FROM articles)</text>
  <line class="ln" x1="466" y1="182" x2="466" y2="228" />
  <text class="step" x="496" y="218">② 안쪽 서브쿼리가 먼저 실행된다</text>
  <rect class="box-a" x="264" y="234" width="404" height="60" rx="9" />
  <text class="val" x="278" y="272">(SELECT AVG(views) FROM articles)</text>
  <line class="ln" x1="466" y1="302" x2="466" y2="348" />
  <text class="step" x="496" y="338">③ 값 하나가 된다</text>
  <rect class="box-a" x="380" y="354" width="172" height="52" rx="9" />
  <text class="val" x="404" y="388">8296.70</text>
  <line class="ln" x1="466" y1="414" x2="466" y2="452" />
  <text class="step" x="496" y="448">④ 바깥은 그 숫자를 쓸 뿐이다</text>
  <rect class="box" x="40" y="458" width="1100" height="52" rx="9" />
  <text class="kw"   x="66" y="492">WHERE</text>
  <text class="code" x="160" y="492">views &gt;</text>
  <text class="val"  x="264" y="492">8296.70</text>
  <text class="lbl" x="590" y="556" style="font-size:22px">안쪽이 먼저 · 바깥이 나중 — 처음부터 숫자를 적어둔 것과 같아진다</text>
</svg>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="compact" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="compact" data-marpit-pagination="10" style="--paginate:true;--class:compact;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">

<thead>

</thead>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="quiz" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="quiz" data-marpit-pagination="11" style="--paginate:true;--class:quiz;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%F0%9F%94%B4-%ED%8F%89%EA%B7%A0%EC%9D%84-%EB%84%98%EB%8A%94-%EA%B8%B0%EC%82%AC%EA%B0%80-21%EB%BF%90%EC%9E%85%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 평균을 넘는 기사가 21%뿐입니다</h1>
<ul>
<li>조회수가 집계된 기사 <strong>475건</strong></li>
<li>그중 평균(8,296)을 넘는 것 <strong>100건 = 21.1%</strong></li>
</ul>
<p><strong>나머지 79%는 평균 아래입니다.</strong></p>
<blockquote>
<p>2일차에 본 중앙값 <strong>3,560</strong>을 떠올려 보세요.<br />
소수의 대박 기사가 평균을 끌어올려서, <strong>평균은 이미 &quot;보통&quot;이 아닙니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EC%84%9C%EB%B8%8C%EC%BF%BC%EB%A6%AC%EB%A5%BC-%EC%93%B8-%EC%88%98-%EC%9E%88%EB%8A%94-%EC%9E%90%EB%A6%AC">서브쿼리를 쓸 수 있는 자리</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- WHERE 안에서 (가장 흔하다)</span>
<span class="hljs-keyword">WHERE</span> views <span class="hljs-operator">&gt;</span> (<span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">AVG</span>(views) <span class="hljs-keyword">FROM</span> articles)

<span class="hljs-comment">-- SELECT 안에서 — 모든 줄에 같은 값이 붙는다</span>
<span class="hljs-keyword">SELECT</span> title, views,
       (<span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">AVG</span>(views) <span class="hljs-keyword">FROM</span> articles) <span class="hljs-keyword">AS</span> 전체평균
<span class="hljs-keyword">FROM</span>   articles;
</code></pre>
<blockquote>
<p>값 하나(스칼라)를 돌려주는 서브쿼리는 <strong>숫자가 들어갈 자리 어디든</strong> 쓸 수 있습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="quiz" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="quiz" data-marpit-pagination="13" style="--paginate:true;--class:quiz;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A0">실습 ①</h1>
<p><code>labs/01-db/day05/practice-1.sql</code></p>
<ol>
<li>평균보다 <strong>댓글</strong>이 많은 기사 (제목 · 댓글수, 상위 10건)</li>
<li>조회수가 <strong>가장 많은</strong> 기사 1건 — <code>MAX</code>를 서브쿼리로</li>
<li>각 기사에 <strong>전체 평균 조회수</strong>를 열로 붙이기 (상위 5건)</li>
<li><code>WHERE views &gt; AVG(views)</code> 를 실제로 실행해 오류 메시지 확인</li>
</ol>
<p><strong>15분</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="section" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="section" data-marpit-pagination="14" style="--paginate:true;--class:section;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="2%EC%B0%A8%EC%8B%9C">2차시</h1>
<h2 id="in--%EC%97%AC%EB%9F%AC-%EA%B0%92%EC%9D%84-%EA%B5%AC%ED%95%B4%EB%8B%A4-%EC%93%B0%EA%B8%B0">IN — 여러 값을 구해다 쓰기</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EA%B0%92%EC%9D%B4-%EC%97%AC%EB%9F%AC-%EA%B0%9C%EB%A9%B4">값이 여러 개면?</h1>
<p><strong>정치부 기자가 쓴 기사</strong>를 뽑고 싶습니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> id <span class="hljs-keyword">FROM</span> reporters <span class="hljs-keyword">WHERE</span> department <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;정치부&#x27;</span>;
</code></pre>
<p>→ <code>11</code>, <code>13</code>, <code>18</code> … <strong>값이 여러 개</strong> 나옵니다.</p>
<p><code>=</code> 로는 비교할 수 없습니다. 이럴 때 <strong><code>IN</code></strong> 을 씁니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="in-%EC%84%9C%EB%B8%8C%EC%BF%BC%EB%A6%AC">IN 서브쿼리</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span>   title, section
<span class="hljs-keyword">FROM</span>     articles
<span class="hljs-keyword">WHERE</span>    reporter_id <span class="hljs-keyword">IN</span> (<span class="hljs-keyword">SELECT</span> id
                         <span class="hljs-keyword">FROM</span>   reporters
                         <span class="hljs-keyword">WHERE</span>  department <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;정치부&#x27;</span>);
</code></pre>
<p><strong>111줄</strong> — 어제 <code>JOIN</code>으로 구했던 정치부 기사 수와 같습니다.</p>
<blockquote>
<p>2일차에 배운 <code>IN ('정치','사회')</code> 의 목록 자리에 <strong>쿼리를 넣은 것</strong>뿐입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EA%B0%99%EC%9D%80-%EB%8B%B5-%EB%91%90-%EA%B0%80%EC%A7%80-%EA%B8%B8">같은 답, 두 가지 길</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- 어제: JOIN</span>
<span class="hljs-keyword">SELECT</span> a.title <span class="hljs-keyword">FROM</span> articles a
<span class="hljs-keyword">JOIN</span>   reporters r <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id
<span class="hljs-keyword">WHERE</span>  r.department <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;정치부&#x27;</span>;

<span class="hljs-comment">-- 오늘: 서브쿼리</span>
<span class="hljs-keyword">SELECT</span> title <span class="hljs-keyword">FROM</span> articles
<span class="hljs-keyword">WHERE</span>  reporter_id <span class="hljs-keyword">IN</span> (<span class="hljs-keyword">SELECT</span> id <span class="hljs-keyword">FROM</span> reporters <span class="hljs-keyword">WHERE</span> department<span class="hljs-operator">=</span><span class="hljs-string">&#x27;정치부&#x27;</span>);
</code></pre>
<p><strong>둘 다 111줄.</strong> 어느 쪽이 맞다기보다 <strong>읽기 쉬운 쪽</strong>을 고릅니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">

  <line class="ln" x1="940" y1="290" x2="940" y2="336" />
  <text class="lbl" x="1120" y="320" style="font-size:19px">바깥은 이 목록으로 거를 뿐</text>

  <text class="cell" x="1005" y="432">정치</text>

  <text class="lbl" x="940" y="536">→ 거르기만 하면 서브쿼리</text>
  <text class="lbl" x="630" y="580" style="font-size:22px">둘 다 111줄 — 같은 답에 이르는 두 길이다</text>
</svg>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EA%B2%B0%EA%B3%BC%EC%97%90-%EB%8B%A4%EB%A5%B8-%ED%91%9C%EC%9D%98-%EC%97%B4%EC%9D%B4-%ED%95%84%EC%9A%94%ED%95%98%EB%A9%B4-join">결과에 다른 표의 열이 필요하면 JOIN</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- 기자 이름을 같이 보여주고 싶다면 → JOIN 이어야 한다</span>
<span class="hljs-keyword">SELECT</span> a.title, r.name, r.department
<span class="hljs-keyword">FROM</span>   articles a
<span class="hljs-keyword">JOIN</span>   reporters r <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id
<span class="hljs-keyword">WHERE</span>  r.department <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;정치부&#x27;</span>;
</code></pre>
<p>서브쿼리는 <strong>거르는 데만</strong> 쓰였을 뿐, <code>reporters</code>의 열은 결과에 못 옵니다.</p>
<blockquote>
<p><strong>거르기만 하면 서브쿼리, 보여줘야 하면 <code>JOIN</code>.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="not-in--%EB%AA%A9%EB%A1%9D%EC%97%90-%EC%97%86%EB%8A%94-%EA%B2%83">NOT IN — 목록에 없는 것</h1>
<p>어제 <code>LEFT JOIN</code>으로 찾았던 <strong>기사를 한 건도 안 쓴 기자</strong>를,<br />
서브쿼리로도 찾을 수 있습니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> name, department
<span class="hljs-keyword">FROM</span>   reporters
<span class="hljs-keyword">WHERE</span>  id <span class="hljs-keyword">NOT</span> <span class="hljs-keyword">IN</span> (<span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">DISTINCT</span> reporter_id <span class="hljs-keyword">FROM</span> articles);
</code></pre>
<p><strong>한서윤</strong> — 어제와 같은 답입니다.</p>
<blockquote>
<p>어제는 &quot;짝이 없는 행&quot;으로, 오늘은 &quot;목록에 없는 값&quot;으로 찾았습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EB%AA%A9%EB%A1%9D-%EB%91%90-%EA%B0%9C--it-%EA%B8%B0%EC%9E%90--%EB%AC%B8%ED%99%94-%EA%B8%B0%EC%9E%90">목록 두 개 — IT 기자 · 문화 기자</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">DISTINCT</span> reporter <span class="hljs-keyword">FROM</span> articles <span class="hljs-keyword">WHERE</span> section <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;IT&#x27;</span>;     <span class="hljs-comment">-- 8명</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">DISTINCT</span> reporter <span class="hljs-keyword">FROM</span> articles <span class="hljs-keyword">WHERE</span> section <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;문화&#x27;</span>;   <span class="hljs-comment">-- 10명</span>
</code></pre>
<blockquote>
<p><strong>두 목록을 합치면 몇 명일까요?</strong> 둘 다 쓴 기자는 몇 명일까요?</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="union--%EC%A4%84%EC%9D%84-%EC%95%84%EB%9E%98%EB%A1%9C-%EC%9E%87%EB%8A%94%EB%8B%A4">UNION — 줄을 아래로 잇는다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">DISTINCT</span> reporter <span class="hljs-keyword">FROM</span> articles <span class="hljs-keyword">WHERE</span> section <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;IT&#x27;</span>
<span class="hljs-keyword">UNION</span> <span class="hljs-keyword">ALL</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">DISTINCT</span> reporter <span class="hljs-keyword">FROM</span> articles <span class="hljs-keyword">WHERE</span> section <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;문화&#x27;</span>;

<span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">DISTINCT</span> reporter <span class="hljs-keyword">FROM</span> articles <span class="hljs-keyword">WHERE</span> section <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;IT&#x27;</span>
<span class="hljs-keyword">UNION</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">DISTINCT</span> reporter <span class="hljs-keyword">FROM</span> articles <span class="hljs-keyword">WHERE</span> section <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;문화&#x27;</span>;
</code></pre>
<blockquote>
<p><code>JOIN</code> 은 <strong>옆으로</strong>(열을) 붙이고, <code>UNION</code> 은 <strong>아래로</strong>(줄을) 잇습니다.<br />
위아래 <code>SELECT</code> 의 <strong>열 개수가 같아야</strong> 합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="intersect--except--%EA%B2%B9%EC%B9%98%EB%8A%94-%EA%B2%83--%EB%B9%BC%EB%8A%94-%EA%B2%83">INTERSECT · EXCEPT — 겹치는 것 · 빼는 것</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> reporter <span class="hljs-keyword">FROM</span> articles <span class="hljs-keyword">WHERE</span> section <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;IT&#x27;</span>
<span class="hljs-keyword">INTERSECT</span>
<span class="hljs-keyword">SELECT</span> reporter <span class="hljs-keyword">FROM</span> articles <span class="hljs-keyword">WHERE</span> section <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;문화&#x27;</span>;

<span class="hljs-keyword">SELECT</span> reporter <span class="hljs-keyword">FROM</span> articles <span class="hljs-keyword">WHERE</span> section <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;IT&#x27;</span>
<span class="hljs-keyword">EXCEPT</span>
<span class="hljs-keyword">SELECT</span> reporter <span class="hljs-keyword">FROM</span> articles <span class="hljs-keyword">WHERE</span> section <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;문화&#x27;</span>;
</code></pre>
<blockquote>
<p><strong>방금 배운 <code>IN</code> · <code>NOT IN</code> 으로도 같은 답</strong>이 나옵니다. (MySQL 8.0.31 부터 됩니다)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EB%84%A4-%EA%B0%80%EC%A7%80%EB%A5%BC-%ED%95%9C-%EC%9E%A5%EC%9C%BC%EB%A1%9C">네 가지를 한 장으로</h1>
<svg style="display:block;margin:0 auto 18px" id="dg3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 340" width="1130" height="312" role="img" aria-label="왼쪽 원은 IT 기사를 쓴 기자 8명, 오른쪽 원은 문화 기사를 쓴 기자 10명이고 둘 다 쓴 기자가 5명이다. UNION ALL 은 두 목록을 그대로 이어 18줄이 되어 겹친 5명이 두 번 나온다. UNION 은 겹친 5명을 한 번만 남겨 13줄이다. INTERSECT 는 겹친 부분만 남겨 5줄로 IN 서브쿼리와 같고, EXCEPT 는 IT 에만 있는 3줄로 NOT IN 서브쿼리와 같다">
  <g font-family="'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
  <circle cx="122" cy="180" r="72" fill="#1F5065" /><circle cx="202" cy="180" r="72" fill="#1F5065" /><path d="M 162 120.13 A 72 72 0 0 1 162 239.87 A 72 72 0 0 1 162 120.13 Z" fill="#4A3A18" stroke="#F2C879" stroke-width="2" /><circle cx="122" cy="180" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><circle cx="202" cy="180" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><circle cx="122" cy="180" r="72" fill="none" stroke="#5CC6DE" stroke-width="3" /><circle cx="202" cy="180" r="72" fill="none" stroke="#5CC6DE" stroke-width="3" /><text x="162" y="48" fill="#FFFFFF" font-size="21" text-anchor="middle" font-weight="600" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">UNION ALL</text><text x="92" y="96" fill="#9DB0BE" font-size="17" text-anchor="middle">IT</text><text x="232" y="96" fill="#9DB0BE" font-size="17" text-anchor="middle">문화</text><text x="84" y="187" fill="#FFFFFF" font-size="20" text-anchor="middle" font-weight="600">3</text><text x="162" y="187" fill="#F2C879" font-size="20" text-anchor="middle" font-weight="600">5×2</text><text x="240" y="187" fill="#FFFFFF" font-size="20" text-anchor="middle" font-weight="600">5</text><text x="162" y="292" fill="#FFFFFF" font-size="18" text-anchor="middle" font-weight="600">8 + 10 = 18줄</text><text x="162" y="318" fill="#F2C879" font-size="16" text-anchor="middle">겹친 5명이 두 번 나온다</text><circle cx="427" cy="180" r="72" fill="#1F5065" /><circle cx="507" cy="180" r="72" fill="#1F5065" /><circle cx="427" cy="180" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><circle cx="507" cy="180" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><circle cx="427" cy="180" r="72" fill="none" stroke="#5CC6DE" stroke-width="3" /><circle cx="507" cy="180" r="72" fill="none" stroke="#5CC6DE" stroke-width="3" /><text x="467" y="48" fill="#FFFFFF" font-size="21" text-anchor="middle" font-weight="600" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">UNION</text><text x="397" y="96" fill="#9DB0BE" font-size="17" text-anchor="middle">IT</text><text x="537" y="96" fill="#9DB0BE" font-size="17" text-anchor="middle">문화</text><text x="389" y="187" fill="#FFFFFF" font-size="20" text-anchor="middle" font-weight="600">3</text><text x="467" y="187" fill="#FFFFFF" font-size="20" text-anchor="middle" font-weight="600">5</text><text x="545" y="187" fill="#FFFFFF" font-size="20" text-anchor="middle" font-weight="600">5</text><text x="467" y="292" fill="#FFFFFF" font-size="18" text-anchor="middle" font-weight="600">13줄</text><text x="467" y="318" fill="#9DB0BE" font-size="16" text-anchor="middle">겹친 5명은 한 번만</text><path d="M 772 120.13 A 72 72 0 0 1 772 239.87 A 72 72 0 0 1 772 120.13 Z" fill="#1F5065" /><circle cx="732" cy="180" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><circle cx="812" cy="180" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><path d="M 772 120.13 A 72 72 0 0 1 772 239.87 A 72 72 0 0 1 772 120.13 Z" fill="none" stroke="#5CC6DE" stroke-width="3" /><text x="772" y="48" fill="#FFFFFF" font-size="21" text-anchor="middle" font-weight="600" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">INTERSECT</text><text x="702" y="96" fill="#9DB0BE" font-size="17" text-anchor="middle">IT</text><text x="842" y="96" fill="#9DB0BE" font-size="17" text-anchor="middle">문화</text><text x="694" y="187" fill="#9DB0BE" font-size="20" text-anchor="middle" font-weight="600">3</text><text x="772" y="187" fill="#FFFFFF" font-size="20" text-anchor="middle" font-weight="600">5</text><text x="850" y="187" fill="#9DB0BE" font-size="20" text-anchor="middle" font-weight="600">5</text><text x="772" y="292" fill="#FFFFFF" font-size="18" text-anchor="middle" font-weight="600">5줄 — 둘 다 쓴 기자</text><text x="772" y="318" fill="#9DB0BE" font-size="16" text-anchor="middle">IN 서브쿼리와 같은 답</text><path d="M 1077 120.13 A 72 72 0 1 0 1077 239.87 A 72 72 0 0 1 1077 120.13 Z" fill="#1F5065" /><circle cx="1037" cy="180" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><circle cx="1117" cy="180" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><path d="M 1077 120.13 A 72 72 0 1 0 1077 239.87 A 72 72 0 0 1 1077 120.13 Z" fill="none" stroke="#5CC6DE" stroke-width="3" /><text x="1077" y="48" fill="#FFFFFF" font-size="21" text-anchor="middle" font-weight="600" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">EXCEPT</text><text x="1007" y="96" fill="#9DB0BE" font-size="17" text-anchor="middle">IT</text><text x="1147" y="96" fill="#9DB0BE" font-size="17" text-anchor="middle">문화</text><text x="999" y="187" fill="#FFFFFF" font-size="20" text-anchor="middle" font-weight="600">3</text><text x="1077" y="187" fill="#9DB0BE" font-size="20" text-anchor="middle" font-weight="600">5</text><text x="1155" y="187" fill="#9DB0BE" font-size="20" text-anchor="middle" font-weight="600">5</text><text x="1077" y="292" fill="#FFFFFF" font-size="18" text-anchor="middle" font-weight="600">3줄 — IT 에만 쓴 기자</text><text x="1077" y="318" fill="#9DB0BE" font-size="16" text-anchor="middle">NOT IN 서브쿼리와 같은 답</text>
  </g>
</svg>
<blockquote>
<p>중복을 지우려면 일을 더 해야 합니다. <strong>겹칠 일이 없으면 <code>UNION ALL</code></strong> 이 빠릅니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="full-outer-join-%EB%A7%8C%EB%93%A4%EA%B8%B0">FULL OUTER JOIN 만들기</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> r.name, a.id
<span class="hljs-keyword">FROM</span>   reporters r <span class="hljs-keyword">LEFT</span>  <span class="hljs-keyword">JOIN</span> articles a <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id
<span class="hljs-keyword">UNION</span>
<span class="hljs-keyword">SELECT</span> r.name, a.id
<span class="hljs-keyword">FROM</span>   reporters r <span class="hljs-keyword">RIGHT</span> <span class="hljs-keyword">JOIN</span> articles a <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id;
</code></pre>
<p><strong>501줄.</strong> 어제 그림의 <strong>네 번째 칸</strong> — MySQL 에는 없어서 <code>LEFT ∪ RIGHT</code> 로 만듭니다.</p>
<blockquote>
<p>기사에만 있는 줄(기자 없는 기사)은 <strong>0줄</strong>이라 <code>LEFT JOIN</code> 과 같은 숫자입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="quiz compact" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="quiz compact" data-marpit-pagination="26" style="--paginate:true;--class:quiz compact;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A1">실습 ②</h1>
<p><code>labs/01-db/day05/practice-2.sql</code></p>
<ol>
<li><strong>사회부</strong> 기자가 쓴 기사 수 — <code>IN</code> 서브쿼리로</li>
<li>같은 것을 <code>JOIN</code>으로 — 결과가 같은지 확인</li>
<li><strong>정치 · 경제</strong> 둘 다 쓴 기자 — <code>INTERSECT</code> 로, 그리고 <code>IN</code> 으로</li>
<li>기사를 쓴 적 있는 기자 이름만 — <code>IN</code> 으로</li>
<li>생각해보기 — 기자 <strong>이름</strong>까지 보여주려면 어느 쪽을 써야 할까요?</li>
<li>더 해보기(선택) — 정치만 쓰고 경제는 안 쓴 기자 — <code>EXCEPT</code> · <code>NOT IN</code></li>
</ol>
<p><strong>14분</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="section" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="section" data-marpit-pagination="27" style="--paginate:true;--class:section;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="3%EC%B0%A8%EC%8B%9C">3차시</h1>
<h2 id="from-%EC%86%8D-%EC%84%9C%EB%B8%8C%EC%BF%BC%EB%A6%AC--%EC%A7%91%EA%B3%84%EB%A5%BC-%EB%8B%A4%EC%8B%9C-%EC%A7%91%EA%B3%84">FROM 속 서브쿼리 — 집계를 다시 집계</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="quiz" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="quiz" data-marpit-pagination="28" style="--paginate:true;--class:quiz;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EB%B6%80%EC%84%9C-%ED%8F%89%EA%B7%A0%EB%93%A4%EC%9D%98-%ED%8F%89%EA%B7%A0%EC%9D%80">부서 평균들의 평균은?</h1>
<p>어제 부서별 평균 조회수를 구했습니다.</p>
<table>
<thead>
<tr>
<th style="text-align:right">문화부</th>
<th style="text-align:right">스포츠부</th>
<th style="text-align:right">사회부</th>
<th style="text-align:right">정치부</th>
<th style="text-align:right">경제부</th>
<th style="text-align:right">IT부</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:right">15,129</td>
<td style="text-align:right">11,650</td>
<td style="text-align:right">7,504</td>
<td style="text-align:right">6,833</td>
<td style="text-align:right">6,775</td>
<td style="text-align:right">5,404</td>
</tr>
</tbody>
</table>
<p><strong>이 여섯 값의 평균</strong>을 구하려면 어떻게 할까요?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EA%B2%B0%EA%B3%BC%EB%A5%BC-%ED%91%9C%EC%B2%98%EB%9F%BC-%EB%86%93%EA%B3%A0-%EB%8B%A4%EC%8B%9C-%EB%AC%BB%EB%8A%94%EB%8B%A4">결과를 표처럼 놓고 다시 묻는다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> ROUND(<span class="hljs-built_in">AVG</span>(부서평균), <span class="hljs-number">1</span>) <span class="hljs-keyword">AS</span> 평균의평균
<span class="hljs-keyword">FROM</span>   (<span class="hljs-keyword">SELECT</span>   r.department,
                 <span class="hljs-built_in">AVG</span>(a.views) <span class="hljs-keyword">AS</span> 부서평균
        <span class="hljs-keyword">FROM</span>     articles a
        <span class="hljs-keyword">JOIN</span>     reporters r <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id
        <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> r.department) <span class="hljs-keyword">AS</span> t;
</code></pre>
<p>안쪽 쿼리의 <strong>결과 6줄이 하나의 표</strong>가 되고, 바깥이 그 표를 집계합니다.</p>
<blockquote>
<p>이렇게 <code>FROM</code>에 들어간 서브쿼리를 <strong>파생 테이블</strong>이라고 합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%F0%9F%94%B4-%EB%B3%84%EC%B9%AD%EC%9D%84-%EB%B0%98%EB%93%9C%EC%8B%9C-%EB%B6%99%EC%9D%BC-%EA%B2%83"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 별칭을 반드시 붙일 것</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">FROM</span> (<span class="hljs-keyword">SELECT</span> ...) <span class="hljs-keyword">AS</span> t
                  <span class="hljs-operator">^</span><span class="hljs-operator">^</span><span class="hljs-operator">^</span><span class="hljs-operator">^</span>
</code></pre>
<p><code>FROM</code>의 서브쿼리에는 <strong>이름(별칭)이 꼭 있어야</strong> 합니다. 없으면 오류입니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>ERROR 1248 (42000): Every derived table must have its own alias
</code></pre>
<blockquote>
<p><code>articles a</code> 처럼 <strong>표에 이름을 붙이던 것</strong>(4일차)과 같습니다.<br />
<code>FROM</code>에 놓인 서브쿼리도 &quot;표&quot;이므로 이름이 있어야 합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EA%B2%B0%EA%B3%BC">결과</h1>
<table>
<thead>
<tr>
<th style="text-align:right">평균의평균</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:right"><strong>8,882.5</strong></td>
</tr>
</tbody>
</table>
<p>전체 평균은 <strong>8,296.7</strong> 이었습니다. <strong>값이 다릅니다.</strong></p>
<blockquote>
<p>부서마다 기사 수가 다른데(문화부 47 · 사회부 118) 여섯 부서를 <strong>똑같이 한 표씩</strong><br />
쳐서 평균 냈기 때문입니다. <strong>어떻게 묶느냐가 답을 바꿉니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="quiz" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="quiz" data-marpit-pagination="32" style="--paginate:true;--class:quiz;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A2">실습 ③</h1>
<p><code>labs/01-db/day05/practice-3.sql</code></p>
<ol>
<li><strong>섹션별 평균 조회수</strong> 중 가장 높은 값 — 파생 테이블로</li>
<li>기사를 <strong>30건 이상</strong> 쓴 기자들의 <strong>평균 기사 수</strong></li>
<li>부서별 평균 조회수가 <strong>전체 평균(8,296)보다 높은</strong> 부서만</li>
<li>별칭 <code>AS t</code> 를 빼고 실행해 오류 확인</li>
</ol>
<p><strong>20분</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-class="section" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="section" data-marpit-pagination="33" style="--paginate:true;--class:section;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="4%EC%B0%A8%EC%8B%9C">4차시</h1>
<h2 id="%EB%B0%94%EA%B9%A5-%EC%A4%84%EB%A7%88%EB%8B%A4-%EB%8B%A4%EC%8B%9C-%EA%B3%84%EC%82%B0%ED%95%98%EA%B8%B0">바깥 줄마다 다시 계산하기</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="quiz" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="quiz" data-marpit-pagination="34" style="--paginate:true;--class:quiz;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EC%9E%90%EA%B8%B0-%EC%84%B9%EC%85%98-%ED%8F%89%EA%B7%A0%EB%B3%B4%EB%8B%A4-%EB%86%92%EC%9D%80-%EA%B8%B0%EC%82%AC%EB%8A%94">&quot;자기 섹션 평균&quot;보다 높은 기사는?</h1>
<p>지금까지 서브쿼리는 <strong>한 번만</strong> 계산됐습니다 (전체 평균 8,296).</p>
<p>그런데 <strong>정치 기사는 정치 평균과, 문화 기사는 문화 평균과</strong> 비교하려면?</p>
<p><strong>기사마다 비교 대상이 달라집니다.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EC%83%81%EA%B4%80-%EC%84%9C%EB%B8%8C%EC%BF%BC%EB%A6%AC">상관 서브쿼리</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> a.title, a.section, a.views
<span class="hljs-keyword">FROM</span>   articles a
<span class="hljs-keyword">WHERE</span>  a.views <span class="hljs-operator">&gt;</span> (<span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">AVG</span>(b.views)
                  <span class="hljs-keyword">FROM</span>   articles b
                  <span class="hljs-keyword">WHERE</span>  b.section <span class="hljs-operator">=</span> a.section);
</code></pre>
<p>안쪽이 <strong>바깥의 <code>a.section</code>을 참조</strong>해, 줄이 바뀔 때마다 <strong>다시 계산</strong>됩니다. <strong>119줄</strong> (전체 기준은 100줄).</p>
<blockquote>
<p>전교 1등이 아니라 <strong>반에서 1등</strong>을 찾는 셈입니다. 반이 바뀌면 기준도 바뀝니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-class="compact" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="compact" data-marpit-pagination="36" style="--paginate:true;--class:compact;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EC%84%B9%EC%85%98%EB%B3%84%EB%A1%9C-%EB%82%98%EB%88%A0-%EB%B3%B4%EB%A9%B4">섹션별로 나눠 보면</h1>
<table>
<thead>
<tr>
<th>section</th>
<th style="text-align:right">자기 섹션 평균 초과</th>
</tr>
</thead>
<tbody>
<tr>
<td>정치</td>
<td style="text-align:right">31</td>
</tr>
<tr>
<td>사회</td>
<td style="text-align:right">30</td>
</tr>
<tr>
<td>스포츠</td>
<td style="text-align:right">22</td>
</tr>
<tr>
<td>IT</td>
<td style="text-align:right">14</td>
</tr>
<tr>
<td>문화</td>
<td style="text-align:right">12</td>
</tr>
<tr>
<td>경제</td>
<td style="text-align:right">10</td>
</tr>
</tbody>
</table>
<blockquote>
<p>비교 기준을 바꾸면 <strong>보이는 기사가 달라집니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-class="compact" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="compact" data-marpit-pagination="37" style="--paginate:true;--class:compact;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EC%96%B8%EC%A0%9C-%EB%AC%B4%EC%97%87%EC%9D%84-%EC%93%B0%EB%82%98">언제 무엇을 쓰나</h1>
<table>
<thead>
<tr>
<th>하고 싶은 것</th>
<th>방법</th>
</tr>
</thead>
<tbody>
<tr>
<td>다른 표의 <strong>열을 결과에 보여주기</strong></td>
<td><code>JOIN</code></td>
</tr>
<tr>
<td>조건으로 <strong>거르기만</strong></td>
<td>서브쿼리 (<code>IN</code>·비교)</td>
</tr>
<tr>
<td><strong>집계 결과를 다시</strong> 집계</td>
<td><code>FROM</code> 파생 테이블</td>
</tr>
<tr>
<td>줄마다 <strong>다른 기준</strong>과 비교</td>
<td>상관 서브쿼리</td>
</tr>
</tbody>
</table>
<blockquote>
<p>대부분은 <code>JOIN</code>과 서브쿼리 <strong>둘 다 됩니다.</strong> 읽기 쉬운 쪽을 고르십시오.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-class="quiz" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" class="quiz" data-marpit-pagination="38" style="--paginate:true;--class:quiz;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A3--%EC%A2%85%ED%95%A9">실습 ④ — 종합</h1>
<p><code>labs/01-db/day05/practice-4.sql</code></p>
<ol>
<li>자기 <strong>부서</strong> 평균보다 조회수가 높은 기사 (제목 · 부서, 상위 10건)</li>
<li>소속 부서의 기사 수가 <strong>100건 이상</strong>인 기자들의 이름</li>
<li>전체 평균 <strong>댓글 수</strong>보다 댓글이 많은 기사가 섹션별로 몇 건인지</li>
</ol>
<p><strong>25분</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EC%98%A4%EB%8A%98-%EB%B0%B0%EC%9A%B4-%EA%B2%83">오늘 배운 것</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- 값 하나</span>
<span class="hljs-keyword">WHERE</span> views <span class="hljs-operator">&gt;</span> (<span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">AVG</span>(views) <span class="hljs-keyword">FROM</span> articles)

<span class="hljs-comment">-- 여러 값</span>
<span class="hljs-keyword">WHERE</span> reporter_id <span class="hljs-keyword">IN</span> (<span class="hljs-keyword">SELECT</span> id <span class="hljs-keyword">FROM</span> reporters <span class="hljs-keyword">WHERE</span> ...)

<span class="hljs-comment">-- 표 하나 (별칭 필수)</span>
<span class="hljs-keyword">FROM</span> (<span class="hljs-keyword">SELECT</span> ... <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> ...) <span class="hljs-keyword">AS</span> t

<span class="hljs-comment">-- 바깥 줄을 참조 (줄마다 다시 계산)</span>
<span class="hljs-keyword">WHERE</span> a.views <span class="hljs-operator">&gt;</span> (<span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">AVG</span>(b.views) <span class="hljs-keyword">FROM</span> articles b <span class="hljs-keyword">WHERE</span> b.section <span class="hljs-operator">=</span> a.section)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EA%BC%AD-%EA%B8%B0%EC%96%B5%ED%95%A0-%EC%84%B8-%EA%B0%80%EC%A7%80">꼭 기억할 세 가지</h1>
<ol>
<li><strong>안쪽이 먼저 실행되고, 그 결과를 바깥이 쓴다</strong></li>
<li><strong>거르기만 하면 서브쿼리, 열을 보여줘야 하면 <code>JOIN</code></strong></li>
<li><strong><code>FROM</code> 서브쿼리에는 별칭이 반드시 필요하다</strong></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EB%8B%A4%EC%9D%8C-%EC%8B%9C%EA%B0%84-1026-%EC%9B%94--4%EC%B0%A8%EC%8B%9C">다음 시간 (10/26 월 · 4차시)</h1>
<ul>
<li><strong>넣기 · 고치기 · 지우기</strong> — 지금까지 파일로 «실행만» 했던 문장을 직접 씁니다</li>
<li><strong>테이블 설계</strong> — 우리가 쓰던 표를 처음부터 다시 만들어 본다</li>
<li>어떤 열을 어떤 타입으로 · 무엇을 키로</li>
<li>3일차의 「이상현상」이 설계 원칙으로 정리됩니다</li>
</ul>
<blockquote>
<p>6~7일차는 <strong>설계와 정규화</strong>입니다. 오늘까지가 &quot;읽기&quot;, 내일부터는 &quot;만들기&quot;입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:at9bil8i82fos62yfgysxeecf5l6auucf2sd5mh0wot;" data-marpit-pagination-total="42">
<h1 id="%EA%B3%BC%EC%A0%9C">과제</h1>
<ol>
<li>실습 ①②③④ 완성해 제출</li>
<li><strong>자기 부서 평균보다 높은 기사</strong>가 <strong>한 건도 없는</strong> 기자가 있는지 찾아보기<br />
→ 힌트: 실습④[1]을 기자별로 세어 보면 됩니다</li>
<li>여유가 되면 — 실습③[1]을 <code>JOIN</code> 없이, 서브쿼리만으로 다시 써보기</li>
</ol>
</section>
