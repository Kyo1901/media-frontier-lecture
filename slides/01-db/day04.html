<td>3</td>
<td><strong><code>LEFT JOIN</code></strong> — 짝이 없는 행은 어떻게 되나</td>
</tr>
<tr>
<td>4</td>
<td>실전 — <code>JOIN</code> + <code>GROUP BY</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>오늘이 끝나면 <strong>&quot;부서별 평균 조회수&quot;</strong> 를 직접 씁니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-class="section" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" class="section" data-marpit-pagination="4" style="--paginate:true;--class:section;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="1%EC%B0%A8%EC%8B%9C">1차시</h1>
<h2 id="%ED%91%9C%EB%A5%BC-%EC%8B%A4%EC%A0%9C%EB%A1%9C-%EB%A7%8C%EB%93%A0%EB%8B%A4">표를 실제로 만든다</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EA%B8%B0%EC%9E%90-%EB%AA%85%EB%8B%A8-%ED%91%9C-%EB%A7%8C%EB%93%A4%EA%B8%B0">기자 명단 표 만들기</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> reporters (
    id         <span class="hljs-type">INT</span> AUTO_INCREMENT <span class="hljs-keyword">PRIMARY KEY</span>,
    name       <span class="hljs-type">VARCHAR</span>(<span class="hljs-number">20</span>) <span class="hljs-keyword">NOT NULL</span>,
    department <span class="hljs-type">VARCHAR</span>(<span class="hljs-number">20</span>),
    hired_at   <span class="hljs-type">DATE</span>
);
</code></pre>
<ul>
<li><code>AUTO_INCREMENT</code> — 번호를 <strong>자동으로</strong> 매깁니다 (1, 2, 3 …)</li>
<li><code>PRIMARY KEY</code> — 어제 배운 <strong>기본키</strong></li>
</ul>
<blockquote>
<p>어제 미리 본 그대로입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EB%AA%85%EB%8B%A8-%EB%84%A3%EA%B8%B0">명단 넣기</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> reporters (name, department, hired_at) <span class="hljs-keyword">VALUES</span>
(<span class="hljs-string">&#x27;강도현&#x27;</span>, <span class="hljs-string">&#x27;문화부&#x27;</span>, <span class="hljs-string">&#x27;2024-03-07&#x27;</span>),
(<span class="hljs-string">&#x27;강현우&#x27;</span>, <span class="hljs-string">&#x27;문화부&#x27;</span>, <span class="hljs-string">&#x27;2021-05-01&#x27;</span>),
(<span class="hljs-string">&#x27;권민준&#x27;</span>, <span class="hljs-string">&#x27;IT부&#x27;</span>,   <span class="hljs-string">&#x27;2021-03-03&#x27;</span>),
...
(<span class="hljs-string">&#x27;조채원&#x27;</span>, <span class="hljs-string">&#x27;정치부&#x27;</span>, <span class="hljs-string">&#x27;2024-04-11&#x27;</span>);
</code></pre>
<p><strong>19명</strong>입니다. <code>id</code>는 안 적었는데도 1번부터 자동으로 붙습니다.</p>
<blockquote>
<p>배포된 <code>reporters.sql</code> 을 실행하면 됩니다. 직접 다 치지 마세요.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="compact" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" class="compact" data-marpit-pagination="7" style="--paginate:true;--class:compact;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="articles%EC%97%90-%EC%99%B8%EB%9E%98%ED%82%A4-%EC%97%B4-%EB%B6%99%EC%9D%B4%EA%B8%B0">articles에 외래키 열 붙이기</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> articles <span class="hljs-keyword">ADD</span> <span class="hljs-keyword">COLUMN</span> reporter_id <span class="hljs-type">INTEGER</span>;

<span class="hljs-keyword">UPDATE</span> articles <span class="hljs-keyword">SET</span> reporter_id <span class="hljs-operator">=</span> (
    <span class="hljs-keyword">SELECT</span> id <span class="hljs-keyword">FROM</span> reporters <span class="hljs-keyword">WHERE</span> reporters.name <span class="hljs-operator">=</span> articles.reporter
);
</code></pre>
<ul>
<li><code>ALTER TABLE</code> — 이미 있는 표에 <strong>열을 추가</strong>합니다</li>
<li>이름을 보고 번호를 찾아 채워 넣었습니다</li>
<li>원래의 <code>reporter</code>(이름) 열은 <strong>일부러 남겨뒀습니다</strong> — 1~3일차 실습이 그 열을 씁니다</li>
</ul>
<p><strong>이제 어제 그림이 실제 스키마가 되었습니다.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EC%9E%98-%EB%B6%99%EC%97%88%EB%8A%94%EC%A7%80-%ED%99%95%EC%9D%B8">잘 붙었는지 확인</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> 전체, <span class="hljs-built_in">COUNT</span>(reporter_id) <span class="hljs-keyword">AS</span> 번호있음
<span class="hljs-keyword">FROM</span>   articles;
</code></pre>
<table>
<thead>
<tr>
<th style="text-align:right">전체</th>
<th style="text-align:right">번호있음</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:right">500</td>
<td style="text-align:right">500</td>
</tr>
</tbody>
</table>
<p><strong>500건 전부 번호가 채워졌습니다.</strong></p>
<blockquote>
<p>2일차의 <code>COUNT(*)</code> vs <code>COUNT(열)</code>을 여기서 다시 씁니다. 빈 곳이 있으면 숫자가 달랐겠죠.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="quiz" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" class="quiz" data-marpit-pagination="9" style="--paginate:true;--class:quiz;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EC%9D%B4%EC%A0%9C-%EB%B6%80%EC%84%9C%EB%A5%BC-%EC%95%8C-%EC%88%98-%EC%9E%88%EB%82%98%EC%9A%94">이제 부서를 알 수 있나요?</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> title, section, reporter_id <span class="hljs-keyword">FROM</span> articles LIMIT <span class="hljs-number">3</span>;
</code></pre>
<table>
<thead>
<tr>
<th>title</th>
<th>section</th>
<th style="text-align:right">reporter_id</th>
</tr>
</thead>
<tbody>
<tr>
<td>여야 예산안 놓고 공방</td>
<td>정치</td>
<td style="text-align:right">18</td>
</tr>
<tr>
<td>반도체 정책 발표에 업계 촉각</td>
<td>경제</td>
<td style="text-align:right">14</td>
</tr>
<tr>
<td>미술관 전시 개막</td>
<td>문화</td>
<td style="text-align:right">1</td>
</tr>
</tbody>
</table>
<p><strong>이름은 <code>reporter</code> 열에 있지만, <code>18</code>번이 어느 부서인지는 아직 모릅니다.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="section" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" class="section" data-marpit-pagination="10" style="--paginate:true;--class:section;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="2%EC%B0%A8%EC%8B%9C">2차시</h1>
<h2 id="join--%EB%91%90-%ED%91%9C%EB%A5%BC-%EB%B6%99%EC%9D%B8%EB%8B%A4">JOIN — 두 표를 붙인다</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="join">JOIN</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span>   a.title, r.name, r.department
<span class="hljs-keyword">FROM</span>     articles a
<span class="hljs-keyword">JOIN</span>     reporters r <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id
LIMIT    <span class="hljs-number">5</span>;
</code></pre>
<ul>
<li><code>articles a</code> · <code>reporters r</code> — 표에 <strong>짧은 별칭</strong>을 붙였습니다</li>
<li><code>ON a.reporter_id = r.id</code> — <strong>무엇을 기준으로 붙일지</strong></li>
</ul>
<blockquote>
<p><code>LIMIT</code>을 빼면 몇 줄 나올까요? 엑셀 <code>VLOOKUP</code>으로 옆에 부서를 붙이는 것과 같은 일입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">

<h1 id="%EC%99%9C-a-r-%EC%9D%84-%EB%B6%99%EC%9D%B4%EB%82%98">왜 <code>a.</code>, <code>r.</code> 을 붙이나</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> a.id, r.id <span class="hljs-keyword">FROM</span> articles a <span class="hljs-keyword">JOIN</span> reporters r <span class="hljs-keyword">ON</span> ...
</code></pre>
<p>두 표에 <strong><code>id</code>가 둘 다 있습니다.</strong> 그냥 <code>id</code>라고 쓰면 어느 쪽인지 모릅니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>ERROR 1052 (23000): Column 'id' in field list is ambiguous
</code></pre>
<blockquote>
<p>표가 하나일 땐 안 붙여도 되지만, <strong><code>JOIN</code>부터는 습관을 들이십시오.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="where%EC%99%80-%ED%95%A8%EA%BB%98">WHERE와 함께</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span>   a.title, a.views, r.name
<span class="hljs-keyword">FROM</span>     articles a
<span class="hljs-keyword">JOIN</span>     reporters r <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id
<span class="hljs-keyword">WHERE</span>    r.department <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;정치부&#x27;</span>
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> a.views <span class="hljs-keyword">DESC</span>
LIMIT    <span class="hljs-number">3</span>;
</code></pre>
<p><strong>붙인 다음에 거릅니다.</strong> <code>WHERE</code>에 <strong>다른 표의 열</strong>을 쓸 수 있게 된 것이 핵심입니다.</p>
<blockquote>
<p>어제까지는 <code>articles</code>에 없는 조건(부서)으로는 아예 거를 수 없었습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="quiz" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" class="quiz" data-marpit-pagination="16" style="--paginate:true;--class:quiz;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A0">실습 ①</h1>
<p><code>labs/01-db/day04/practice-1.sql</code></p>
<ol>
<li>기사 제목 · 기자 이름 · 부서를 함께 (<strong>기사 id 순 10건</strong>)</li>
<li><strong>사회부</strong> 기자가 쓴 기사는 몇 건? + 그중 조회수 상위 5건</li>
<li>조회수 1만 넘는 기사의 제목 · 기자 · 부서 (<strong>상위 10건</strong>)</li>
<li><code>a.</code>, <code>r.</code> 을 일부러 빼고 실행해 오류 메시지 확인</li>
</ol>
<p><strong>15분</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-class="section" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" class="section" data-marpit-pagination="17" style="--paginate:true;--class:section;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="3%EC%B0%A8%EC%8B%9C">3차시</h1>
<h2 id="left-join--%EC%A7%9D%EC%9D%B4-%EC%97%86%EC%9C%BC%EB%A9%B4">LEFT JOIN — 짝이 없으면?</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="quiz" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" class="quiz" data-marpit-pagination="18" style="--paginate:true;--class:quiz;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EA%B8%B0%EC%9E%90%EA%B0%80-%EB%AA%87-%EB%AA%85%EC%9D%B4%EB%9D%BC%EA%B3%A0-%ED%96%88%EC%A3%A0">기자가 몇 명이라고 했죠?</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FROM</span> reporters;                        <span class="hljs-comment">-- 19</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-keyword">DISTINCT</span> reporter_id) <span class="hljs-keyword">FROM</span> articles;      <span class="hljs-comment">-- 18</span>
</code></pre>
<p><strong>19명인데 기사를 쓴 사람은 18명.</strong></p>
<p>한 명은 어디 갔을까요?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%ED%95%9C%EC%84%9C%EC%9C%A4-%EA%B8%B0%EC%9E%90">한서윤 기자</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> reporters <span class="hljs-keyword">WHERE</span> name <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;한서윤&#x27;</span>;
</code></pre>
<table>
<thead>
<tr>
<th style="text-align:right">id</th>
<th>name</th>
<th>department</th>
<th>hired_at</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:right">19</td>
<td>한서윤</td>
<td>사회부</td>
<td>2026-09-01</td>
</tr>
</tbody>
</table>
<p><strong>입사한 지 얼마 안 돼 아직 기사가 없습니다.</strong></p>
<blockquote>
<p>어제 「삽입 이상」 — <em>&quot;신입인데 기사가 없어 넣을 자리가 없다&quot;</em> 를 기억하십니까?<br />
<strong>표를 나눴기 때문에</strong> 기사가 없어도 기자를 등록할 수 있게 된 것입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EA%B7%B8%EB%9F%B0%EB%8D%B0-join-%ED%95%98%EB%A9%B4-%EC%82%AC%EB%9D%BC%EC%A7%91%EB%8B%88%EB%8B%A4">그런데 JOIN 하면 사라집니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span>   r.name, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> 건수
<span class="hljs-keyword">FROM</span>     reporters r
<span class="hljs-keyword">JOIN</span>     articles a <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> r.id;
</code></pre>
<p><strong>18줄.</strong> 한서윤이 없습니다.</p>
<blockquote>
<p><code>JOIN</code>은 <strong>양쪽에 짝이 있는 행만</strong> 남깁니다. 그래서 <code>INNER JOIN</code>이라고도 합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="left-join">LEFT JOIN</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span>   r.name, <span class="hljs-built_in">COUNT</span>(a.id) <span class="hljs-keyword">AS</span> 건수
<span class="hljs-keyword">FROM</span>     reporters r
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> articles a <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> r.id
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> 건수 <span class="hljs-keyword">ASC</span>
LIMIT    <span class="hljs-number">3</span>;
</code></pre>
<p><strong>왼쪽(<code>reporters</code>)은 전부 남기고</strong>, 짝이 없으면 오른쪽을 <code>NULL</code>로 채웁니다.</p>
<blockquote>
<p><code>VLOOKUP</code>으로 치면 — 찾는 값이 없어도 그 행을 지우지 않고 <code>#N/A</code>로 남겨두는 것과 같습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-class="compact" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" class="compact" data-marpit-pagination="23" style="--paginate:true;--class:compact;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">

</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%F0%9F%94%B4-count-%EB%A5%BC-%EC%93%B0%EB%A9%B4-%EC%95%88-%EB%90%A9%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> COUNT(*) 를 쓰면 안 됩니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> r.name,
       <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>)     <span class="hljs-keyword">AS</span> 별표,   <span class="hljs-comment">-- 1  ← 틀림</span>
       <span class="hljs-built_in">COUNT</span>(a.id)  <span class="hljs-keyword">AS</span> 열      <span class="hljs-comment">-- 0  ← 맞음</span>
<span class="hljs-keyword">FROM</span>   reporters r
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> articles a <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id
<span class="hljs-keyword">WHERE</span>  r.name <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;한서윤&#x27;</span> <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> r.id;
</code></pre>
<p><code>LEFT JOIN</code>이 만든 줄은 <strong><code>NULL</code>로 채워진 줄이라도 한 줄</strong>입니다.<br />
<code>COUNT(*)</code>는 그 줄을 세어 <strong>1</strong>이 됩니다.</p>
<blockquote>
<p>2일차의 <code>COUNT(*)</code> 500 vs <code>COUNT(views)</code> 475와 <strong>똑같은 이야기</strong>입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%F0%9F%94%B4-on-%EC%9D%84-%EB%B9%BC%EB%A8%B9%EC%9C%BC%EB%A9%B4"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> ON 을 빼먹으면</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>)
<span class="hljs-keyword">FROM</span>   reporters r
<span class="hljs-keyword">JOIN</span>   articles  a;          <span class="hljs-comment">-- ON 이 없다</span>
</code></pre>
<blockquote>
<p><strong>오류가 날까요?</strong> 안 난다면 <strong>몇 줄</strong>이 나올까요?</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="cross-join--%EB%AA%A8%EB%93%A0-%EC%A1%B0%ED%95%A9">CROSS JOIN — 모든 조합</h1>
<svg style="display:block;margin:0 auto 18px" id="dg3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="840" height="350" role="img" aria-label="ON 조건 없이 두 표를 이으면 짝이 맞는지 보지 않고 모든 조합을 만든다. 기자 3명과 기사 2건이면 3 곱하기 2 로 6줄이 되고 기사가 없는 한서윤도 기사와 짝지어진다. 우리 표라면 19명 곱하기 500건으로 9500줄이 오류 없이 나온다">
  <defs><marker id="dg3-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5CC6DE" /></marker></defs>
  <g font-family="'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
  <text x="40" y="40" fill="#9DB0BE" font-size="17" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">reporters</text><rect x="40" y="56" width="180" height="156" rx="8" fill="#344A59" stroke="#6D869A" stroke-width="2" /><rect x="42" y="58" width="176" height="32" fill="#5CC6DE" /><text x="56" y="80" fill="#0A1218" font-size="16" font-weight="600" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">name</text><text x="56" y="118" fill="#FFFFFF" font-size="18">조채원</text><text x="56" y="158" fill="#FFFFFF" font-size="18">강도현</text><line x1="42" y1="132" x2="218" y2="132" stroke="#6D869A" stroke-width="1" /><text x="56" y="198" fill="#F2C879" font-size="18">한서윤</text><line x1="42" y1="172" x2="218" y2="172" stroke="#6D869A" stroke-width="1" /><text x="260" y="150" fill="#9DB0BE" font-size="40" text-anchor="middle">×</text><text x="300" y="40" fill="#9DB0BE" font-size="17" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">articles</text><rect x="300" y="56" width="160" height="116" rx="8" fill="#344A59" stroke="#6D869A" stroke-width="2" /><rect x="302" y="58" width="156" height="32" fill="#5CC6DE" /><text x="316" y="80" fill="#0A1218" font-size="16" font-weight="600" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">title</text><text x="316" y="118" fill="#FFFFFF" font-size="18">기사 ①</text><text x="316" y="158" fill="#FFFFFF" font-size="18">기사 ②</text><line x1="302" y1="132" x2="458" y2="132" stroke="#6D869A" stroke-width="1" /><text x="300" y="230" fill="#EC8B81" font-size="17" font-weight="600">ON 이 없다 —</text><text x="300" y="256" fill="#EC8B81" font-size="17">짝이 맞는지 안 본다</text><path d="M 470 196 L 556 196" stroke="#5CC6DE" stroke-width="3" fill="none" marker-end="url(#dg3-ar)" /><text x="560" y="40" fill="#5CC6DE" font-size="17" font-weight="600">결과 — 3 × 2 = 6줄</text><rect x="560" y="56" width="360" height="276" rx="8" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" /><rect x="562" y="58" width="356" height="32" fill="#5CC6DE" /><text x="576" y="80" fill="#0A1218" font-size="16" font-weight="600" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">name</text><text x="760" y="80" fill="#0A1218" font-size="16" font-weight="600" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">title</text><text x="576" y="118" fill="#FFFFFF" font-size="18">조채원</text><text x="760" y="118" fill="#FFFFFF" font-size="18">기사 ①</text><line x1="562" y1="132" x2="918" y2="132" stroke="#5CC6DE" stroke-width="1" /><text x="576" y="158" fill="#FFFFFF" font-size="18">조채원</text><text x="760" y="158" fill="#FFFFFF" font-size="18">기사 ②</text><line x1="562" y1="172" x2="918" y2="172" stroke="#5CC6DE" stroke-width="1" /><text x="576" y="198" fill="#FFFFFF" font-size="18">강도현</text><text x="760" y="198" fill="#FFFFFF" font-size="18">기사 ①</text><line x1="562" y1="212" x2="918" y2="212" stroke="#5CC6DE" stroke-width="1" /><text x="576" y="238" fill="#FFFFFF" font-size="18">강도현</text><text x="760" y="238" fill="#FFFFFF" font-size="18">기사 ②</text><line x1="562" y1="252" x2="918" y2="252" stroke="#5CC6DE" stroke-width="1" /><text x="576" y="278" fill="#F2C879" font-size="18">한서윤</text><text x="760" y="278" fill="#FFFFFF" font-size="18">기사 ①</text><line x1="562" y1="292" x2="918" y2="292" stroke="#5CC6DE" stroke-width="1" /><text x="576" y="318" fill="#F2C879" font-size="18">한서윤</text><text x="760" y="318" fill="#FFFFFF" font-size="18">기사 ②</text><text x="480" y="382" fill="#F2C879" font-size="18" text-anchor="middle" font-weight="600">우리 표라면 19명 × 500건 = 9,500줄 — 오류도 나지 않는다</text>
  </g>
</svg>
<blockquote>
<p>일부러 쓸 때는 <strong><code>CROSS JOIN</code></strong> 이라고 적습니다 — 8일차에 100만 건을 만들 때 씁니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="join-%EB%84%A4-%EA%B0%80%EC%A7%80--%EC%96%B4%EB%8A%90-%EC%A4%84%EC%9D%B4-%EB%82%A8%EB%8A%94%EA%B0%80">JOIN 네 가지 — 어느 줄이 남는가</h1>
<svg style="display:block;margin:0 auto 18px" id="dg4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 330" width="1130" height="303" role="img" aria-label="왼쪽 원은 기자 표, 오른쪽 원은 기사 표다. JOIN 은 두 원이 겹친 부분, 즉 양쪽에 짝이 있는 줄만 남겨 기사가 없는 한서윤이 빠진다. LEFT JOIN 은 왼쪽 원 전부를 남겨 한서윤이 NULL 로 남는다. RIGHT JOIN 은 오른쪽 원 전부로 표 순서를 바꾼 LEFT JOIN 과 같다. FULL OUTER JOIN 은 두 원 전부지만 MySQL 에는 없어서 5일차에 직접 만든다">
  <g font-family="'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
  <path d="M 162 110.13 A 72 72 0 0 1 162 229.87 A 72 72 0 0 1 162 110.13 Z" fill="#1F5065" /><circle cx="122" cy="170" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><circle cx="202" cy="170" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><path d="M 162 110.13 A 72 72 0 0 1 162 229.87 A 72 72 0 0 1 162 110.13 Z" fill="none" stroke="#5CC6DE" stroke-width="3" /><text x="162" y="48" fill="#FFFFFF" font-size="21" text-anchor="middle" font-weight="600" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">JOIN</text><text x="92" y="86" fill="#9DB0BE" font-size="17" text-anchor="middle">기자</text><text x="232" y="86" fill="#9DB0BE" font-size="17" text-anchor="middle">기사</text><text x="84" y="177" fill="#9DB0BE" font-size="16" text-anchor="middle" font-weight="600">한서윤</text><text x="162" y="282" fill="#FFFFFF" font-size="18" text-anchor="middle" font-weight="600">양쪽에 짝이 있는 줄만</text><text x="162" y="308" fill="#9DB0BE" font-size="16" text-anchor="middle">한서윤이 빠진다 · 500줄</text><circle cx="427" cy="170" r="72" fill="#1F5065" /><circle cx="427" cy="170" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><circle cx="507" cy="170" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><circle cx="427" cy="170" r="72" fill="none" stroke="#5CC6DE" stroke-width="3" /><text x="467" y="48" fill="#FFFFFF" font-size="21" text-anchor="middle" font-weight="600" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">LEFT JOIN</text><text x="397" y="86" fill="#9DB0BE" font-size="17" text-anchor="middle">기자</text><text x="537" y="86" fill="#9DB0BE" font-size="17" text-anchor="middle">기사</text><text x="389" y="177" fill="#FFFFFF" font-size="16" text-anchor="middle" font-weight="600">한서윤</text><text x="467" y="282" fill="#FFFFFF" font-size="18" text-anchor="middle" font-weight="600">왼쪽(기자)은 전부</text><text x="467" y="308" fill="#9DB0BE" font-size="16" text-anchor="middle">한서윤은 NULL 로 남는다 · 501줄</text><circle cx="812" cy="170" r="72" fill="#1F5065" /><circle cx="732" cy="170" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><circle cx="812" cy="170" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><circle cx="812" cy="170" r="72" fill="none" stroke="#5CC6DE" stroke-width="3" /><text x="772" y="48" fill="#FFFFFF" font-size="21" text-anchor="middle" font-weight="600" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">RIGHT JOIN</text><text x="702" y="86" fill="#9DB0BE" font-size="17" text-anchor="middle">기자</text><text x="842" y="86" fill="#9DB0BE" font-size="17" text-anchor="middle">기사</text><text x="694" y="177" fill="#9DB0BE" font-size="16" text-anchor="middle" font-weight="600">한서윤</text><text x="772" y="282" fill="#FFFFFF" font-size="18" text-anchor="middle" font-weight="600">오른쪽(기사)은 전부</text><text x="772" y="308" fill="#9DB0BE" font-size="16" text-anchor="middle">표 순서를 바꾼 LEFT JOIN</text><circle cx="1037" cy="170" r="72" fill="#1F5065" /><circle cx="1117" cy="170" r="72" fill="#1F5065" /><circle cx="1037" cy="170" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><circle cx="1117" cy="170" r="72" fill="none" stroke="#6D869A" stroke-width="2" /><circle cx="1037" cy="170" r="72" fill="none" stroke="#5CC6DE" stroke-width="3" /><circle cx="1117" cy="170" r="72" fill="none" stroke="#5CC6DE" stroke-width="3" /><text x="1077" y="48" fill="#F2C879" font-size="21" text-anchor="middle" font-weight="600" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">FULL OUTER JOIN</text><text x="1007" y="86" fill="#9DB0BE" font-size="17" text-anchor="middle">기자</text><text x="1147" y="86" fill="#9DB0BE" font-size="17" text-anchor="middle">기사</text><text x="999" y="177" fill="#FFFFFF" font-size="16" text-anchor="middle" font-weight="600">한서윤</text><text x="1077" y="282" fill="#FFFFFF" font-size="18" text-anchor="middle" font-weight="600">양쪽 전부</text><text x="1077" y="308" fill="#F2C879" font-size="16" text-anchor="middle">MySQL 에는 없다 → 5일차에 만든다</text>
  </g>
</svg>
<blockquote>
<p>오늘 쓴 것은 <strong>왼쪽 둘</strong>입니다. <code>RIGHT JOIN</code> 은 표 순서만 바꾼 <code>LEFT JOIN</code> 이라 실무에서는 <strong><code>LEFT</code> 로 통일</strong>합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="quiz" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" class="quiz" data-marpit-pagination="28" style="--paginate:true;--class:quiz;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A1">실습 ②</h1>
<p><code>labs/01-db/day04/practice-2.sql</code></p>
<ol>
<li>모든 기자의 이름 · 부서 · 기사 수 (<strong>0건인 사람 포함</strong>)</li>
<li>기사가 <strong>한 건도 없는</strong> 기자만</li>
<li><code>LEFT JOIN</code> 전체 줄 수를 세어 보기 → 왜 500이 아닌가?</li>
<li><code>COUNT(*)</code>와 <code>COUNT(a.id)</code>를 나란히 놓고 차이 확인</li>
<li>더 해보기(선택) — <code>ON</code> 을 뺀 쿼리, <strong>몇 줄</strong>일지 먼저 적고 실행</li>
</ol>
<p><strong>15분</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="section" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" class="section" data-marpit-pagination="29" style="--paginate:true;--class:section;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="4%EC%B0%A8%EC%8B%9C">4차시</h1>
<h2 id="%EC%8B%A4%EC%A0%84--join--group-by">실전 — JOIN + GROUP BY</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EB%B6%80%EC%84%9C%EB%B3%84-%EC%A7%91%EA%B3%84">부서별 집계</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span>   r.department,
         <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>)             <span class="hljs-keyword">AS</span> 건수,
         ROUND(<span class="hljs-built_in">AVG</span>(a.views))  <span class="hljs-keyword">AS</span> 평균조회수
<span class="hljs-keyword">FROM</span>     articles a
<span class="hljs-keyword">JOIN</span>     reporters r <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> r.department
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> 평균조회수 <span class="hljs-keyword">DESC</span>;
</code></pre>
<p><strong>어제 배운 <code>GROUP BY</code>를 그대로 씁니다.</strong> 묶는 기준만 다른 표에서 왔습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-class="compact" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" class="compact" data-marpit-pagination="31" style="--paginate:true;--class:compact;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EA%B2%B0%EA%B3%BC">결과</h1>
<table>
<thead>
<tr>
<th>department</th>
<th style="text-align:right">건수</th>
<th style="text-align:right">평균조회수</th>
</tr>
</thead>
<tbody>
<tr>
<td>문화부</td>
<td style="text-align:right">47</td>
<td style="text-align:right">15,129</td>
</tr>
<tr>
<td>스포츠부</td>
<td style="text-align:right">77</td>
<td style="text-align:right">11,650</td>
</tr>
<tr>
<td>사회부</td>
<td style="text-align:right">118</td>
<td style="text-align:right">7,504</td>
</tr>
<tr>
<td>정치부</td>
<td style="text-align:right">111</td>
<td style="text-align:right">6,833</td>
</tr>
<tr>
<td>경제부</td>
<td style="text-align:right">85</td>
<td style="text-align:right">6,775</td>
</tr>
<tr>
<td>IT부</td>
<td style="text-align:right">62</td>
<td style="text-align:right">5,404</td>
</tr>
</tbody>
</table>
<p><strong>문화부가 1위입니다.</strong> 어딘가 이상하지 않나요?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="quiz" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" class="quiz" data-marpit-pagination="32" style="--paginate:true;--class:quiz;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%F0%9F%94%B4-2%EC%9D%BC%EC%B0%A8%EC%97%90%EB%8A%94-%EB%AC%B8%ED%99%94%EA%B0%80-%EA%BC%B4%EC%B0%8C%EC%98%80%EC%8A%B5%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 2일차에는 문화가 꼴찌였습니다</h1>
<table>
<thead>
<tr>
<th>기준</th>
<th style="text-align:right">건수</th>
<th style="text-align:right">평균조회수</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>섹션</strong>이 문화인 기사</td>
<td style="text-align:right">44</td>
<td style="text-align:right"><strong>2,451</strong></td>
</tr>
<tr>
<td><strong>문화부 기자</strong>가 쓴 기사</td>
<td style="text-align:right">47</td>
<td style="text-align:right"><strong>15,129</strong></td>
</tr>
</tbody>
</table>
<p><strong>6배 차이.</strong> 같은 데이터인데 왜 이럴까요?</p>
<blockquote>
<p>어제 실습③[4] — <em>&quot;<code>articles</code> 만으로 소속을 확신할 수 있는가?&quot;</em> 의 답이 여기 있습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EB%B2%94%EC%9D%B8-%EC%B0%BE%EA%B8%B0">범인 찾기</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span>   r.name, a.section, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> 건수, <span class="hljs-built_in">MAX</span>(a.views) <span class="hljs-keyword">AS</span> 최대
<span class="hljs-keyword">FROM</span>     articles a
<span class="hljs-keyword">JOIN</span>     reporters r <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id
<span class="hljs-keyword">WHERE</span>    r.department <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;문화부&#x27;</span>
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> r.name, a.section
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> 최대 <span class="hljs-keyword">DESC</span>
LIMIT    <span class="hljs-number">3</span>;
</code></pre>
<blockquote>
<p>문화부 기자들이 <strong>실제로 어느 섹션에</strong> 썼는지 봅니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="compact" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" class="compact" data-marpit-pagination="34" style="--paginate:true;--class:compact;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EA%B2%B0%EA%B3%BC--%EC%A0%95%EB%8B%A4%EC%9D%80-%EA%B8%B0%EC%9E%90">결과 — 정다은 기자</h1>
<table>
<thead>
<tr>
<th>name</th>
<th>section</th>
<th style="text-align:right">건수</th>
<th style="text-align:right">최대</th>
</tr>
</thead>
<tbody>
<tr>
<td>정다은</td>
<td>경제</td>
<td style="text-align:right">1</td>
<td style="text-align:right"><strong>517,185</strong></td>
</tr>
<tr>
<td>정다은</td>
<td>정치</td>
<td style="text-align:right">5</td>
<td style="text-align:right">23,489</td>
</tr>
<tr>
<td>강도현</td>
<td>문화</td>
<td style="text-align:right">16</td>
<td style="text-align:right">12,217</td>
</tr>
</tbody>
</table>
<p><strong>517,185.</strong> 2일차 <code>MAX(views)</code>, 3일차 <strong>총조회수 1위 정다은</strong>의 그 기사입니다.</p>
<blockquote>
<p>문화부 소속이지만 <strong>경제 기사</strong>를 하나 썼고, 그게 대박이 났습니다.<br />
<strong>「문화 기사」와 「문화부 기자가 쓴 기사」는 다릅니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EB%8B%B4%EB%8B%B9-%EB%B0%96-%EA%B8%B0%EC%82%AC%EA%B0%80-%EC%96%BC%EB%A7%88%EB%82%98-%EB%90%A0%EA%B9%8C">담당 밖 기사가 얼마나 될까</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span>   <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> 담당밖
<span class="hljs-keyword">FROM</span>     articles a
<span class="hljs-keyword">JOIN</span>     reporters r <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id
<span class="hljs-keyword">WHERE</span>    a.section <span class="hljs-operator">!=</span> REPLACE(r.department, <span class="hljs-string">&#x27;부&#x27;</span>, <span class="hljs-string">&#x27;&#x27;</span>);
</code></pre>
<p><strong>87건</strong> — 500건 중 17%가 자기 부서 밖 섹션입니다.</p>
<blockquote>
<p><code>REPLACE</code>로 <code>'정치부'</code> → <code>'정치'</code> 를 만들어 비교했습니다.<br />
<strong>JOIN을 해야 비로소 물어볼 수 있는 질문</strong>입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-class="quiz" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" class="quiz" data-marpit-pagination="36" style="--paginate:true;--class:quiz;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A2--%EC%A2%85%ED%95%A9">실습 ③ — 종합</h1>
<p><code>labs/01-db/day04/practice-3.sql</code></p>
<ol>
<li>부서별 건수 · 평균 조회수 · 평균 댓글 수를 함께</li>
<li>2024년 이후 입사자의 이름 · 입사일 · 기사 수 (<strong>0건 포함</strong>)</li>
<li>부서별로 <strong>담당 밖 기사</strong>가 몇 건인지</li>
<li>기자별 기사 수 상위 5명을 <strong>부서와 함께</strong></li>
</ol>
<p><strong>25분</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EC%98%A4%EB%8A%98-%EB%B0%B0%EC%9A%B4-%EA%B2%83">오늘 배운 것</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span>    a.열, r.열
<span class="hljs-keyword">FROM</span>      articles a
<span class="hljs-keyword">JOIN</span>      reporters r <span class="hljs-keyword">ON</span> a.reporter_id <span class="hljs-operator">=</span> r.id   <span class="hljs-comment">-- 짝이 있는 것만</span>
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> reporters r <span class="hljs-keyword">ON</span> ...                    <span class="hljs-comment">-- 왼쪽은 전부</span>
<span class="hljs-keyword">WHERE</span>     r.department <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;...&#x27;</span>                  <span class="hljs-comment">-- 붙인 뒤에 거른다</span>
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span>  r.department;                         <span class="hljs-comment">-- 다른 표 열로도 묶는다</span>
</code></pre>
<p><strong><code>GROUP BY</code>가 세로로 접었다면, <code>JOIN</code>은 가로로 넓힙니다.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EA%BC%AD-%EA%B8%B0%EC%96%B5%ED%95%A0-%EC%84%B8-%EA%B0%80%EC%A7%80">꼭 기억할 세 가지</h1>
<ol>
<li><strong><code>ON</code>은 무엇을 기준으로 붙일지</strong> — 보통 외래키 = 기본키</li>
<li><strong><code>JOIN</code>은 짝 있는 것만, <code>LEFT JOIN</code>은 왼쪽 전부</strong></li>
<li><strong><code>LEFT JOIN</code>에서는 <code>COUNT(*)</code> 대신 <code>COUNT(열)</code></strong></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EB%8B%A4%EC%9D%8C-%EC%8B%9C%EA%B0%84-1023-%EA%B8%88--4%EC%B0%A8%EC%8B%9C">다음 시간 (10/23 금 · 4차시)</h1>
<ul>
<li><strong>서브쿼리</strong> — 쿼리 안의 쿼리</li>
<li>오늘 <code>UPDATE</code> 안에 슬쩍 썼던 그 문법입니다</li>
<li><code>JOIN</code>으로 풀 수 있는 것과 서브쿼리로 풀어야 하는 것</li>
</ul>
<blockquote>
<p>3일차 도전 과제로 남겨둔 <strong>&quot;기자별 주력 섹션&quot;</strong> 은 9일차 윈도우 함수에서 풀립니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:343d2i5tt7etxcu0mj7oehngl7fru43hrkh5h1bo9q8;" data-marpit-pagination-total="40">
<h1 id="%EA%B3%BC%EC%A0%9C">과제</h1>
<ol>
<li>실습 ①②③ 완성해 제출</li>
<li><strong>부서별 「담당 밖 기사 비율(%)」</strong> 을 구해보기<br />
→ 어느 부서가 가장 자주 남의 영역에 쓸까요?</li>
<li>여유가 되면 — 기자별 평균 조회수 상위 5명을 <strong>부서와 함께</strong> 뽑고,<br />
3일차에 본 &quot;총조회수 순위&quot;와 비교해보기</li>
</ol>
</section>
