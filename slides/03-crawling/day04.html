</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-class="section" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="section" data-marpit-pagination="3" style="--paginate:true;--class:section;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="1%EC%B0%A8%EC%8B%9C">1차시</h1>
<h2 id="%EC%99%9C-%EC%96%B4%EB%96%A4-%ED%8E%98%EC%9D%B4%EC%A7%80%EB%8A%94-%EC%95%88-%EB%BD%91%ED%9E%88%EB%82%98">왜 어떤 페이지는 안 뽑히나</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EC%9D%B4-%ED%8E%98%EC%9D%B4%EC%A7%80%EB%A5%BC-%EC%97%B4%EC%96%B4-%EB%B3%B4%EC%8B%AD%EC%8B%9C%EC%98%A4">이 페이지를 열어 보십시오</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>http://localhost:8000/live/popular.html
</code></pre>
<p><strong>기사 10건이 보입니다.</strong> 어제까지 하던 그대로 받아 봅니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">url = <span class="hljs-string">&#x27;http://localhost:8000/live/popular.html&#x27;</span>        <span class="hljs-comment"># 위의 그 주소</span>
soup = BeautifulSoup(requests.get(url).content, <span class="hljs-string">&#x27;html.parser&#x27;</span>)
<span class="hljs-built_in">print</span>(<span class="hljs-built_in">len</span>(soup.select(<span class="hljs-string">&#x27;.card&#x27;</span>)))
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-class="quiz" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="quiz" data-marpit-pagination="5" style="--paginate:true;--class:quiz;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="0-%EC%9D%B4-%EB%82%98%EC%99%94%EC%8A%B5%EB%8B%88%EB%8B%A4">0 이 나왔습니다</h1>
<p><strong>화면에는 분명히 10건이 있는데</strong> <code>.card</code> 가 하나도 안 잡힙니다.</p>
<p>무엇이 다릅니까?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EB%B8%8C%EB%9D%BC%EC%9A%B0%EC%A0%80%EB%8A%94-%ED%95%9C-%EB%8B%A8%EA%B3%84%EB%A5%BC-%EB%8D%94-%ED%95%A9%EB%8B%88%EB%8B%A4">브라우저는 한 단계를 더 합니다</h1>
<svg style="display:block;margin:0 auto 18px" id="dg1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="1040" height="420" aria-label="브라우저는 HTML 을 받은 뒤 자바스크립트를 실행해 popular.json 을 받아 기사 열 건을 그리지만 requests 는 HTML 만 받고 끝나므로 0건이며 우리가 popular.json 을 직접 받으면 같은 열 건을 얻는다">
  <defs>
    <marker id="dg1-c41-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5CC6DE" />

  </defs>
  <style>

  </style>
  <text x="20" y="30" class="stg">브라우저는</text>
  <rect x="20" y="44" width="200" height="66" rx="9" fill="#344A59" stroke="#6D869A" stroke-width="2" />
  <text x="120" y="72" class="ttl" text-anchor="middle">popular.html</text>

  <text x="350" y="95" class="lbl" text-anchor="middle">fetch(&quot;popular.json&quot;)</text>
  <path d="M 456 77 L 474 77" stroke="#5CC6DE" stroke-width="2.5" fill="none" marker-end="url(#dg1-c41-a)" />
  <rect x="480" y="44" width="200" height="66" rx="9" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" />

  <text x="580" y="95" class="lbl" text-anchor="middle">기사 10건이 들어 있다</text>
  <path d="M 686 77 L 704 77" stroke="#5CC6DE" stroke-width="2.5" fill="none" marker-end="url(#dg1-c41-a)" />
  <rect x="710" y="44" width="200" height="66" rx="9" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" />
  <text x="810" y="84" class="ttl" text-anchor="middle">화면에 10건</text>
  <text x="20" y="164" class="stg">requests 는</text>

  <text x="350" y="229" class="lbl" text-anchor="middle">JS 를 돌리지 않는다</text>

  <path d="M 660 116 L 660 142 L 800 142 L 800 292 L 480 292 L 480 314" stroke="#F2C879" stroke-width="2.5" fill="none" marker-end="url(#dg1-c41-c)" />

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%F0%9F%94%B4-%EA%B7%B8%EB%9F%BC-%EB%B8%8C%EB%9D%BC%EC%9A%B0%EC%A0%80-%EC%9E%90%EB%8F%99%ED%99%94%EB%A5%BC-%EA%B9%94%EC%95%84%EC%95%BC-%ED%95%A0%EA%B9%8C%EC%9A%94"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 그럼 브라우저 자동화를 깔아야 할까요</h1>
<p><strong>아닙니다. 먼저 F12 → Network 탭을 여십시오.</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>popular.html     ← 빈 그릇
popular.json     ← <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 여기에 10건이 다 있다
</code></pre>
<blockquote>
<p>브라우저가 어디선가 받아왔다면 <strong>우리도 그 주소를 받으면 됩니다.</strong><br />
화면을 흉내 낼 필요가 없습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EC%9B%90%EB%B3%B8%EC%9D%84-%EC%A7%81%EC%A0%91-%EB%B0%9B%EC%8A%B5%EB%8B%88%EB%8B%A4">원본을 직접 받습니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">data = requests.get(BASE + <span class="hljs-string">&#x27;live/popular.json&#x27;</span>).json()
<span class="hljs-built_in">print</span>(<span class="hljs-built_in">len</span>(data), data[<span class="hljs-number">0</span>][<span class="hljs-string">&#x27;title&#x27;</span>])
<span class="hljs-comment"># 10 반도체 정책 발표에 업계 촉각</span>
</code></pre>
<ul>
<li><code>.json()</code> 이 곧바로 파이썬 자료가 됩니다. <code>BeautifulSoup</code> 도 필요 없습니다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>HTML 을 긁는 것보다 이쪽이 낫습니다.</strong><br />
화면이 바뀌어도 안 깨지고, 훨씬 빠릅니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="compact" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="compact" data-marpit-pagination="9" style="--paginate:true;--class:compact;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EB%B8%8C%EB%9D%BC%EC%9A%B0%EC%A0%80%EB%A5%BC-%EB%9D%84%EC%9A%B0%EB%8A%94-%EB%8F%84%EA%B5%AC--playwright">브라우저를 띄우는 도구 — Playwright</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> playwright.sync_api <span class="hljs-keyword">import</span> sync_playwright
<span class="hljs-keyword">with</span> sync_playwright() <span class="hljs-keyword">as</span> p:
    page = p.chromium.launch(channel=<span class="hljs-string">&#x27;chrome&#x27;</span>).new_page()   <span class="hljs-comment"># 깔린 크롬</span>
    page.goto(BASE + <span class="hljs-string">&#x27;live/popular.html&#x27;</span>)
    page.wait_for_selector(<span class="hljs-string">&#x27;.card&#x27;</span>)       <span class="hljs-comment"># <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 그려질 때까지 기다린다</span>
    <span class="hljs-built_in">print</span>(page.locator(<span class="hljs-string">&#x27;.card&#x27;</span>).count())  <span class="hljs-comment"># 10</span>
</code></pre>
<blockquote>
<p><strong>0 이던 그 페이지에서 10 이 나옵니다.</strong> 진짜 브라우저가 JS 까지 돌리기 때문입니다.<br />
<img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>3차시에 직접 칩니다</strong> — 그 전에 2차시에 <strong>예절</strong>부터. 순서도 그대로, <strong>Network 탭이 먼저</strong>입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="section" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="section" data-marpit-pagination="10" style="--paginate:true;--class:section;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="2%EC%B0%A8%EC%8B%9C">2차시</h1>
<h2 id="%F0%9F%94%B4-%EC%98%88%EC%A0%88%EA%B3%BC-%EB%B2%95"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 예절과 법</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="1%EC%9D%BC%EC%B0%A8%EC%97%90-%EC%9D%B4%EC%83%81%ED%95%9C-%EA%B2%83%EC%9D%84-%EB%B4%A4%EC%8A%B5%EB%8B%88%EB%8B%A4">1일차에 이상한 것을 봤습니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>robots.txt          User-agent: *
                    Disallow: /admin/
                    Crawl-delay: 1

admin/notice.html 을 요청했더니 →  200 OK
</code></pre>
<blockquote>
<p>1일차 실습 맨 끝 ★★③ 이 이것이었습니다. <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>막아 뒀는데 열립니다.</strong><br />
안 해 본 사람은 <strong>지금 한 줄 쳐 보십시오.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-class="quiz" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="quiz" data-marpit-pagination="12" style="--paginate:true;--class:quiz;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EC%97%B4%EB%A6%AC%EB%8A%94%EB%8D%B0-%EC%99%9C-%EC%A7%80%ED%82%B5%EB%8B%88%EA%B9%8C">열리는데 왜 지킵니까</h1>
<p><code>robots.txt</code> 는 <strong>코드를 막지 못합니다.</strong><br />
무시해도 프로그램은 잘 돌아갑니다.</p>
<p>그런데도 지켜야 하는 이유가 무엇입니까?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EC%A7%80%EC%BC%9C%EC%95%BC-%ED%95%A0-%EA%B2%83">지켜야 할 것</h1>
<svg style="display:block;margin:0 auto 18px" id="dg2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="1040" height="443" aria-label="robots.txt 가 admin 폴더를 막아 두었지만 요청하면 200 이 돌아온다. 자물쇠가 아니라 부탁이므로 간격을 두고 신원을 밝히고 쓸 만큼만 가져가야 하며 지키지 않으면 서버가 아이피로 막는다">
  <defs>
    <marker id="dg2-c42-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EC8B81" />
    </marker>
  </defs>
  <style>
#dg2 .ttl{ font-family:var(--sans); font-size:17px; font-weight:600; fill:#FFFFFF; }
#dg2 .lbl{ font-family:var(--sans); font-size:14px; fill:#9DB0BE; }
#dg2 .bad{ font-family:var(--sans); font-size:17px; font-weight:600; fill:#EC8B81; }
#dg2 .hot{ font-family:var(--sans); font-size:19px; font-weight:600; fill:#F2C879; }
#dg2 .mono{ font-family:var(--mono); font-size:16px; fill:#FFFFFF; }
  </style>
  <rect x="60" y="30" width="330" height="70" rx="9" fill="#344A59" stroke="#6D869A" stroke-width="2" />
  <text x="225" y="58" class="ttl" text-anchor="middle">robots.txt 가 막아 두었다</text>
  <text x="225" y="83" class="mono" text-anchor="middle">Disallow: /admin/</text>
  <path d="M 396 65 L 544 65" stroke="#EC8B81" stroke-width="2.5" fill="none" marker-end="url(#dg2-c42-a)" />
  <text x="470" y="52" class="lbl" text-anchor="middle">그냥 요청하면</text>
  <rect x="550" y="30" width="330" height="70" rx="9" fill="#4A211E" stroke="#EC8B81" stroke-width="2" />
  <text x="715" y="58" class="bad" text-anchor="middle">그대로 열린다</text>
  <text x="715" y="83" class="mono" text-anchor="middle">200 OK</text>
  <text x="470" y="146" class="hot" text-anchor="middle">자물쇠가 아니라 «부탁»입니다. 지키는 것은 만드는 사람의 몫입니다</text>
  <rect x="30" y="180" width="280" height="118" rx="9" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" />
  <text x="170" y="212" class="ttl" text-anchor="middle">간격을 둔다</text>
  <text x="170" y="243" class="lbl" text-anchor="middle">crawl-delay 만큼 쉰다</text>
  <text x="170" y="270" class="lbl" text-anchor="middle">1초면 500건에 8.3분</text>
  <rect x="330" y="180" width="280" height="118" rx="9" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" />
  <text x="470" y="212" class="ttl" text-anchor="middle">신원을 밝힌다</text>
  <text x="470" y="243" class="lbl" text-anchor="middle">User-Agent 에 누가·왜</text>
  <text x="470" y="270" class="lbl" text-anchor="middle">차단 대신 연락이 온다</text>
  <rect x="630" y="180" width="280" height="118" rx="9" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" />
  <text x="770" y="212" class="ttl" text-anchor="middle">쓸 만큼만 가져간다</text>
  <text x="770" y="243" class="lbl" text-anchor="middle">저작권 · 개인정보는</text>
  <text x="770" y="270" class="lbl" text-anchor="middle">저장하기 «전»에 판단</text>
  <text x="470" y="352" class="bad" text-anchor="middle">지키지 않으면 서버는 IP 로 막습니다</text>
  <text x="470" y="382" class="lbl" text-anchor="middle">강의실 IP 는 하나입니다 — 한 사람이 막히면 스무 명이 같이 막힙니다</text>
</svg>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="robotstxt-%EB%A5%BC-%EC%BD%94%EB%93%9C%EB%A1%9C-%EC%9D%BD%EC%8A%B5%EB%8B%88%EB%8B%A4"><code>robots.txt</code> 를 코드로 읽습니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> urllib.robotparser <span class="hljs-keyword">as</span> robotparser
UA = <span class="hljs-string">&#x27;MediaFrontier-Class/1.0&#x27;</span>   <span class="hljs-comment"># 내가 누구인지 — 16번에서 자세히</span>
rp = robotparser.RobotFileParser()
rp.set_url(BASE + <span class="hljs-string">&#x27;robots.txt&#x27;</span>)
rp.read()

rp.crawl_delay(<span class="hljs-string">&#x27;*&#x27;</span>)                    <span class="hljs-comment"># 1</span>
rp.can_fetch(UA, BASE + <span class="hljs-string">&#x27;article/1.html&#x27;</span>)     <span class="hljs-comment"># True</span>
rp.can_fetch(UA, BASE + <span class="hljs-string">&#x27;admin/notice.html&#x27;</span>)  <span class="hljs-comment"># False</span>
</code></pre>
<blockquote>
<p><strong>표준 라이브러리입니다.</strong> 설치할 것이 없습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EA%B0%84%EA%B2%A9--%EC%96%B4%EC%A0%9C-%EA%B3%84%EC%82%B0%EC%9D%98-%EB%91%90-%EB%B0%B0%EC%9E%85%EB%8B%88%EB%8B%A4">간격 — 어제 계산의 두 배입니다</h1>
<table>
<thead>
<tr>
<th>간격</th>
<th style="text-align:right">500건이면</th>
</tr>
</thead>
<tbody>
<tr>
<td>안 쉰다</td>
<td style="text-align:right">몇 초</td>
</tr>
<tr>
<td><code>0.5초</code> (어제 과제 3번)</td>
<td style="text-align:right"><strong>4.2분</strong></td>
</tr>
<tr>
<td><code>1초</code> (이 사이트가 요청한 값)</td>
<td style="text-align:right"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>8.3분</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p>「느려서 못 쓰겠는데요」 — <strong>그게 정상입니다.</strong><br />
내 시간을 아끼려고 <strong>남의 서버</strong>를 때리는 것이 문제의 전부입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="compact" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="compact" data-marpit-pagination="16" style="--paginate:true;--class:compact;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EB%82%B4%EA%B0%80-%EB%88%84%EA%B5%AC%EC%9D%B8%EC%A7%80-%EB%B0%9D%ED%9E%99%EB%8B%88%EB%8B%A4">내가 누구인지 밝힙니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">requests.utils.default_user_agent()   <span class="hljs-comment"># &#x27;python-requests/2.x.x&#x27;</span>

UA = <span class="hljs-string">&#x27;MediaFrontier-Class/1.0 (+연락받을 주소)&#x27;</span>    <span class="hljs-comment"># <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 칠판의 것으로</span>
requests.get(url, headers={<span class="hljs-string">&#x27;User-Agent&#x27;</span>: UA})
</code></pre>
<ul>
<li>아무것도 안 하면 <strong>서버 로그에 <code>python-requests</code> 로 남습니다</strong></li>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 헤더에 한글을 넣으면 터집니다 — <code>latin-1</code> 로만 나갑니다</li>
</ul>
<blockquote>
<p><strong>연락할 데를 남겨 두면</strong> 차단 대신 연락이 옵니다 — <code>(+...)</code> 가 그 자리입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-class="compact" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="compact" data-marpit-pagination="17" style="--paginate:true;--class:compact;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EB%B2%95%EC%9D%80-%EB%94%B0%EB%A1%9C-%EC%9E%88%EC%8A%B5%EB%8B%88%EB%8B%A4">법은 따로 있습니다</h1>
<table>
<thead>
<tr>
<th>무엇</th>
<th>요점</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>저작권</strong></td>
<td>기사 <strong>본문</strong>은 남의 것이다. 제목·링크·날짜는 사정이 다르다</td>
</tr>
<tr>
<td><strong>개인정보</strong></td>
<td>이름·연락처·아이디는 <strong>모으는 순간</strong> 책임이 생긴다</td>
</tr>
<tr>
<td><strong>이용약관</strong></td>
<td>「수집 금지」라고 적혀 있으면 <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>분쟁이 생겼을 때 근거가 된다</strong></td>
</tr>
<tr>
<td><strong>업무방해</strong></td>
<td>서버가 느려지거나 멈추면 <strong>기술이 아니라 사고</strong>다</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>저장하기 «전»에 판단하십시오.</strong><br />
모아 놓고 「나중에 지우죠」 가 가장 위험합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="compact" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="compact" data-marpit-pagination="18" style="--paginate:true;--class:compact;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EC%A7%81%EC%A0%91-%EB%AA%A8%EC%9D%84-%EB%95%8C-%EC%A7%80%ED%82%AC-%EA%B7%9C%EC%B9%99">직접 모을 때 지킬 규칙</h1>
<ol>
<li><strong><code>robots.txt</code> 를 먼저 확인</strong>한다 — 금지면 대상을 바꾼다</li>
<li><strong><code>sleep</code> 을 넣는다</strong> — 최소 1초. 지우지 않는다</li>
<li><strong><code>User-Agent</code> 에 신원</strong>을 적는다</li>
<li><strong>한 번 받은 것은 파일로 저장</strong>하고 다시 받지 않는다</li>
<li><strong>개인정보는 애초에 안 모은다</strong></li>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>수집한 데이터를 밖에 올리지 않는다</strong> — 수업 안에서만</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>4번을 특히 지키십시오.</strong> 코드를 고칠 때마다 다시 긁는 것이<br />
실제로 가장 흔한 민폐입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-class="quiz" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="quiz" data-marpit-pagination="19" style="--paginate:true;--class:quiz;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A3--20%EB%B6%84">실습 ④ — 20분</h1>
<table>
<thead>
<tr>
<th>문항</th>
<th>무엇</th>
</tr>
</thead>
<tbody>
<tr>
<td>[3] · <strong>[4]</strong></td>
<td><code>robotparser</code> · <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>막았는데 열린다</strong></td>
</tr>
<tr>
<td>[5] · [6]</td>
<td>간격 지키기 · <code>User-Agent</code></td>
</tr>
<tr>
<td>[1] · [2] · ★[7]</td>
<td>1차시에 본 것 · 사전 점검기 — <strong>남으면, 아니면 집에서</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>practice.py</code> — 주소는 칠판의 것으로.<br />
<img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>[4] 가 오늘의 결론입니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-class="section" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="section" data-marpit-pagination="20" style="--paginate:true;--class:section;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="3%EC%B0%A8%EC%8B%9C">3차시</h1>
<h2 id="%EC%A7%84%EC%A7%9C-%EB%B8%8C%EB%9D%BC%EC%9A%B0%EC%A0%80%EB%A1%9C--playwright">진짜 브라우저로 — Playwright</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-class="compact" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="compact" data-marpit-pagination="21" style="--paginate:true;--class:compact;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EC%9E%90%EB%8F%99%ED%99%94-%EB%8F%84%EA%B5%AC--selenium-%EA%B3%BC-playwright">자동화 도구 — Selenium 과 Playwright</h1>
<p><strong>둘 다 「진짜 브라우저를 코드로 조종하는」 도구입니다.</strong></p>
<table>
<thead>
<tr>
<th>공통점</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>진짜 브라우저를 띄운다</td>
<td>JS 까지 돌린 <strong>«뒤»의 화면</strong>을 본다 — 0 이던 <code>popular.html</code> 에서 <strong>10</strong></td>
</tr>
<tr>
<td>사람처럼 조작한다</td>
<td>클릭 · 글자 입력 · 스크롤 · 페이지 이동</td>
</tr>
<tr>
<td>원래는 <strong>테스트 도구</strong></td>
<td>웹사이트가 잘 도는지 자동으로 확인하려고 만들었다 — 크롤링은 <strong>빌려 쓰는 것</strong></td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>무겁다</strong></td>
<td>브라우저를 통째로 띄운다 — 느리고, <strong>상대 서버에도</strong> 무겁다</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="compact" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="compact" data-marpit-pagination="22" style="--paginate:true;--class:compact;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="selenium-%EA%B3%BC-playwright--%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%8B%A4%EB%A5%B8%EA%B0%80">Selenium 과 Playwright — 무엇이 다른가</h1>
<table>
<thead>
<tr>
<th></th>
<th>Selenium (셀레니움)</th>
<th>Playwright (플레이라이트)</th>
</tr>
</thead>
<tbody>
<tr>
<td>나온 때</td>
<td>2004년경 · 오픈소스</td>
<td>2020년 · 마이크로소프트</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>기다리기</strong></td>
<td><strong>직접 써야 한다</strong> (<code>WebDriverWait</code>)</td>
<td><strong>기본으로 기다린다</strong></td>
</tr>
<tr>
<td>설치</td>
<td><code>pip install selenium</code></td>
<td><code>pip install playwright</code> + 깔린 크롬</td>
</tr>
<tr>
<td>자료</td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>아주 많다</strong> — 블로그 · 강의 · 채용 공고</td>
<td>빠르게 느는 중</td>
</tr>
</tbody>
</table>
<blockquote>
<p>오늘은 <strong>Playwright</strong> — 기다리기가 기본이라 입문자가 덜 막힙니다.<br />
인터넷에서 Selenium 코드를 만나도 <strong>원리는 같습니다</strong> — 브라우저를 띄워 JS 까지 돌린다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-class="compact" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="compact" data-marpit-pagination="23" style="--paginate:true;--class:compact;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EC%A4%80%EB%B9%84--%EC%84%A4%EC%B9%98%EB%8A%94-%ED%95%9C-%EC%A4%84">준비 — 설치는 한 줄</h1>
<p><strong>시작 메뉴 → Anaconda Prompt</strong> 에서</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>python -m pip install playwright
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">p.chromium.launch(channel=<span class="hljs-string">&#x27;chrome&#x27;</span>)    <span class="hljs-comment"># <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> PC 에 깔린 크롬을 쓴다</span>
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>브라우저는 따로 안 받습니다.</strong> <code>channel='chrome'</code> 을 빼면<br />
「<code>playwright install</code> 하라」는 오류 — 브라우저 수백 MB 를 받으라는 뜻입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-class="compact" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="compact" data-marpit-pagination="24" style="--paginate:true;--class:compact;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EC%96%B4%EC%A0%9C%EA%B9%8C%EC%A7%80%EC%9D%98-%EA%B2%83%EA%B3%BC-%EC%A7%9D%EC%A7%80%EC%96%B4-%EB%B3%B4%EB%A9%B4">어제까지의 것과 짝지어 보면</h1>
<table>

로그인처럼 <strong>눌러야만 열리는 곳</strong>에서 필요합니다 — 무엇으로 넘길지는 다음 장에서 고릅니다.</p>

<h1 id="%EB%8C%80%EC%83%81%EC%9D%84-%EA%B3%A0%EB%A5%B4%EB%8A%94-%EA%B8%B0%EC%A4%80">대상을 고르는 기준</h1>

<thead>
<tr>
<th>확인할 것</th>
<th>어떻게</th>
</tr>
</thead>

<tr>
<td><code>robots.txt</code> 가 허용하는가</td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>금지면 다른 곳으로.</strong> 협상 대상이 아니다</td>
</tr>
<tr>
<td>목록이 HTML 에 있는가</td>
<td>없으면 Network 탭에서 JSON 을 찾는다</td>
</tr>
<tr>
<td>여러 쪽인가</td>
<td>「다음」이 있으면 3일차 방식 그대로</td>
</tr>
<tr>

</tr>
<tr>
<td>개인정보가 섞이는가</td>
<td>섞이면 <strong>그 항목을 빼거나</strong> 대상을 바꾼다</td>
</tr>

</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>팀별로</strong> 그 자리에서 열어 보십시오. <strong>「보탤 것 없음」도 답입니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EC%98%A4%EB%8A%98-%EB%B0%B0%EC%9A%B4-%EA%B2%83">오늘 배운 것</h1>
<table>
<thead>
<tr>
<th>무엇</th>
<th>한 줄</th>
</tr>
</thead>
<tbody>
<tr>
<td>안 뽑히는 페이지</td>
<td><strong>JS 가 나중에 그린다</strong></td>
</tr>
<tr>
<td>Network 탭</td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>Playwright 보다 먼저</strong></td>
</tr>
<tr>
<td>Playwright</td>
<td><strong>진짜 브라우저</strong>로 — 기다리고 · 누르고 · 넘어간다</td>
</tr>
<tr>
<td><code>robotparser</code></td>
<td>표준 라이브러리로 물어본다</td>
</tr>
<tr>
<td><code>crawl-delay</code></td>
<td>남의 서버 시간이다</td>
</tr>
<tr>
<td><code>User-Agent</code></td>
<td>누가·왜 를 적는다</td>
</tr>
<tr>
<td>저작권·개인정보</td>
<td><strong>저장하기 전에</strong> 판단한다</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="4%EC%9D%BC-%EB%8F%99%EC%95%88-%ED%95%9C-%EA%B2%83">4일 동안 한 것</h1>
<table>
<thead>
<tr>
<th>일차</th>
<th>무엇</th>
</tr>
</thead>
<tbody>
<tr>
<td>1일</td>
<td>받아온다 — <code>requests</code> · <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 인코딩</td>
</tr>
<tr>
<td>2일</td>
<td>뽑아낸다 — <code>BeautifulSoup</code> · 선택자</td>
</tr>
<tr>
<td>3일</td>
<td>넘긴다 — 여러 쪽 · 다듬기 · <strong>CSV</strong></td>
</tr>
<tr>
<td>4일</td>
<td><strong>한계와 예절</strong> · Playwright</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>1과목의 숫자와 2과목의 선택자가 그대로 쓰였습니다.</strong><br />
크롤링은 새 기술이 아니라 <strong>앞의 것을 잇는 자리</strong>였습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-class="compact" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" class="compact" data-marpit-pagination="36" style="--paginate:true;--class:compact;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EB%AA%A8%EC%9D%80-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%8A%94-%EC%96%B4%EB%94%94%EB%A1%9C-%EA%B0%80%EB%82%98">모은 데이터는 어디로 가나</h1>
<p><strong>크롤링의 끝은 「파일 하나」입니다.</strong> 그 파일을 여는 순간부터가 쓰는 쪽입니다.</p>
<table>
<thead>
<tr>
<th>넘기는 모양</th>
<th>누가 여나</th>
<th>이 과정에서</th>
</tr>
</thead>
<tbody>
<tr>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>CSV</strong> — <code>to_csv</code></td>
<td>주피터 · 엑셀 — <strong>표로 분석</strong></td>
<td><strong>데이터 분석 · 머신러닝</strong> (오전 과목)</td>
</tr>
<tr>
<td><strong>JSON</strong> — <code>to_json</code></td>
<td>웹 화면이 바로 읽는다</td>
<td>JavaScript · React</td>
</tr>
<tr>
<td><strong>DB</strong> — MySQL</td>
<td>서버가 읽고 쓴다 · 계속 쌓인다</td>
<td>Node · 프로젝트</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 어제 만든 <code>articles_crawled.csv</code> — 주피터에서 <code>pd.read_csv</code> <strong>한 줄</strong>이면 분석이 시작됩니다.<br />
다음 사람은 크롤링 코드를 보지 않습니다. <strong>그래서 넘기기 전에 맞춰본 것입니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EA%BC%AD-%EA%B8%B0%EC%96%B5%ED%95%A0-%EC%84%B8-%EA%B0%80%EC%A7%80">꼭 기억할 세 가지</h1>
<ol>
<li>
<p><strong>안 보이면 Network 탭을 먼저 엽니다.</strong><br />
Playwright 는 그다음입니다.</p>
</li>
<li>
<p><strong><code>robots.txt</code> 는 자물쇠가 아니라 부탁입니다.</strong><br />
열린다는 것이 들어가도 된다는 뜻은 아닙니다.</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>강의실 IP 는 하나입니다.</strong><br />
한 사람이 막히면 스무 명이 같이 막힙니다.</p>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:mges7ns1podcnkbxqlzj5b2ljli2v6p6owx34lndr47;" data-marpit-pagination-total="38">
<h1 id="%EA%B3%BC%EC%A0%9C--%EC%9B%94%EC%9A%94%EC%9D%BC-%EB%AF%B8%EB%8B%88%ED%94%84%EB%A1%9C%EC%A0%9D%ED%8A%B8%EC%97%90%EC%84%9C-%EC%94%81%EB%8B%88%EB%8B%A4">과제 — 월요일 미니프로젝트에서 씁니다</h1>
<ol>
<li>실습 ④ <strong>[4] 까지</strong> · 실습 ⑤ <strong>[6] 까지</strong> 완성해 제출 (★ 는 되는 데까지)</li>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>팀 주제에 보탤 수집 대상 후보를 두 개</strong> 정하고,<br />
각각에 <code>check_target</code> 을 돌린 <strong>결과를 적어 올 것</strong> (없으면 「없음」과 이유)</li>
<li>그 대상에서 <strong>무엇을 모아 제공 CSV 의 어느 열과 이을지</strong> 한 줄</li>
<li>(선택) <strong><code>homework_scroll.py</code></strong> — 무한 스크롤을 <strong>Network 탭</strong>으로 한 번, <strong>Playwright</strong> 로 한 번</li>
</ol>
</section>
