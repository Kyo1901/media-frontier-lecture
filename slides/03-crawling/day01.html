<h1 id="%EC%9A%94%EC%B2%AD--%EB%AC%B4%EC%97%87%EC%9D%84-%EB%B3%B4%EB%82%B4%EB%82%98">요청 — 무엇을 보내나</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>GET /page-2.html HTTP/1.1
Host: localhost:8000
User-Agent: python-requests/2.32.5
</code></pre>
<table>
<thead>
<tr>
<th></th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>방법</strong></td>
<td><code>GET</code> — &quot;주세요&quot;. 우리가 오늘 쓰는 것</td>
</tr>
<tr>
<td><strong>주소</strong></td>
<td>무엇을 달라는지</td>
</tr>
<tr>
<td><strong>헤더</strong></td>
<td>나를 소개하는 말. <code>User-Agent</code> 가 「나는 누구」</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <code>User-Agent</code> 를 기억해 두십시오. 4일차 「예절」에서 다시 나옵니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EC%9D%91%EB%8B%B5--%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%8F%8C%EC%95%84%EC%98%A4%EB%82%98">응답 — 무엇이 돌아오나</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>HTTP/1.1 200 OK
Content-Type: text/html
Content-Length: 8465

&lt;!DOCTYPE html&gt;&lt;html lang=&quot;ko&quot;&gt;...
</code></pre>
<table>
<thead>
<tr>
<th></th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>상태 코드</strong></td>
<td>잘 됐는지 (<code>200</code>)</td>
</tr>
<tr>
<td><strong>헤더</strong></td>
<td>이게 뭔지 (<code>Content-Type</code>)</td>
</tr>
<tr>
<td><strong>본문</strong></td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>내용 — 그냥 글자입니다</strong></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="compact" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" class="compact" data-marpit-pagination="10" style="--paginate:true;--class:compact;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EC%83%81%ED%83%9C-%EC%BD%94%EB%93%9C--%EC%9E%90%EC%A3%BC-%EB%B3%B4%EB%8A%94-%EA%B2%83%EB%A7%8C">상태 코드 — 자주 보는 것만</h1>
<table>
<thead>
<tr>
<th>코드</th>
<th>뜻</th>
<th>크롤링에서</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>200</strong></td>
<td>됐다</td>
<td>이것만 쓸 만하다</td>
</tr>
<tr>
<td>301 · 302</td>
<td>옮겼다</td>
<td><code>requests</code> 가 알아서 따라간다</td>
</tr>
<tr>
<td><strong>403</strong></td>
<td>거부</td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>막혔다.</strong> 4일차 이야기</td>
</tr>
<tr>
<td><strong>404</strong></td>
<td>없다</td>
<td>주소가 틀렸거나 지워졌다</td>
</tr>
<tr>
<td><strong>429</strong></td>
<td>너무 많다</td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>내가 너무 빨리 긁었다</strong></td>
</tr>
<tr>
<td>500</td>
<td>서버 잘못</td>
<td>내 문제가 아니다</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong><code>429</code> 를 보면 부끄러운 줄 알아야 합니다.</strong> 남의 서버를 괴롭힌 것입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="quiz" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" class="quiz" data-marpit-pagination="11" style="--paginate:true;--class:quiz;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EC%9E%A0%EA%B9%90--%EC%9D%B4%EA%B1%B4-%EC%84%B1%EA%B3%B5%EC%9E%85%EB%8B%88%EA%B9%8C-%EC%8B%A4%ED%8C%A8%EC%9E%85%EB%8B%88%EA%B9%8C">잠깐 — 이건 성공입니까 실패입니까</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">r = requests.get(<span class="hljs-string">&quot;http://localhost:8000/page-999.html&quot;</span>)
<span class="hljs-built_in">print</span>(r.status_code)     <span class="hljs-comment"># 404</span>
</code></pre>
<p><strong>오류가 났습니까?</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EB%B0%9B%EC%95%84%EC%99%94%EB%8B%A4%EC%99%80-%EC%9E%88%EC%97%88%EB%8B%A4%EB%8A%94-%EB%8B%A4%EB%A6%85%EB%8B%88%EB%8B%A4">「받아왔다」와 「있었다」는 다릅니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">r = requests.get(주소)
<span class="hljs-keyword">if</span> r.status_code == <span class="hljs-number">200</span>:
    ...            <span class="hljs-comment"># 이때만 내용을 믿는다</span>
</code></pre>
<ul>
<li><code>requests</code> 는 <strong>404 에서 예외를 내지 않습니다</strong></li>
<li>확인하려면 <code>r.status_code</code> 를 <strong>내가 봐야</strong> 합니다</li>
<li><code>r.ok</code> 는 200~399 를 True 로 봅니다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 3일차에 여러 쪽을 돌 때 이걸 빠뜨리면<br />
<strong>빈 결과가 조용히 쌓입니다.</strong> 나중에 원인을 못 찾습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="section" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" class="section" data-marpit-pagination="13" style="--paginate:true;--class:section;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="2%EC%B0%A8%EC%8B%9C">2차시</h1>
<h2 id="%EB%B0%9B%EC%95%84%EC%98%A4%EA%B8%B0">받아오기</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EC%84%B8-%EC%A4%84%EC%9D%B4%EB%A9%B4-%EB%90%A9%EB%8B%88%EB%8B%A4">세 줄이면 됩니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> requests

r = requests.get(<span class="hljs-string">&quot;http://localhost:8000/&quot;</span>)
<span class="hljs-built_in">print</span>(r.status_code)
</code></pre>
<ul>
<li><code>requests</code> 는 파이썬 기본이 아닙니다 — 설치가 되어 있어야 합니다</li>
<li>안 되면 <code>pip install requests</code></li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>주소는 강사가 칠판에 적어 드립니다.</strong><br />
오늘은 강사 PC 에 띄운 <strong>연습 사이트</strong>를 씁니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="compact" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" class="compact" data-marpit-pagination="15" style="--paginate:true;--class:compact;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%F0%9F%94%B4-%EC%8B%9C%EC%9E%91%ED%95%98%EA%B8%B0-%EC%A0%84%EC%97%90--%ED%95%9C%EA%B8%80%EC%9D%B4-%EC%A3%BD%EC%8A%B5%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 시작하기 전에 — 한글이 죽습니다</h1>
<p>윈도우에서 한글을 <code>print</code> 하면 이렇게 죽는 사람이 나옵니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>UnicodeEncodeError: 'cp949' codec can't encode character ...
</code></pre>
<table>
<thead>
<tr>
<th>어디서</th>
<th>어떻게</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>VS Code 터미널</strong></td>
<td>대개 그냥 됩니다</td>
</tr>
<tr>
<td><strong>명령 프롬프트</strong></td>
<td>먼저 <code>chcp 65001</code></td>
</tr>
<tr>
<td>그래도 안 되면</td>
<td><code>set PYTHONIOENCODING=utf-8</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>크롤링 문제가 아니라 「화면에 찍는」 문제입니다.</strong> 받아온 값은 멀쩡합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EC%9D%91%EB%8B%B5%EC%9D%84-%EB%9C%AF%EC%96%B4%EB%B4%85%EB%8B%88%EB%8B%A4">응답을 뜯어봅니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">r = requests.get(BASE)

r.status_code           <span class="hljs-comment"># 200</span>
r.headers[<span class="hljs-string">&quot;Content-Type&quot;</span>]   <span class="hljs-comment"># &#x27;text/html&#x27;</span>
<span class="hljs-built_in">len</span>(r.content)          <span class="hljs-comment"># 8천 바이트쯤</span>
r.text                  <span class="hljs-comment"># 본문을 글자로</span>
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <code>Content-Type</code> 을 잘 보십시오. <strong><code>text/html</code> 뿐입니다.</strong><br />
여기 뭐가 없는지가 다음 장의 사고 원인입니다.</p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-class="quiz" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" class="quiz" data-marpit-pagination="17" style="--paginate:true;--class:quiz;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%ED%95%A8%EA%BB%98-%EC%B3%90-%EB%B3%B4%EA%B8%B0--1-5%EB%B6%84">함께 쳐 보기 — [1] (5분)</h1>
<p><code>practice.py</code> 를 열고 <strong>[1]</strong> 만 채워 ▶ 로 돌려 보십시오.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="quiz" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" class="quiz" data-marpit-pagination="18" style="--paginate:true;--class:quiz;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EA%B7%B8%EB%9F%B0%EB%8D%B0-%EC%9D%B4%EB%A0%87%EA%B2%8C-%EB%82%98%EC%98%B5%EB%8B%88%EB%8B%A4">그런데 이렇게 나옵니다</h1>

</code></pre>
<p><strong>분명 「여야 예산안 놓고 공방」인데요.</strong></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EB%B0%94%EC%9D%B4%ED%8A%B8%EB%8A%94-%EB%A9%80%EC%A9%A1%ED%95%A9%EB%8B%88%EB%8B%A4">바이트는 멀쩡합니다</h1>
<svg style="display:block;margin:0 auto 18px" id="dg2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 424" width="940" height="424" aria-label="서버가 보낸 것은 바이트 여섯 개뿐이고 이것을 UTF-8 표로 읽으면 여야가 되지만 ISO-8859-1 표로 읽으면 깨진 글자가 된다">
  <defs>
    <marker id="dg2-c12-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5CC6DE" />
    </marker>
    <marker id="dg2-c12-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EC8B81" />
    </marker>
  </defs>
  <style>

#dg2 .bad{ font-family:var(--sans); font-size:17px; font-weight:600; fill:#EC8B81; }

  </style>
  <text x="470" y="30" class="stg" text-anchor="middle">서버가 보낸 것 — 바이트 여섯 개뿐입니다</text>
  <rect x="280" y="46" width="380" height="56" rx="8" fill="#344A59" stroke="#6D869A" stroke-width="2" />
  <text x="470" y="82" class="byte" text-anchor="middle">EC 97 AC EC 95 BC</text>

  <text x="740" y="308" class="big" text-anchor="middle">ì¬ì¼</text>
  <text x="740" y="338" class="lbl" text-anchor="middle">한 바이트가 한 글자 — 여섯 글자</text>
  <text x="470" y="388" class="hot" text-anchor="middle">깨진 것이 아니라 「다른 표로 읽은」 것입니다</text>
  <text x="470" y="414" class="lbl" text-anchor="middle">🔴 바이트는 글자가 아닙니다. 어느 표로 읽을지를 정해야 글자가 됩니다</text>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EC%99%9C-requests-%EA%B0%80-%ED%8B%80%EB%A6%B0-%ED%91%9C%EB%A5%BC-%EA%B3%A8%EB%9E%90%EB%82%98">왜 requests 가 틀린 표를 골랐나</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">r.headers[<span class="hljs-string">&quot;Content-Type&quot;</span>]   <span class="hljs-comment"># &#x27;text/html&#x27;   ← charset 이 없다</span>
r.encoding                  <span class="hljs-comment"># &#x27;ISO-8859-1&#x27;  ← 그래서 이걸로 정했다</span>
r.apparent_encoding         <span class="hljs-comment"># &#x27;utf-8&#x27;       ← 사실은 알고 있다</span>
</code></pre>
<ul>
<li>서버가 <code>charset</code> 을 안 알려주면 <code>requests</code> 는 <strong>HTTP 규칙대로</strong> <code>ISO-8859-1</code></li>
<li><code>apparent_encoding</code> 은 본문을 보고 <strong>추측</strong>한 값입니다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>맞는 답을 알고 있으면서 안 씁니다.</strong> 규칙이 그렇기 때문입니다.<br />
그래서 <strong>내가</strong> 정해줘야 합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-class="compact" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" class="compact" data-marpit-pagination="21" style="--paginate:true;--class:compact;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EA%B3%A0%EC%B9%98%EB%8A%94-%EB%B2%95-%EB%91%90-%EA%B0%80%EC%A7%80">고치는 법 두 가지</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># (가) 내가 정해준다</span>
r.encoding = <span class="hljs-string">&quot;utf-8&quot;</span>
html = r.text        <span class="hljs-comment"># 이제 안 깨진다</span>

<span class="hljs-comment"># (나) 바이트를 그대로 넘긴다</span>
html = r.content     <span class="hljs-comment"># bytes — 아직 글자가 아니다</span>
</code></pre>
<table>
<thead>
<tr>
<th></th>
<th>언제 쓰나</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>(가)</strong> <code>r.encoding</code></td>
<td>무슨 인코딩인지 <strong>내가 알 때</strong></td>
</tr>
<tr>
<td><strong>(나)</strong> <code>r.content</code></td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>내일부터.</strong> <code>BeautifulSoup</code> 이 알아서 정합니다</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EC%98%A4%EB%8A%98%EC%9D%80-%EA%B0%80-%EB%82%B4%EC%9D%BC%EB%B6%80%ED%84%B0-%EB%82%98">오늘은 (가), 내일부터 (나)</h1>
<ul>
<li>오늘 <strong>(가)</strong> 를 먼저 하는 이유는 <strong>왜 깨졌는지 알기 위해서</strong>입니다</li>
<li>내일 <code>BeautifulSoup</code> 에 넘길 때는 <strong>(나)</strong> 가 편합니다</li>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 둘 다 해보고 <strong>결과가 같은지</strong> 확인하십시오 — 실습 [3]</li>
</ul>
<blockquote>
<p><strong>깨진 글자를 보면 이 순서로 확인하십시오.</strong><br />
① <code>Content-Type</code> 에 <code>charset</code> 이 있나<br />
② <code>r.encoding</code> 이 뭐라고 돼 있나<br />
③ <code>r.apparent_encoding</code> 은 뭐라고 하나</p>
</blockquote>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">start = html.index(<span class="hljs-string">&#x27;&lt;a href=&quot;article/1.html&quot;&gt;&#x27;</span>) + <span class="hljs-number">25</span>
end   = html.index(<span class="hljs-string">&quot;&lt;/a&gt;&quot;</span>, start)
</code></pre>
<p><strong>되긴 됩니다. 그런데 —</strong></p>
<table>
<thead>
<tr>
<th>물어볼 것</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>두 번째 제목은?</td>
<td>주소를 고쳐야 한다. <strong>500번?</strong></td>
</tr>
<tr>
<td>클래스가 붙으면?</td>
<td><strong><code>ValueError</code> 로 죽는다</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>이 답답함이 내일 <code>BeautifulSoup</code> 을 쓰는 이유입니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="compact" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" class="compact" data-marpit-pagination="32" style="--paginate:true;--class:compact;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EA%B7%B8-%EB%8B%B5%EB%8B%B5%ED%95%A8%EC%9D%84--%EB%82%B4%EC%9D%BC%EC%9D%80-%ED%95%9C-%EC%A4%84%EB%A1%9C">그 답답함을 — 내일은 한 줄로</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> bs4 <span class="hljs-keyword">import</span> BeautifulSoup

soup = BeautifulSoup(r.content, <span class="hljs-string">&quot;html.parser&quot;</span>)       <span class="hljs-comment"># (나) — 바이트를 넘긴다</span>
<span class="hljs-built_in">print</span>(soup.select_one(<span class="hljs-string">&quot;.card a&quot;</span>).get_text(strip=<span class="hljs-literal">True</span>))
<span class="hljs-comment"># 여야 예산안 놓고 공방</span>
</code></pre>
<ul>
<li><code>.card a</code> — <strong>아까 개발자도구로 본 그 가지</strong>, 2과목의 그 선택자입니다</li>
<li>주소를 안 고쳐도, 클래스가 붙어도 <strong>안 죽습니다</strong></li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>오늘은 따라 쳐서 돌려 보기만.</strong> <code>select</code> · 속성 · 스무 개 전부는 <strong>내일</strong>입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-class="compact" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" class="compact" data-marpit-pagination="33" style="--paginate:true;--class:compact;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EC%98%A4%EB%8A%98-%EC%9E%90%EC%A3%BC-%EB%82%98%EB%8A%94-%EC%98%A4%EB%A5%98">오늘 자주 나는 오류</h1>
<table>
<thead>
<tr>
<th>증상</th>
<th>원인</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ConnectionError</code></td>
<td>서버가 안 떴거나 주소·포트가 틀렸다</td>
</tr>
<tr>
<td>404 만 나온다</td>
<td>주소 끝의 <code>/</code> 를 빠뜨렸다</td>
</tr>
<tr>
<td><code>UnicodeEncodeError</code></td>
<td><strong>찍는</strong> 문제. <code>chcp 65001</code> (15번)</td>
</tr>
<tr>
<td>글자가 <code>ì¬ì¼</code></td>
<td><strong>읽는</strong> 문제. <code>r.encoding</code> (19번)</td>
</tr>
<tr>
<td><code>ValueError</code> (★[6])</td>
<td><code>index()</code> 가 못 찾았다</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>가운데 둘은 완전히 다른 문제입니다.</strong> 하나는 화면에 <strong>찍을</strong> 때,<br />
다른 하나는 받아서 <strong>읽을</strong> 때입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EC%98%A4%EB%8A%98-%EB%B0%B0%EC%9A%B4-%EA%B2%83">오늘 배운 것</h1>
<table>
<thead>
<tr>
<th>무엇</th>
<th>한 줄</th>
</tr>
</thead>
<tbody>
<tr>
<td>크롤링</td>
<td>브라우저가 하던 일을 코드로</td>
</tr>
<tr>
<td><code>requests.get()</code></td>
<td>요청을 보내고 응답을 받는다</td>
</tr>
<tr>
<td><code>status_code</code></td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>404 에서도 예외가 안 난다</strong></td>
</tr>
<tr>
<td><code>r.encoding</code></td>
<td>바이트를 <strong>어느 표로 읽을지</strong></td>
</tr>
<tr>
<td><code>r.content</code></td>
<td>바이트 그대로 — 내일 이걸 쓴다</td>
</tr>

<h1 id="%EA%BC%AD-%EA%B8%B0%EC%96%B5%ED%95%A0-%EC%84%B8-%EA%B0%80%EC%A7%80">꼭 기억할 세 가지</h1>
<ol>
<li><strong>돌아온 것은 그냥 글자입니다.</strong><br />
화면이 아닙니다. 그리는 건 브라우저가 하던 일입니다.</li>
<li><strong>「받아왔다」와 「있었다」는 다릅니다.</strong><br />
<code>404</code> 도 멀쩡히 받아옵니다. <code>status_code</code> 를 내가 봐야 합니다.</li>
<li><strong>깨진 글자는 안 깨졌습니다.</strong><br />
바이트는 멀쩡하고, 읽는 표가 틀렸을 뿐입니다.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:syloqcrhggkgdcfqoio98h1msq9setrdivlwxfsrih;" data-marpit-pagination-total="38">
<h1 id="%EB%8B%A4%EC%9D%8C-%EC%8B%9C%EA%B0%84-1111-%EC%88%98--4%EC%B0%A8%EC%8B%9C">다음 시간 (11/11 수 · 4차시)</h1>
<ul>
<li><strong><code>BeautifulSoup</code></strong> — 오늘 손으로 한 것을 제대로</li>
<li><code>soup.select(&quot;.card &gt; a&quot;)</code> — <strong>3과목이 아니라 2과목 3일차의 그 선택자</strong>입니다</li>
<li>500건을 <strong>한 번에</strong> 뽑습니다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 오늘 ★[6] 에서 아팠던 것이 내일 <strong>한 줄</strong>로 끝납니다.<br />
그 대비를 느끼려면 <strong>★[6] 을 꼭 해보고 오십시오.</strong></p>
</blockquote>
</section>
