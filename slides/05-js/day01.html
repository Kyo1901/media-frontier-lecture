<p>검색창에 글자를 쳐도 아무 일이 없습니다.<br />
<img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>오늘부터 그 화면을 움직입니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-class="section" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" class="section" data-marpit-pagination="3" style="--paginate:true;--class:section;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="1%EC%B0%A8%EC%8B%9C">1차시</h1>
<h2 id="js-%EB%8A%94-%EC%96%B4%EB%94%94%EC%84%9C-%EB%8F%84%EB%8A%94%EA%B0%80">JS 는 어디서 도는가</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="html--css--js">HTML · CSS · JS</h1>
<svg style="display:block;margin:0 auto 18px" id="dg1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="1040" height="365" aria-label="HTML 은 무엇이 있는지를 정하고 CSS 는 어떻게 보일지를 정하며 JS 는 무슨 일이 일어날지를 정한다. 셋은 같은 화면 위에서 각각 뼈대와 옷과 움직임을 맡는다">
  <defs>
    <marker id="dg1-j11-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6D869A" />
    </marker>
  </defs>
  <style>
#dg1 .ttl{ font-family:var(--sans); font-size:19px; font-weight:600; fill:#FFFFFF; }
#dg1 .sub{ font-family:var(--sans); font-size:16px; font-weight:600; fill:#9DB0BE; }
#dg1 .lbl{ font-family:var(--sans); font-size:14px; fill:#9DB0BE; }
#dg1 .mono{ font-family:var(--mono); font-size:14px; fill:#9DB0BE; }
#dg1 .hot{ font-family:var(--sans); font-size:19px; font-weight:600; fill:#F2C879; }
  </style>
  <rect x="20" y="40" width="280" height="152" rx="9" fill="#344A59" stroke="#6D869A" stroke-width="2" />
  <text x="160" y="74" class="ttl" text-anchor="middle">HTML</text>
  <text x="160" y="104" class="sub" text-anchor="middle">무엇이 있는가</text>
  <text x="160" y="136" class="mono" text-anchor="middle">&lt;li class="card"&gt;</text>
  <text x="160" y="168" class="lbl" text-anchor="middle">뼈대</text>
  <path d="M 306 116 L 324 116" stroke="#6D869A" stroke-width="2.5" fill="none" marker-end="url(#dg1-j11-a)" />
  <rect x="330" y="40" width="280" height="152" rx="9" fill="#344A59" stroke="#6D869A" stroke-width="2" />
  <text x="470" y="74" class="ttl" text-anchor="middle">CSS</text>
  <text x="470" y="104" class="sub" text-anchor="middle">어떻게 보이는가</text>
  <text x="470" y="136" class="mono" text-anchor="middle">.card { gap: 16px }</text>
  <text x="470" y="168" class="lbl" text-anchor="middle">옷</text>
  <path d="M 616 116 L 634 116" stroke="#6D869A" stroke-width="2.5" fill="none" marker-end="url(#dg1-j11-a)" />
  <rect x="640" y="40" width="280" height="152" rx="9" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" />
  <text x="780" y="74" class="ttl" text-anchor="middle">JavaScript</text>
  <text x="780" y="104" class="sub" text-anchor="middle">무슨 일이 일어나는가</text>
  <text x="780" y="136" class="mono" text-anchor="middle">검색하면 걸러진다</text>
  <text x="780" y="168" class="lbl" text-anchor="middle">움직임</text>
  <text x="470" y="252" class="hot" text-anchor="middle">셋은 «같은 화면» 위에 겹쳐 있습니다</text>
  <text x="470" y="286" class="lbl" text-anchor="middle">여러분이 만든 그 카드 화면에, 오늘부터 세 번째 층을 얹습니다</text>
</svg>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="js-%EB%A5%BC-%EC%93%B0%EB%8A%94-%EB%91%90-%EC%9E%90%EB%A6%AC--script">JS 를 쓰는 두 자리 — <code>&lt;script&gt;</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;script.js&quot;</span> <span class="hljs-attr">defer</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>JavaScript 기초<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;바로 써도 됩니다&quot;</span>);
  </span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>파일로</strong>(<code>src</code>) 가 기본 · <strong>바로</strong> 쓰는 것은 짧은 시험·연습용</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="quiz" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" class="quiz" data-marpit-pagination="6" style="--paginate:true;--class:quiz;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EC%9E%A0%EA%B9%90--%EC%99%9C-%EC%88%9C%EC%84%9C%EA%B0%80-%EB%AC%B8%EC%A0%9C%EC%9E%85%EB%8B%88%EA%B9%8C">잠깐 — 왜 순서가 문제입니까</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
    <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;h1&quot;</span>);   <span class="hljs-comment">// ← 이때 h1 은 있습니까?</span>
  </span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>실습 ①<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="defer--%EB%8B%A4-%EC%9D%BD%EC%9D%80-%C2%AB%EB%92%A4%EC%97%90%C2%BB-%EB%8F%8C%EB%A6%B0%EB%8B%A4"><code>defer</code> — 다 읽은 «뒤에» 돌린다</h1>
<table>
<thead>
<tr>
<th>어디</th>
<th>무슨 일이</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>head</code> · <code>defer</code> <strong>없이</strong></td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> HTML 읽기가 <strong>멈춘다.</strong> <code>&lt;h1&gt;</code> 을 아직 못 봤다</td>
</tr>
<tr>
<td><code>head</code> · <code>defer</code> <strong>있게</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 받아만 두고 <strong>다 읽은 뒤</strong> 실행</td>
</tr>
<tr>
<td><code>body</code> 맨 끝</td>
<td>잘 돈다 — 옛날 방식이고 지금도 맞다</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <code>defer</code> 는 <strong><code>src</code> 가 있는</strong> <code>&lt;script&gt;</code> 에만 듣습니다.<br />
바로 쓴 <code>&lt;script&gt;</code> 에 붙이면 <strong>조용히 무시</strong>됩니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EC%A3%BC%EC%84%9D--%EC%BB%B4%ED%93%A8%ED%84%B0%EB%8A%94-%EC%95%88-%EC%9D%BD%EB%8A%94-%EA%B8%80">주석 — 컴퓨터는 안 읽는 글</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// 한 줄 주석 — 줄 끝까지</span>

<span class="hljs-comment">/*
   여러 줄 주석
   여기까지 전부
*/</span>
</code></pre>
<ul>
<li><strong>왜 이렇게 썼는지</strong>를 적습니다. 무엇을 하는지는 코드가 말합니다</li>
<li>VS Code 에서 <strong><code>Ctrl + /</code></strong> — 고른 줄을 한 번에 주석으로</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> HTML 주석과 다릅니다. <strong><code>&lt;script&gt;</code> 안에서는 <code>//</code></strong> 를 씁니다</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EC%BD%98%EC%86%94%EC%9D%B4-%EC%98%A4%EB%8A%98%EC%9D%98-%EC%9E%91%EC%97%85%EB%8C%80%EC%9E%85%EB%8B%88%EB%8B%A4">콘솔이 오늘의 작업대입니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> element = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;h1&quot;</span>);   <span class="hljs-comment">// h1 을 «찾아» 담는다</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(element);                          <span class="hljs-comment">// &lt;h1&gt;JavaScript 기초&lt;/h1&gt;</span>
</code></pre>
<ul>
<li><strong>F12 → Console</strong> — 바로 쳐서 바로 답을 봅니다</li>
<li><code>console.log(a, b, c)</code> — 쉼표로 나열하면 <strong>한 줄에</strong> 나옵니다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 화면에는 안 나옵니다. <strong>콘솔에만</strong> 찍힙니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="js-%EB%A1%9C-%EA%B8%80%EC%9E%90%EC%83%89%EC%9D%84-%EB%B0%94%EA%BF%89%EB%8B%88%EB%8B%A4">JS 로 글자색을 바꿉니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// script.js</span>
<span class="hljs-keyword">let</span> e = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;h1&quot;</span>);   <span class="hljs-comment">// ① 찾는다</span>
e.<span class="hljs-property">style</span>.<span class="hljs-property">color</span> = <span class="hljs-string">&quot;yellowgreen&quot;</span>;          <span class="hljs-comment">// ② 바꾼다</span>
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>찾고 → 바꾼다.</strong> 화면을 움직이는 일은 전부 이 두 걸음입니다</li>
<li>CSS 를 고친 것이 아니라 <strong>JS 가 지금 바꾼 것</strong>입니다 — 새로고침하면 다시 돕니다</li>
</ul>
<blockquote>
<p>본격적인 「찾고 바꾸기」는 <strong>5일차(DOM)</strong> 입니다. 오늘은 맛만 봅니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%F0%9F%94%B4-%EB%AA%BB-%EC%B0%BE%EC%9C%BC%EB%A9%B4-null-%EC%9E%85%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 못 찾으면 <code>null</code> 입니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> 없는것 = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;h2&quot;</span>);   <span class="hljs-comment">// 이 페이지엔 h2 가 없다</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(없는것);                          <span class="hljs-comment">// null</span>
없는것.<span class="hljs-property">style</span>.<span class="hljs-property">color</span> = <span class="hljs-string">&quot;yellowgreen&quot;</span>;           <span class="hljs-comment">// <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 여기서 멈춘다</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Uncaught TypeError: Cannot read properties of null (reading 'style')
</code></pre>
<blockquote>
<p><strong><code>null</code> 을 조작하려 하면 오류</strong>입니다. 오타 · <code>defer</code> 없음 —<br />
원인은 대개 이 둘입니다. <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>6번 장면이 바로 이것</strong>입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-class="section" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" class="section" data-marpit-pagination="12" style="--paginate:true;--class:section;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="2%EC%B0%A8%EC%8B%9C">2차시</h1>
<h2 id="%EA%B0%92%EC%9D%84-%EB%8B%B4%EB%8A%94%EB%8B%A4">값을 담는다</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EB%B3%80%EC%88%98--%EC%9D%B4%EB%A6%84%EC%9D%84-%EB%B6%99%EC%9D%B8-%EC%A0%80%EC%9E%A5-%EA%B3%B5%EA%B0%84">변수 — 이름을 붙인 저장 공간</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> a;          <span class="hljs-comment">// ① 선언 — 이름만 만든다 (값은 undefined)</span>
a = <span class="hljs-number">10</span>;         <span class="hljs-comment">// ② 대입 — = 로 값을 넣는다</span>
<span class="hljs-keyword">const</span> C = <span class="hljs-number">10</span>;   <span class="hljs-comment">// ③ 초기화 — 만들면서 바로 넣는다</span>
</code></pre>
<ul>
<li><code>=</code> 는 「같다」가 아니라 <strong>「오른쪽 값을 왼쪽에 넣어라」</strong></li>
<li><code>const</code> 는 <strong>반드시 초기화</strong> — <code>const D;</code> 는 <code>SyntaxError</code></li>
</ul>
<blockquote>
<p>이름은 한글도 됩니다. <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>숫자로 시작하면 안 됩니다</strong> (<code>1위</code> ✗ · <code>위1</code> ✓)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="var--let--const"><code>var</code> · <code>let</code> · <code>const</code></h1>
<table>
<thead>
<tr>
<th>키워드</th>
<th>같은 이름 다시 선언</th>
<th>값 바꾸기</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>var</code> (옛날)</td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>된다</strong> — 덮어써도 모른다</td>
<td>된다</td>
</tr>
<tr>
<td><code>let</code></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <code>SyntaxError</code></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 된다</td>
</tr>
<tr>
<td><code>const</code></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <code>SyntaxError</code></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <code>TypeError</code></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong><code>const</code> 를 먼저 쓰고, 바뀌어야 할 때만 <code>let</code> 으로</strong></li>
<li><code>var</code> 는 안 씁니다. 옛날 코드에서 보이면 그때 이야기합니다</li>
</ul>
<blockquote>
<p><strong>왜 이렇게 하나</strong> — 안 바뀔 값이 바뀌면 원인을 찾기가 아주 어렵습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="quiz" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" class="quiz" data-marpit-pagination="15" style="--paginate:true;--class:quiz;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EC%98%A4%ED%83%80-%ED%95%98%EB%82%98--%EB%AC%B4%EC%97%87%EC%9D%B4-%EC%B0%8D%ED%9E%99%EB%8B%88%EA%B9%8C">오타 하나 — 무엇이 찍힙니까</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> variable2 = <span class="hljs-number">20</span>;

varibale2 = <span class="hljs-number">30</span>;            <span class="hljs-comment">// ← 바꾸려고 했다</span>

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(variable2);    <span class="hljs-comment">// ?</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%ED%83%80%EC%9E%85--%EA%B0%92%EC%9D%98-%EC%A2%85%EB%A5%98">타입 — 값의 종류</h1>
<table>
<thead>
<tr>
<th>타입</th>
<th>예</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>string</code> 문자열</td>
<td><code>&quot;조채원&quot;</code> · <code>&quot;3,562&quot;</code></td>
</tr>
<tr>
<td><code>number</code> 숫자</td>
<td><code>3562</code> · <code>4.12</code> · <code>NaN</code></td>
</tr>
<tr>
<td><code>boolean</code> 논리</td>
<td><code>true</code> · <code>false</code></td>
</tr>
<tr>
<td><code>undefined</code></td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 값을 <strong>아직 안 넣었다</strong> — <code>let a;</code></td>
</tr>
<tr>
<td><code>null</code></td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 없다고 <strong>«정해 두었다»</strong></td>
</tr>
<tr>
<td><code>function</code> 함수</td>
<td><code>console.log</code> · <code>prompt</code> (2일차)</td>
</tr>
<tr>
<td><code>object</code> 객체</td>
<td>배열 · 객체 (3일차)</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-class="quiz" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" class="quiz" data-marpit-pagination="17" style="--paginate:true;--class:quiz;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="typeof-null-%EC%9D%80-%EB%AC%B4%EC%97%87%EC%9D%BC%EA%B9%8C%EC%9A%94"><code>typeof null</code> 은 무엇일까요</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">typeof</span> <span class="hljs-string">&quot;조채원&quot;</span>     <span class="hljs-comment">// &quot;string&quot;</span>
<span class="hljs-keyword">typeof</span> <span class="hljs-number">3562</span>         <span class="hljs-comment">// &quot;number&quot;</span>
<span class="hljs-keyword">typeof</span> <span class="hljs-literal">undefined</span>    <span class="hljs-comment">// &quot;undefined&quot;</span>
<span class="hljs-keyword">typeof</span> <span class="hljs-literal">null</span>         <span class="hljs-comment">// ?</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EB%8A%94-%EC%9D%B4%EC%96%B4%EB%B6%99%EC%9D%B4%EA%B8%B0%EB%8F%84-%ED%95%A9%EB%8B%88%EB%8B%A4"><code>+</code> 는 이어붙이기도 합니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> 인사 = <span class="hljs-string">&quot;안녕하세요&quot;</span>;
인사 + <span class="hljs-string">&quot; 반갑습니다.&quot;</span>     <span class="hljs-comment">// &quot;안녕하세요 반갑습니다.&quot;</span>

<span class="hljs-string">&quot;3&quot;</span> + <span class="hljs-number">1</span>      <span class="hljs-comment">// &quot;31&quot;   <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 글자가 하나라도 있으면 이어붙인다</span>
<span class="hljs-string">&quot;3&quot;</span> - <span class="hljs-number">1</span>      <span class="hljs-comment">// 2      - * / 는 숫자로 바꿔서 계산한다</span>
</code></pre>
<ul>
<li><code>+</code> 만 <strong>더하기이자 이어붙이기</strong>입니다</li>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>입력창에서 읽은 값은 언제나 문자열입니다</strong> — 4차시에 직접 봅니다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-class="quiz" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" class="quiz" data-marpit-pagination="19" style="--paginate:true;--class:quiz;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EC%85%8B-%EB%8B%A4-%EC%B0%8D%EC%96%B4-%EB%B3%B4%EC%8B%AD%EC%8B%9C%EC%98%A4">셋 다 찍어 보십시오</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;30 + 20 = &quot;</span> + <span class="hljs-number">50</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;30 + 20 = &quot;</span> + <span class="hljs-number">30</span> + <span class="hljs-number">20</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;30 + 20 = &quot;</span> + (<span class="hljs-number">30</span> + <span class="hljs-number">20</span>));
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%ED%85%9C%ED%94%8C%EB%A6%BF-%EB%A6%AC%ED%84%B0%EB%9F%B4--%ED%8C%8C%EC%9D%B4%EC%8D%AC%EC%9D%98-f-string">템플릿 리터럴 — 파이썬의 f-string</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> n1 = <span class="hljs-number">10</span>;
<span class="hljs-keyword">let</span> n2 = <span class="hljs-number">20</span>;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(n1 + <span class="hljs-string">&quot; + &quot;</span> + n2 + <span class="hljs-string">&quot; = &quot;</span> + (n1 + n2));   <span class="hljs-comment">// 이어붙이기</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`<span class="hljs-subst">${n1}</span> + <span class="hljs-subst">${n2}</span> = <span class="hljs-subst">${n1 + n2}</span>`</span>);          <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 템플릿 리터럴</span>
</code></pre>
<ul>
<li><strong>백틱</strong>(<code>`</code> — <code>Esc</code> 아래 키) 안에서 <code>${...}</code> 가 <strong>값으로 바뀝니다</strong></li>
<li>파이썬 <code>f&quot;{n1} + {n2}&quot;</code> 와 같은 일입니다. 결과 모양이 <strong>한눈에</strong> 보입니다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EC%97%AC%EB%9F%AC-%EC%A4%84-%EB%AC%B8%EC%9E%90%EC%97%B4">여러 줄 문자열</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> 두줄 = <span class="hljs-string">&quot;안녕하세요.\n반갑습니다.&quot;</span>;   <span class="hljs-comment">// 따옴표는 한 줄 — \n 이 줄바꿈</span>

<span class="hljs-keyword">let</span> 여러줄 = <span class="hljs-string">`
  안녕하세요.
  반갑습니다.
`</span>;                                       <span class="hljs-comment">// 백틱은 친 그대로 여러 줄</span>
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 백틱 안의 <strong>들여쓰기 공백도 그대로</strong> 들어갑니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="section" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" class="section" data-marpit-pagination="22" style="--paginate:true;--class:section;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="3%EC%B0%A8%EC%8B%9C">3차시</h1>
<h2 id="%EC%97%B0%EC%82%B0%EC%9E%90--%ED%8C%8C%EC%9D%B4%EC%8D%AC%EA%B3%BC-%EB%8B%A4%EB%A5%B8-%EA%B2%83">연산자 — 파이썬과 다른 것</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EB%82%98%EB%88%84%EA%B8%B0--%EB%AA%AB--%EB%82%98%EB%A8%B8%EC%A7%80">나누기 · 몫 · 나머지</h1>
<table>
<thead>
<tr>
<th>하는 일</th>
<th>파이썬</th>
<th>JS</th>
</tr>
</thead>
<tbody>
<tr>
<td>나누기</td>
<td><code>10 / 7</code> → 1.428…</td>
<td><code>10 / 7</code> → 1.428…</td>
</tr>
<tr>
<td>몫</td>
<td><code>10 // 7</code> → 1</td>
<td><code>Math.floor(10 / 7)</code> → 1</td>
</tr>
<tr>
<td>나머지</td>
<td><code>10 % 7</code> → 3</td>
<td><code>10 % 7</code> → 3</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-title class_">Math</span>.<span class="hljs-title function_">floor</span>(<span class="hljs-number">13</span> / <span class="hljs-number">7</span>)   <span class="hljs-comment">// 1   <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 몫 (parseInt(13 / 7) 도 1)</span>
<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">round</span>(<span class="hljs-number">13</span> / <span class="hljs-number">7</span>)   <span class="hljs-comment">// 2   <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 반올림이다 — 몫이 아니다</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EB%B3%B5%ED%95%A9-%EB%8C%80%EC%9E%85--%EA%B3%84%EC%82%B0%ED%95%98%EA%B3%A0-%EB%8B%A4%EC%8B%9C-%EB%8B%B4%EB%8A%94%EB%8B%A4">복합 대입 — 계산하고 다시 담는다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> 조회 = <span class="hljs-number">10</span>;
조회 = 조회 + <span class="hljs-number">5</span>;     <span class="hljs-comment">// 15</span>
조회 += <span class="hljs-number">5</span>;           <span class="hljs-comment">// 20   ← 위와 같은 뜻, 짧게</span>
조회 *= <span class="hljs-number">3</span>;           <span class="hljs-comment">// 60</span>
조회 = <span class="hljs-number">100</span> - 조회;   <span class="hljs-comment">// 40   ← 이건 줄일 수 없다</span>
</code></pre>
<ul>
<li><code>+=</code> <code>-=</code> <code>*=</code> <code>/=</code> <code>%=</code> — <strong>자기 자신이 왼쪽에 올 때만</strong> 줄입니다</li>
<li><code>조회++</code> 는 <code>조회 += 1</code> — <strong>2일차 반복문</strong>에서 매일 씁니다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EB%B9%84%EA%B5%90--%ED%83%80%EC%9E%85%EC%9D%B4-%EB%8B%AC%EB%9D%BC%EB%8F%84-%C2%AB%EB%90%A9%EB%8B%88%EB%8B%A4%C2%BB">비교 — 타입이 달라도 «됩니다»</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-number">40</span> &gt; <span class="hljs-number">30</span>        <span class="hljs-comment">// true</span>
<span class="hljs-number">40</span> &gt; <span class="hljs-string">&quot;30&quot;</span>      <span class="hljs-comment">// true    ← &quot;30&quot; 을 숫자로 바꿔서 비교</span>
<span class="hljs-number">10</span> &gt; <span class="hljs-string">&quot;30&quot;</span>      <span class="hljs-comment">// false</span>
<span class="hljs-literal">true</span> &lt; <span class="hljs-number">2</span>       <span class="hljs-comment">// true    ← true 는 1, false 는 0</span>
</code></pre>
<ul>
<li><code>&lt;</code> <code>&gt;</code> <code>&lt;=</code> <code>&gt;=</code> 는 파이썬과 같습니다</li>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>다른 타입끼리 비교해도 오류가 안 납니다</strong> — JS 가 몰래 바꿉니다</li>
</ul>
<blockquote>
<p>파이썬은 <code>40 &gt; &quot;30&quot;</code> 에서 <strong>터집니다.</strong> JS 는 <strong>답을 줍니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="quiz" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" class="quiz" data-marpit-pagination="26" style="--paginate:true;--class:quiz;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EC%99%80---%EC%9D%B4-%EB%84%B7%EC%9D%98-%EB%8B%B5%EC%9D%80"><code>==</code> 와 <code>===</code> — 이 넷의 답은</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-number">100</span> == <span class="hljs-string">&quot;100&quot;</span>
<span class="hljs-number">100</span> === <span class="hljs-string">&quot;100&quot;</span>
<span class="hljs-literal">true</span> == <span class="hljs-string">&quot;true&quot;</span>
<span class="hljs-literal">true</span> == <span class="hljs-string">&quot;1&quot;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EA%B7%9C%EC%B9%99%EC%9D%80-%ED%95%98%EB%82%98%EC%9E%85%EB%8B%88%EB%8B%A4">규칙은 하나입니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-number">0</span> == <span class="hljs-string">&quot;&quot;</span>        <span class="hljs-comment">// true    <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 빈 칸이 0 과 같아진다</span>
<span class="hljs-number">0</span> === <span class="hljs-string">&quot;&quot;</span>       <span class="hljs-comment">// false   <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></span>
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong><code>===</code> 와 <code>!==</code> 만 씁니다.</strong> <code>==</code> <code>!=</code> 는 남의 코드를 읽을 때만 알면 됩니다</li>
<li><code>NaN</code> 인지 보려면 <code>Number.isNaN(x)</code> — <code>x === NaN</code> 은 <strong>언제나 false</strong></li>
</ul>
<blockquote>
<p>예외는 하나뿐입니다: <code>x == null</code> 은 「<code>null</code> 이거나 <code>undefined</code>」를<br />
한 번에 보는 관용구라 실무에서 씁니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="quiz" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" class="quiz" data-marpit-pagination="28" style="--paginate:true;--class:quiz;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="x-%EA%B0%80-10-%EC%9D%B4%EC%83%81-20-%EC%9D%B4%ED%95%98%EC%9E%85%EB%8B%88%EA%B9%8C">x 가 10 이상 20 이하입니까</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> x = <span class="hljs-number">150</span>;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-number">10</span> &lt;= x &lt;= <span class="hljs-number">20</span>);   <span class="hljs-comment">// ?</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EC%99%BC%EC%AA%BD%EB%B6%80%ED%84%B0-%ED%95%98%EB%82%98%EC%94%A9--%EA%B7%B8%EB%9E%98%EC%84%9C-true">왼쪽부터 하나씩 — 그래서 <code>true</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-number">10</span> &lt;= x &lt;= <span class="hljs-number">20</span>;
<span class="hljs-comment">// → (10 &lt;= 150) &lt;= 20</span>
<span class="hljs-comment">// → true &lt;= 20</span>
<span class="hljs-comment">// → 1 &lt;= 20          true 는 1 이다 (앞 장)</span>
<span class="hljs-comment">// → true</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">(x &gt;= <span class="hljs-number">10</span>) &amp;&amp; (x &lt;= <span class="hljs-number">20</span>)    <span class="hljs-comment">// false  <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 둘로 나눠 &amp;&amp; 로 잇는다</span>
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>범위는 언제나 둘로 나눠</strong> 적습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EB%85%BC%EB%A6%AC-%EC%97%B0%EC%82%B0%EC%9E%90--%EA%B8%B0%ED%98%B8%EB%A7%8C-%EB%8B%A4%EB%A6%85%EB%8B%88%EB%8B%A4">논리 연산자 — 기호만 다릅니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>파이썬        JS          뜻
A and B      A &amp;&amp; B      둘 다 true 면 true
A or B       A || B      하나라도 true 면 true
not A        !A          반대
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> y = -<span class="hljs-number">12</span>;
(y &gt; <span class="hljs-number">0</span>) &amp;&amp; (y % <span class="hljs-number">3</span> === <span class="hljs-number">0</span>)    <span class="hljs-comment">// false — 「0 보다 큰 3 의 배수」인가?</span>
</code></pre>
<ul>
<li><code>y % 3 === 0</code> 은 <strong>나누어떨어진다</strong>는 뜻 — 배수 검사의 관용구입니다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EC%82%BC%ED%95%AD-%EC%97%B0%EC%82%B0%EC%9E%90--%EC%A1%B0%EA%B1%B4%EC%9C%BC%EB%A1%9C-%EA%B0%92%EC%9D%84-%EA%B3%A0%EB%A5%B8%EB%8B%A4">삼항 연산자 — 조건으로 값을 고른다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// 파이썬:  &quot;반갑습니다!&quot; if num &gt; 0 else &quot;Welcome!&quot;</span>
<span class="hljs-keyword">let</span> num = -<span class="hljs-number">10</span>;
<span class="hljs-keyword">let</span> greet = num &gt; <span class="hljs-number">0</span> ? <span class="hljs-string">&quot;반갑습니다!&quot;</span> : <span class="hljs-string">&quot;Welcome!&quot;</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(greet);   <span class="hljs-comment">// Welcome!</span>
</code></pre>
<ul>
<li><strong><code>조건 ? 참일 때 값 : 거짓일 때 값</code></strong> — 파이썬과 <strong>순서가 다릅니다</strong></li>
<li>조건이 <strong>앞</strong>에 옵니다</li>
</ul>
<blockquote>
<p><code>if</code> 문은 <strong>2일차</strong>에 정식으로 배웁니다. 삼항은 「값 하나를 고를 때」만.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%F0%9F%94%B4--%EC%99%80--%EB%8A%94-%C2%AB%EC%B0%B8%C2%BB%EC%9E%85%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <code>{}</code> 와 <code>[]</code> 는 «참»입니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> 빈값;
빈값 ? <span class="hljs-string">&quot;데이터가 있음&quot;</span> : <span class="hljs-string">&quot;데이터가 없음&quot;</span>   <span class="hljs-comment">// &quot;데이터가 없음&quot;</span>

<span class="hljs-title class_">Boolean</span>({})     <span class="hljs-comment">// true   <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 비어 있어도 참</span>
<span class="hljs-title class_">Boolean</span>([])     <span class="hljs-comment">// true   <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/></span>
</code></pre>
<blockquote>
<p><strong>거짓처럼 구는 값은 여섯뿐입니다</strong> —<br />
<code>false</code> · <code>0</code> · <code>&quot;&quot;</code> · <code>null</code> · <code>undefined</code> · <code>NaN</code>. 나머지는 <strong>전부 참</strong>입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-class="section" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" class="section" data-marpit-pagination="33" style="--paginate:true;--class:section;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="4%EC%B0%A8%EC%8B%9C">4차시</h1>
<h2 id="%EC%9E%85%EB%A0%A5%EB%B0%9B%EC%95%84-%ED%99%94%EB%A9%B4%EC%97%90-%EC%93%B4%EB%8B%A4--%EC%8B%A4%EC%8A%B5-%E2%91%A0">입력받아 화면에 쓴다 · 실습 ①</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EC%9E%85%EB%A0%A5%EB%B0%9B%EC%95%84-%ED%99%94%EB%A9%B4%EC%97%90-%EC%94%81%EB%8B%88%EB%8B%A4">입력받아 화면에 씁니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
  <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">writeln</span>(<span class="hljs-string">&quot;안녕하세요.&quot;</span>);
  <span class="hljs-keyword">let</span> i = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;숫자를 입력하세요.&quot;</span>);
  <span class="hljs-keyword">let</span> completeRes = (i &gt;= <span class="hljs-number">0</span> ? <span class="hljs-string">&quot;success&quot;</span> : <span class="hljs-string">&quot;fail&quot;</span>);
  <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">writeln</span>(<span class="hljs-string">`&lt;h1 class=&quot;<span class="hljs-subst">${completeRes}</span>&quot;&gt;<span class="hljs-subst">${i}</span>. JS로 페이지 작성&lt;/h1&gt;`</span>);
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
<ul>
<li><code>prompt</code> 가 친 글자를 돌려주면 — 0 이상은 초록 · 아니면 빨강</li>
</ul>
<blockquote>
<p><code>document.writeln</code> 은 <strong>오늘만</strong> 씁니다 — 5일차(DOM)에서 제대로.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="quiz" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" class="quiz" data-marpit-pagination="35" style="--paginate:true;--class:quiz;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EC%9D%B4%EB%A0%87%EA%B2%8C-%EB%84%A3%EC%9C%BC%EB%A9%B4-%EB%AC%B4%EC%8A%A8-%EC%83%89%EC%9E%85%EB%8B%88%EA%B9%8C">이렇게 넣으면 무슨 색입니까</h1>
<table>
<thead>
<tr>
<th>입력창에</th>
<th>색은?</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>5</code></td>
<td>?</td>
</tr>
<tr>
<td><code>-3</code></td>
<td>?</td>
</tr>
<tr>
<td><code>abc</code></td>
<td>?</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>비워 두고</strong> 확인</td>
<td>?</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>취소</strong></td>
<td>?</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%F0%9F%94%B4-%EC%97%86%EB%8B%A4%EC%99%80-0%EC%9D%80-%EB%8B%A4%EB%A6%85%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 「없다」와 「0」은 다릅니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-title class_">Number</span>(<span class="hljs-string">&quot;&quot;</span>)         <span class="hljs-comment">// 0     <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 빈 칸이 0 으로 둔갑한다</span>
<span class="hljs-title class_">Number</span>(<span class="hljs-literal">null</span>)       <span class="hljs-comment">// 0     <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 취소도</span>
<span class="hljs-title class_">Number</span>(<span class="hljs-string">&quot;-&quot;</span>)        <span class="hljs-comment">// NaN   ← 조회수가 «-» 이던 그 25건</span>
<span class="hljs-title class_">Number</span>(<span class="hljs-string">&quot;3,562&quot;</span>)    <span class="hljs-comment">// NaN   ← 쉼표가 있으면 숫자가 아니다</span>
</code></pre>
<blockquote>
<p><strong><code>Number(&quot;&quot;)</code> 가 <code>0</code> 이라는 것을 꼭 기억하십시오.</strong><br />
입력창을 비워 두면 「0 을 입력했다」가 됩니다 — <strong>JS 6일차</strong>(입력값 읽기)에서 다시 만납니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EA%B8%80%EC%9E%90%EC%99%80-%EC%88%AB%EC%9E%90%EB%A5%BC-%EC%98%A4%EA%B0%91%EB%8B%88%EB%8B%A4">글자와 숫자를 오갑니다</h1>
<svg style="display:block;margin:0 auto 18px" id="dg2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="1000" height="426" aria-label="화면의 글자 3,562 는 쉼표를 떼고 Number 를 거쳐야 계산할 수 있는 숫자가 되고 toLocaleString 으로 다시 화면용 글자가 된다. 반면 하이픈은 NaN 이 되고 빈 문자열은 0 이 되어 비어 있던 것이 영으로 둔갑한다">
  <defs>
    <marker id="dg2-j12-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5CC6DE" />
    </marker>
    <marker id="dg2-j12-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">

<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A0--30%EB%B6%84">실습 ① — 30분</h1>
<table>
<thead>
<tr>
<th>문항</th>
<th>무엇</th>
</tr>
</thead>
<tbody>
<tr>
<td>[1] · [2]</td>
<td>변수와 타입 · <code>+</code> 는 왼쪽부터</td>
</tr>
<tr>
<td>[3] · [4]</td>
<td><code>&quot;3,562&quot;</code> → 숫자 · 몫 · 나머지 · <code>+=</code></td>
</tr>
<tr>
<td>[5] · <strong>[6]</strong></td>
<td><code>==</code> vs <code>===</code> · <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>범위 검사</strong></td>
</tr>
<tr>
<td>[7] · <strong>[8]</strong></td>
<td>삼항 · <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>「없다」는 0 이 아니다</strong></td>
</tr>
<tr>
<td>★[9]</td>
<td>템플릿 리터럴로 카드 한 줄</td>
</tr>
</tbody>
</table>
<blockquote>
<p><code>practice.js</code> — <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>찍기 전에 답을 종이에 적을 것.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EC%98%A4%EB%8A%98-%EC%9E%90%EC%A3%BC-%EB%82%98%EB%8A%94-%EC%98%A4%EB%A5%98">오늘 자주 나는 오류</h1>
<table>
<thead>
<tr>
<th>증상</th>
<th>원인</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ReferenceError: x is not defined</code></td>
<td>안 만든 이름을 썼다 · 오타</td>
</tr>
<tr>
<td><code>TypeError: Assignment to constant variable.</code></td>
<td><code>const</code> 를 바꾸려 했다</td>
</tr>
<tr>
<td><code>SyntaxError: Identifier 'x' has already been declared</code></td>
<td><code>let</code> 을 두 번</td>
</tr>
<tr>
<td><code>TypeError: Cannot read properties of null</code></td>
<td>못 찾았다 · <code>defer</code> 가 없다</td>
</tr>
<tr>
<td>결과가 <code>NaN</code></td>
<td>숫자가 아닌 글자를 계산했다 (<code>&quot;3,562&quot;</code>)</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>아무 일도 안 일어남</strong></td>
<td><code>&lt;script&gt;</code> 경로가 틀렸다 — Console 에 404</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EC%98%A4%EB%8A%98-%EB%B0%B0%EC%9A%B4-%EA%B2%83">오늘 배운 것</h1>
<table>
<thead>
<tr>
<th>무엇</th>
<th>한 줄</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>defer</code></td>
<td>HTML 을 <strong>다 읽은 뒤</strong> 돌린다 (<code>src</code> 가 있을 때만)</td>
</tr>
<tr>
<td><code>const</code> 먼저</td>
<td>바뀌어야 할 때만 <code>let</code> · <code>var</code> 는 안 쓴다</td>
</tr>
<tr>
<td><code>typeof null</code></td>
<td><code>&quot;object&quot;</code> — <strong>언어의 오래된 실수</strong></td>
</tr>
<tr>
<td><code>+</code></td>
<td><strong>이어붙이기를 겸한다</strong> · 왼쪽부터</td>
</tr>
<tr>
<td><code>===</code></td>
<td><strong>언제나 이것</strong></td>
</tr>
<tr>
<td><code>10 &lt;= x &lt;= 20</code></td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>안 된다</strong> — 둘로 나눠 <code>&amp;&amp;</code></td>
</tr>
<tr>
<td><code>Number(&quot;&quot;)</code></td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong><code>0</code> 이다.</strong> 빈 칸이 0 으로 둔갑한다</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EA%BC%AD-%EA%B8%B0%EC%96%B5%ED%95%A0-%EC%84%B8-%EA%B0%80%EC%A7%80">꼭 기억할 세 가지</h1>
<ol>
<li>
<p><strong>화면·입력창의 글자는 전부 문자열입니다.</strong><br />
<code>prompt</code> 가 준 <code>&quot;5&quot;</code> 도 <code>&quot;3,562&quot;</code> 도 계산 전에는 숫자로 바꿔야 합니다.</p>
</li>
<li>
<p><strong><code>Number(&quot;&quot;)</code> 는 <code>0</code> 입니다.</strong><br />
비어 있는 것과 0 은 다른데, JS 는 조용히 같게 만듭니다.</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong><code>===</code> 만 씁니다.</strong><br />
<code>==</code> 는 남의 코드를 읽을 때만 알면 됩니다.</p>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EB%8B%A4%EC%9D%8C-%EC%8B%9C%EA%B0%84-1120-%EA%B8%88--4%EC%B0%A8%EC%8B%9C">다음 시간 (11/20 금 · 4차시)</h1>
<ul>
<li><strong>조건문</strong> — <code>if</code> · <code>else</code> (삼항은 오늘 맛봤습니다)</li>
<li><strong>반복문</strong> — 목록을 하나씩 훑는다</li>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>함수</strong> — 선언 · 매개변수 · 반환 · <strong>화살표 함수</strong></li>
</ul>
<blockquote>
<p>오늘 만든 「카드 한 줄」을 <strong>500번 만드는 법</strong>이 내일입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:ygpeb9xy2qh53qwgw2d6xxmyjyhjdfs6qwu4nmzdsdt;" data-marpit-pagination-total="43">
<h1 id="%EA%B3%BC%EC%A0%9C">과제</h1>
<ol>
<li>실습 ① <strong>★[9] 까지</strong> 완성해 제출</li>
<li><code>Number(&quot;&quot;)</code> 가 <code>0</code> 인 것 때문에 <strong>생길 수 있는 사고</strong>를 한 가지 적어 올 것</li>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 4차시 예제를 고쳐 <strong>비워 두거나 취소하면 빨강</strong>이 되게 할 것 —<br />
오늘 배운 <code>!==</code> 와 <code>&amp;&amp;</code> 만으로 됩니다</li>
</ol>
</section>
