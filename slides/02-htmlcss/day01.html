</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EC%98%A4%EB%8A%98-%ED%95%A0-%EC%9D%BC">오늘 할 일</h1>
<table>
<thead>
<tr>
<th>차시</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>웹이란</strong> — 웹 서비스 한 바퀴 · 개발자도구 열기</td>
</tr>
<tr>
<td>2</td>
<td>HTML 문서의 뼈대 · 태그 문법 · 중첩</td>
</tr>
<tr>
<td>3</td>
<td><strong>시맨틱 태그</strong> — 이름이 있는 상자들</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 오늘 <strong>태그를 외우지 않습니다.</strong> 6일 동안 쓸 태그는 스무 개도 안 됩니다.<br />
오늘은 <strong>&quot;화면이 어디서 오는가&quot;</strong> 하나만 확실히 하고 갑니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-class="section" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" class="section" data-marpit-pagination="4" style="--paginate:true;--class:section;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="1%EC%B0%A8%EC%8B%9C">1차시</h1>
<h2 id="%EC%9B%B9%EC%9D%80-%EC%96%B4%EB%96%BB%EA%B2%8C-%EB%8F%8C%EC%95%84%EA%B0%80%EB%82%98">웹은 어떻게 돌아가나</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EC%9B%B9%EC%9D%B4%EB%9E%80--%EC%9A%94%EC%B2%AD%ED%95%98%EA%B3%A0-%EB%B0%9B%EC%95%84%EC%84%9C-%EA%B7%B8%EB%A6%B0%EB%8B%A4">웹이란 — 요청하고, 받아서, 그린다</h1>
<p>주소창에 <code>news.example.com</code> 을 치고 <code>Enter</code> 를 누르면 일어나는 일:</p>
<ol>
<li>내 컴퓨터의 <strong>브라우저</strong>가 그 주소의 컴퓨터(<strong>서버</strong>)에 <strong>&quot;이 페이지 주세요&quot;</strong> 라고 <strong>요청</strong>합니다</li>
<li>서버가 <strong>글자로 된 문서</strong>를 돌려줍니다 — <strong>응답</strong></li>
<li>브라우저가 그 글자를 읽어 <strong>화면으로 그립니다</strong></li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>웹 = 요청과 응답을 주고받는 약속</strong>입니다. 화면은 마지막 3번에서야 생깁니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EC%9B%B9-%EC%84%9C%EB%B9%84%EC%8A%A4-%ED%95%9C-%EB%B0%94%ED%80%B4--%EC%9A%B0%EB%A6%AC-%EA%B3%BC%EC%A0%95-%EC%A0%84%EC%B2%B4">웹 서비스 한 바퀴 — 우리 과정 전체</h1>
<svg style="display:block;margin:0 auto 18px" id="dg1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 436" width="1100" height="400" role="img" aria-label="웹 서비스 한 바퀴. 사용자의 브라우저가 주소로 서버에 요청하면 서버가 DB 에 SQL 을 보내 결과 줄을 받아 오고, 그것으로 HTML CSS JS 를 만들어 브라우저에 응답한다. 브라우저는 HTML 로 무엇인지, CSS 로 어떻게 보이는지, JS 로 움직임을 정해 화면을 그린다. DB 는 1과목에서 끝냈고 크롤링이 채우며, HTML 과 CSS 가 지금 배우는 2과목, JS 와 React 가 5·6과목, 서버는 7과목 Node, 이 한 바퀴를 혼자 만드는 것이 8과목 프로젝트다">
  <defs>
    <marker id="dg1-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">

    </marker>
  </defs>
  <g font-family="'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
    <rect x="20" y="60" width="320" height="250" rx="12" fill="#344A59" stroke="#6D869A" stroke-width="2" />
    <text x="180" y="92" fill="#FFFFFF" font-size="21" font-weight="600" text-anchor="middle">브라우저 — 사용자 화면</text>
    <rect x="44" y="112" width="272" height="44" rx="8" fill="#4A3A18" stroke="#F2C879" stroke-width="2" />
    <text x="60" y="140" fill="#F2C879" font-size="18" font-weight="600">HTML</text>

    <rect x="44" y="166" width="272" height="44" rx="8" fill="#4A3A18" stroke="#F2C879" stroke-width="2" />
    <text x="60" y="194" fill="#F2C879" font-size="18" font-weight="600">CSS</text>
    <text x="130" y="194" fill="#FFFFFF" font-size="17">어떻게 보이나 — 옷</text>
    <rect x="44" y="220" width="272" height="44" rx="8" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" />
    <text x="60" y="248" fill="#5CC6DE" font-size="18" font-weight="600">JS</text>
    <text x="130" y="248" fill="#FFFFFF" font-size="17">움직임 — 누르면 바뀐다</text>
    <text x="180" y="292" fill="#9DB0BE" font-size="15" text-anchor="middle">세 가지를 받아 화면을 그린다</text>
    <rect x="480" y="105" width="240" height="160" rx="12" fill="#344A59" stroke="#6D869A" stroke-width="2" />
    <text x="600" y="150" fill="#FFFFFF" font-size="21" font-weight="600" text-anchor="middle">서버</text>
    <text x="600" y="182" fill="#9DB0BE" font-size="15" text-anchor="middle">주문을 받아</text>
    <text x="600" y="204" fill="#9DB0BE" font-size="15" text-anchor="middle">DB 에서 꺼내 와</text>
    <text x="600" y="226" fill="#9DB0BE" font-size="15" text-anchor="middle">화면 재료로 만든다</text>
    <rect x="860" y="105" width="320" height="160" rx="12" fill="#344A59" stroke="#6D869A" stroke-width="2" />
    <text x="1020" y="150" fill="#FFFFFF" font-size="21" font-weight="600" text-anchor="middle">DB (MySQL)</text>
    <text x="1020" y="182" fill="#9DB0BE" font-size="16" text-anchor="middle" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">articles · reporters</text>
    <text x="1020" y="212" fill="#9DB0BE" font-size="15" text-anchor="middle">기사 500건이 쌓여 있다</text>
    <path d="M 340 150 L 476 150" stroke="#5CC6DE" stroke-width="3" fill="none" marker-end="url(#dg1-ar)" />
    <text x="410" y="122" fill="#5CC6DE" font-size="15" text-anchor="middle">① 요청</text>
    <text x="410" y="140" fill="#9DB0BE" font-size="14" text-anchor="middle">주소 · "기사 주세요"</text>
    <path d="M 720 150 L 856 150" stroke="#5CC6DE" stroke-width="3" fill="none" marker-end="url(#dg1-ar)" />

    <text x="790" y="140" fill="#9DB0BE" font-size="14" text-anchor="middle" font-family="'D2Coding','Cascadia Code',Consolas,'JetBrains Mono',Menlo,monospace">SELECT …</text>
    <path d="M 860 230 L 724 230" stroke="#6D869A" stroke-width="3" fill="none" marker-end="url(#dg1-arg)" />

    <path d="M 480 230 L 344 230" stroke="#6D869A" stroke-width="3" fill="none" marker-end="url(#dg1-arg)" />
    <text x="410" y="256" fill="#9DB0BE" font-size="15" text-anchor="middle">④ 응답</text>
    <text x="410" y="274" fill="#9DB0BE" font-size="14" text-anchor="middle">HTML · CSS · JS</text>
    <text x="180" y="358" fill="#F2C879" font-size="16" font-weight="600" text-anchor="middle">2 HTML/CSS ← 지금</text>

    <text x="1020" y="358" fill="#5CC6DE" font-size="16" font-weight="600" text-anchor="middle">1 DB ✓ 끝냄</text>
    <text x="1020" y="380" fill="#9DB0BE" font-size="15" text-anchor="middle">3 크롤링이 채운다</text>
    <text x="600" y="418" fill="#FFFFFF" font-size="17" font-weight="600" text-anchor="middle">8 프로젝트 — 이 한 바퀴를 내 서비스로 혼자 만든다</text>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="compact" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" class="compact" data-marpit-pagination="7" style="--paginate:true;--class:compact;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="html--css--js--%EC%84%B8-%EA%B2%B9">HTML · CSS · JS — 세 겹</h1>
<p>브라우저가 받는 글자는 <strong>세 종류</strong>입니다. 하나의 기사 화면으로 보면:</p>
<table>
<thead>
<tr>
<th>겹</th>
<th>맡은 것</th>
<th>기사로 치면</th>
<th>언제 배우나</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>HTML</strong></td>
<td><strong>무엇인가</strong> — 뼈대</td>
<td>&quot;이건 제목, 이건 기자 이름, 이건 본문&quot;</td>
<td><strong>오늘 ~ 내일</strong></td>
</tr>
<tr>
<td><strong>CSS</strong></td>
<td><strong>어떻게 보이나</strong> — 옷</td>
<td>&quot;제목은 크고 굵게, 사진은 가운데&quot;</td>
<td>3일차 ~ 6일차</td>
</tr>
<tr>
<td><strong>JS</strong></td>
<td><strong>움직임</strong> — 반응</td>
<td>&quot;좋아요를 누르면 숫자가 1 오른다&quot;</td>
<td>5과목 (11/19 ~)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 셋은 <strong>맡은 일이 섞이지 않습니다.</strong> HTML 에 색을 쓰거나 CSS 로 내용을 쓰지 않습니다.<br />
그래서 따로 배울 수 있고, 하나만 바꿔도 나머지는 그대로입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EC%A7%80%EA%B8%88-%EB%B3%B4%EA%B3%A0-%EC%9E%88%EB%8A%94-%EC%9D%B4-%ED%99%94%EB%A9%B4">지금 보고 있는 이 화면</h1>
<p>브라우저에 뉴스 사이트를 하나 띄워 보십시오.</p>
<ul>
<li>제목이 크고 굵습니다</li>
<li>사진이 가운데 있습니다</li>
<li>아래에 관련 기사 목록이 있습니다</li>
</ul>
<p><strong>이걸 누가 정했을까요?</strong> 브라우저가 알아서 그렇게 그린 걸까요?</p>
<blockquote>
<p>아닙니다. <strong>서버가 보낸 글자에 전부 적혀 있습니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="f12--%EA%B0%9C%EB%B0%9C%EC%9E%90%EB%8F%84%EA%B5%AC"><code>F12</code> — 개발자도구</h1>
<p><strong>아무 웹사이트에서나 <code>F12</code></strong> 를 누르십시오. (또는 오른쪽 클릭 → <code>검사</code>)</p>
<p>화면이 반으로 갈라지고 <strong>글자 뭉치</strong>가 나옵니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">h1</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;headline&quot;</span>&gt;</span>반도체 정책 발표에 업계 촉각<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;byline&quot;</span>&gt;</span>정다은 기자<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
</code></pre>
<p><strong>이것이 그 화면의 정체입니다.</strong> 우리가 보던 제목은 이 글자에서 나왔습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%F0%9F%94%B4-%EC%A0%9C%EB%AA%A9%EC%9D%84-%EB%B0%94%EA%BF%94-%EB%B4%85%EC%8B%9C%EB%8B%A4"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 제목을 바꿔 봅시다</h1>
<p>개발자도구에서 <strong>제목 글자를 더블클릭</strong>하고 아무 말이나 쳐 보십시오.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>반도체 정책 발표에 업계 촉각
        ↓  (더블클릭해서 고친다)
오늘 점심은 뭘 먹을까
</code></pre>
<p><strong>화면의 제목이 바뀝니다.</strong></p>
<blockquote>
<p>방금 여러분은 뉴스 사이트를 고쳤습니다. <img class="emoji" draggable="false" alt="🎉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f389.svg" data-marp-twemoji=""/><br />
그런데 <strong><code>F5</code> 를 눌러 보십시오.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EC%83%88%EB%A1%9C%EA%B3%A0%EC%B9%A8%ED%95%98%EB%A9%B4-%EB%8F%8C%EC%95%84%EC%98%B5%EB%8B%88%EB%8B%A4">새로고침하면 돌아옵니다</h1>
<p><strong>원래대로 돌아왔습니다.</strong> 왜일까요?</p>
<table>
<thead>
<tr>
<th>어디를 고쳤나</th>
<th>결과</th>
</tr>
</thead>
<tbody>
<tr>
<td>내 브라우저가 <strong>받아서 펼쳐 둔 것</strong></td>
<td>바뀐다</td>
</tr>
<tr>
<td><strong>서버에 있는 원본</strong></td>
<td>그대로다</td>
</tr>
</tbody>
</table>
<blockquote>
<p>새로고침하면 서버에서 <strong>원본을 다시 받아옵니다.</strong> 내 화면에서만 바뀐 것이죠.<br />
<img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 이게 오늘의 절반입니다 — <strong>화면은 받아온 글자를 펼친 것</strong>입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EB%B8%8C%EB%9D%BC%EC%9A%B0%EC%A0%80%EA%B0%80-%ED%95%98%EB%8A%94-%EC%9D%BC">브라우저가 하는 일</h1>
<svg style="display:block;margin:0 auto 18px" id="dg2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="1000" height="362" aria-label="브라우저는 서버에서 HTML 글자를 받아와 해석한 뒤 화면으로 그린다. 우리가 만드는 것은 그 받아오는 글자다">
  <style>
#dg2 .stg{ font-family:var(--sans); font-size:20px; font-weight:600; fill:#9DB0BE; }
#dg2 .stgo{ font-family:var(--sans); font-size:20px; font-weight:600; fill:#F2C879; }
#dg2 .ttl{ font-family:var(--sans); font-size:17px; font-weight:600; fill:#FFFFFF; }
#dg2 .big{ font-family:var(--sans); font-size:22px; font-weight:700; fill:#FFFFFF; }
#dg2 .lbl{ font-family:var(--sans); font-size:15px; fill:#9DB0BE; }
#dg2 .mono{ font-family:var(--mono); font-size:14px; fill:#FFFFFF; }
#dg2 .hot{ font-family:var(--sans); font-size:19px; font-weight:600; fill:#F2C879; }
  </style>
  <text x="34" y="30" class="stgo">① 받아온다  ← 우리가 쓰는 곳</text>
  <rect x="20" y="46" width="270" height="150" rx="9" fill="#4A3A18" stroke="#F2C879" stroke-width="2.5" />
  <text x="40" y="78" class="mono">&lt;h1&gt;반도체 정책 발표에</text>
  <text x="40" y="102" class="mono">    업계 촉각&lt;/h1&gt;</text>
  <text x="40" y="134" class="mono">&lt;p&gt;정다은 기자&lt;/p&gt;</text>
  <text x="40" y="172" class="lbl">서버가 보낸 글자</text>
  <path d="M 290 120 L 344 120" fill="none" stroke="#6D869A" stroke-width="2.5" marker-end="url(#dg2-b1)" />
  <text x="364" y="30" class="stg">② 해석한다</text>
  <rect x="350" y="46" width="230" height="150" rx="9" fill="#344A59" stroke="#6D869A" stroke-width="2" />
  <text x="370" y="82" class="ttl">h1 은 제목이구나</text>
  <text x="370" y="114" class="ttl">p 는 문단이구나</text>
  <text x="370" y="150" class="lbl">브라우저가 읽는다</text>
  <path d="M 580 120 L 634 120" fill="none" stroke="#6D869A" stroke-width="2.5" marker-end="url(#dg2-b1)" />
  <text x="654" y="30" class="stg">③ 그린다</text>
  <rect x="640" y="46" width="280" height="150" rx="9" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" />
  <text x="660" y="88" class="big">반도체 정책 발표에</text>
  <text x="660" y="118" class="big">업계 촉각</text>
  <text x="660" y="150" class="lbl">정다은 기자</text>
  <text x="780" y="234" class="lbl" text-anchor="middle">우리가 보는 화면</text>
  <text x="470" y="278" class="hot" text-anchor="middle">우리는 ①만 씁니다. ②③은 브라우저가 합니다</text>
  <text x="470" y="312" class="lbl" text-anchor="middle">크기·색·위치를 안 정해도 「제목이다」라고만 말하면 알아서 그려집니다</text>
  <defs>
    <marker id="dg2-b1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6D869A" />
    </marker>
  </defs>
</svg>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EC%9A%B0%EB%A6%AC%EA%B0%80-%EC%93%B0%EB%8A%94-%EA%B2%83%EC%9D%80-%EC%99%BC%EC%AA%BD%EC%9E%85%EB%8B%88%EB%8B%A4">우리가 쓰는 것은 왼쪽입니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>반도체 정책 발표에 업계 촉각<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
</code></pre>
<p>이 글자를 쓰면 브라우저가 <strong>알아서 크고 굵게</strong> 그립니다.</p>
<ul>
<li>글자 크기를 몇 픽셀로 할지 <strong>안 정해도</strong> 됩니다</li>
<li>어디에 놓을지 <strong>안 정해도</strong> 됩니다</li>
<li>우리는 <strong>&quot;이건 제목이다&quot;</strong> 라고만 말합니다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>HTML 은 「무엇인가」를 적습니다.</strong> 「어떻게 보일지」는 3일차(CSS)입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="quiz" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" class="quiz" data-marpit-pagination="14" style="--paginate:true;--class:quiz;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%ED%95%A8%EA%BB%98-%ED%95%B4%EB%B4%85%EC%8B%9C%EB%8B%A4-5%EB%B6%84">함께 해봅시다 (5분)</h1>
<p>개발자도구를 켠 채로 뉴스 사이트를 뜯어봅니다.</p>
<ol>
<li>기사 <strong>제목</strong>에 해당하는 글자를 찾아 무슨 태그인지 적기</li>
<li>기자 <strong>이름</strong>은 무슨 태그 안에 있습니까</li>
<li>★ 마우스를 글자 위에 올리면 화면에서 어디가 파랗게 변합니까</li>
</ol>
<blockquote>
<p>안 외워도 됩니다. <strong>&quot;화면의 저것이 여기 이 글자&quot;</strong> 만 눈에 익히면 됩니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="section" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" class="section" data-marpit-pagination="15" style="--paginate:true;--class:section;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="2%EC%B0%A8%EC%8B%9C">2차시</h1>
<h2 id="%EA%B8%80%EC%9E%90%EB%A5%BC-%EC%9A%B0%EB%A6%AC%EA%B0%80-%EC%93%B4%EB%8B%A4">글자를 우리가 쓴다</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="compact" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" class="compact" data-marpit-pagination="16" style="--paginate:true;--class:compact;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="html--%EC%9D%B4%EB%A6%84%EC%97%90-%EB%8B%A4-%EB%93%A4%EC%96%B4-%EC%9E%88%EC%8A%B5%EB%8B%88%EB%8B%A4">HTML — 이름에 다 들어 있습니다</h1>
<p><strong>H</strong>yper<strong>T</strong>ext <strong>M</strong>arkup <strong>L</strong>anguage</p>
<table>
<thead>
<tr>
<th>낱말</th>
<th>뜻</th>
<th>우리 과정에서</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>HyperText</strong></td>
<td>다른 문서로 <strong>건너뛸 수 있는</strong> 글 — 링크</td>
<td>내일 <code>&lt;a href&gt;</code></td>
</tr>
<tr>
<td><strong>Markup</strong></td>
<td>글에 <strong>표시(태그)</strong> 를 붙여 「이건 제목」이라고 알린다</td>
<td><strong>오늘</strong></td>
</tr>
<tr>
<td><strong>Language</strong></td>
<td>정해진 문법 — 브라우저와 우리가 같이 지키는 약속</td>
<td>표준이 정한다</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>HTML 은 프로그래밍 언어가 아닙니다.</strong> 계산도, 조건도, 반복도 없습니다.<br />
글의 <strong>구조와 뜻을 표시하는 언어</strong>입니다 — SQL 처럼 「무엇인가」만 적습니다. 계산은 <strong>JS(5과목)</strong> 의 일.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-class="compact" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" class="compact" data-marpit-pagination="17" style="--paginate:true;--class:compact;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EB%88%84%EA%B0%80-%EC%A0%95%ED%95%98%EA%B3%A0-%EB%B8%8C%EB%9D%BC%EC%9A%B0%EC%A0%80%EB%8A%94-%EC%96%B4%EB%96%BB%EA%B2%8C-%EC%9D%BD%EB%82%98">누가 정하고, 브라우저는 어떻게 읽나</h1>
<ul>
<li><strong>1991년 팀 버너스리</strong>(CERN)가 만들었고, 지금 표준은 <strong>WHATWG 「HTML Living Standard」</strong> (HTML5 는 2014년 판 이름)</li>
<li>브라우저는 글자를 읽어 <strong>DOM</strong> — <strong>상자 나무</strong>로 바꿔 둡니다</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>html ─┬─ head ── title
      └─ body ─┬─ h1
               └─ p
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>틀린 HTML 을 고쳐 읽는 법까지 표준에 있습니다.</strong> 그래서 오류 없이, 모든 브라우저가 <strong>똑같이</strong> 고칩니다.<br />
DOM 은 <strong>JS 5일차(11/25)</strong> 에 손으로 만집니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="compact" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" class="compact" data-marpit-pagination="18" style="--paginate:true;--class:compact;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EC%B2%AB-%ED%8C%8C%EC%9D%BC%EC%9D%84-%EB%A7%8C%EB%93%AD%EB%8B%88%EB%8B%A4">첫 파일을 만듭니다</h1>
<ol>
<li>VS Code 에서 <code>파일</code> → <code>폴더 열기</code> → <code>C:\dev\workspace\03-html-css</code></li>
<li>왼쪽 탐색기에서 <strong>새 폴더</strong> → <code>day01</code></li>
<li><code>day01</code> 안에 <strong>새 파일</strong> → <code>test.html</code> (확장자까지 정확히)</li>
<li>아래를 그대로 치고 저장(<code>Ctrl+S</code>)</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Hello<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
</code></pre>
<ol start="5">
<li>탐색기에서 그 파일을 <strong>더블클릭</strong></li>
</ol>
<blockquote>
<p>브라우저가 열리고 <strong>크고 굵은 「Hello」</strong> 가 뜹니다. 그게 전부입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-class="compact" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" class="compact" data-marpit-pagination="19" style="--paginate:true;--class:compact;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="html-%EB%AC%B8%EC%84%9C%EC%9D%98-%EB%BC%88%EB%8C%80">HTML 문서의 뼈대</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">html</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;ko&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">charset</span>=<span class="hljs-string">&quot;UTF-8&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">title</span>&gt;</span>반도체 정책 발표에 업계 촉각<span class="hljs-tag">&lt;/<span class="hljs-name">title</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>반도체 정책 발표에 업계 촉각<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong><code>&lt;meta charset=&quot;UTF-8&quot;&gt;</code> 이 없으면 한글이 깨집니다.</strong> 오늘 가장 흔한 사고입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EB%A8%B8%EB%A6%AC%EC%99%80-%EB%AA%B8">머리와 몸</h1>
<table>
<thead>
<tr>
<th>어디</th>
<th>무엇이 들어가나</th>
<th>화면에 보이나</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>&lt;head&gt;</code></td>
<td>제목·인코딩·CSS 연결</td>
<td><strong>안 보인다</strong></td>
</tr>
<tr>
<td><code>&lt;body&gt;</code></td>
<td>사람이 볼 내용 전부</td>
<td>보인다</td>
</tr>
</tbody>
</table>
<p><code>&lt;title&gt;</code> 은 화면이 아니라 <strong>브라우저 탭</strong>에 뜹니다.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> &quot;제목을 썼는데 화면에 안 나와요&quot; — <code>&lt;title&gt;</code> 에 쓴 겁니다.<br />
화면에 보이려면 <code>&lt;body&gt;</code> 안의 <code>&lt;h1&gt;</code> 이어야 합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%ED%83%9C%EA%B7%B8--%EC%97%AC%EB%8A%94-%EA%B2%83%EA%B3%BC-%EB%8B%AB%EB%8A%94-%EA%B2%83">태그 — 여는 것과 닫는 것</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>반도체 정책 발표에 업계 촉각<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
 ↑                              ↑
여는 태그                     닫는 태그  (/ 가 붙는다)
</code></pre>
<p><strong>여는 태그와 닫는 태그 사이</strong>가 그 태그의 내용입니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>업계는 이번 발표를 예의주시하고 있다.<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
</code></pre>
<blockquote>
<p>닫지 않아도 되는 태그가 몇 개 있습니다 — <code>&lt;img&gt;</code> <code>&lt;br&gt;</code> <code>&lt;meta&gt;</code>.<br />
<strong>내용이 없는 태그</strong>들입니다. 나머지는 전부 닫습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="compact" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" class="compact" data-marpit-pagination="22" style="--paginate:true;--class:compact;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EC%86%8D%EC%84%B1--%ED%83%9C%EA%B7%B8%EC%97%90-%EB%94%B8%EB%A6%B0-%EC%A0%95%EB%B3%B4">속성 — 태그에 딸린 정보</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;ko&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">charset</span>=<span class="hljs-string">&quot;UTF-8&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;photo.jpg&quot;</span> <span class="hljs-attr">alt</span>=<span class="hljs-string">&quot;반도체 공장 내부&quot;</span>&gt;</span>
</code></pre>
<p><strong>여는 태그 안에</strong> <code>이름=&quot;값&quot;</code> 으로 씁니다. 닫는 태그에는 안 씁니다.</p>
<table>
<thead>
<tr>
<th>속성</th>
<th>뜻</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>lang=&quot;ko&quot;</code></td>
<td>이 문서는 한국어다</td>
</tr>
<tr>
<td><code>src=&quot;photo.jpg&quot;</code></td>
<td>이 그림 파일을 가져와라</td>
</tr>
<tr>
<td><code>alt=&quot;...&quot;</code></td>
<td>그림이 안 뜨면 이 글자를 보여줘라</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">

  <style>

  <text x="40" y="216" class="mono">&lt;/article&gt;</text>
  <text x="230" y="262" class="lbl" text-anchor="middle">안쪽 상자가 먼저 닫힌다</text>

  <text x="470" y="308" class="hot" text-anchor="middle">브라우저는 오류를 내지 않고 「알아서 고쳐서」 그립니다</text>
  <text x="470" y="340" class="lbl" text-anchor="middle">그래서 화면만 이상해지고 어디가 틀렸는지는 안 알려줍니다</text>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-class="compact" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" class="compact" data-marpit-pagination="24" style="--paginate:true;--class:compact;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EB%93%A4%EC%97%AC%EC%93%B0%EA%B8%B0%EB%8A%94-%EA%B7%9C%EC%B9%99%EC%9D%B4-%EC%95%84%EB%8B%99%EB%8B%88%EB%8B%A4">들여쓰기는 규칙이 아닙니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>제목<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>본문<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>제목<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>본문<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
</code></pre>
<p><strong>둘은 똑같이 그려집니다.</strong> 브라우저는 들여쓰기를 안 봅니다.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 그래도 <strong>반드시 들여쓰십시오.</strong> 닫는 태그를 빠뜨렸는지 눈으로 잡는<br />
유일한 방법입니다. VS Code 는 <code>Shift+Alt+F</code> 로 정리해 줍니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EB%8B%AB%EB%8A%94-%EA%B2%83%EC%9D%84-%EB%B9%A0%EB%9C%A8%EB%A6%AC%EB%A9%B4">닫는 것을 빠뜨리면</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>반도체 정책 발표에 업계 촉각
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>업계는 이번 발표를 예의주시하고 있다.<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
</code></pre>
<p><strong>오류가 안 납니다.</strong> 대신 본문까지 <strong>제목 크기로</strong> 나옵니다.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>브라우저는 틀린 HTML 을 고쳐서 그립니다.</strong> 화면만 이상해집니다.<br />
어디가 틀렸는지 안 알려줍니다 — 그래서 <strong>들여쓰기</strong>가 필요합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="section" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" class="section" data-marpit-pagination="26" style="--paginate:true;--class:section;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="3%EC%B0%A8%EC%8B%9C">3차시</h1>
<h2 id="%EC%9D%B4%EB%A6%84%EC%9D%B4-%EC%9E%88%EB%8A%94-%EC%83%81%EC%9E%90">이름이 있는 상자</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="div-%EB%A1%9C-%EB%8B%A4-%ED%95%B4%EB%8F%84-%EB%90%A9%EB%8B%88%EB%8B%A4"><code>div</code> 로 다 해도 됩니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>뉴스 사이트<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>반도체 정책 발표에 업계 촉각<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>업계는 이번 발표를…<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>© 2026 뉴스<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<p><strong>이렇게 써도 화면은 똑같이 나옵니다.</strong> 그런데 이 문서를 보고<br />
<strong>어디가 머리고 어디가 본문인지</strong> 알 수 있습니까?</p>
<blockquote>
<p>사람도 모릅니다. <strong>기계는 더 모릅니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EC%9D%B4%EB%A6%84%EC%9D%B4-%EC%9E%88%EB%8A%94-%EC%83%81%EC%9E%90%EB%93%A4">이름이 있는 상자들</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">header</span>&gt;</span>뉴스 사이트<span class="hljs-tag">&lt;/<span class="hljs-name">header</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">nav</span>&gt;</span>정치 · 경제 · 사회<span class="hljs-tag">&lt;/<span class="hljs-name">nav</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">main</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">article</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>반도체 정책 발표에 업계 촉각<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>업계는 이번 발표를…<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">article</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">main</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">footer</span>&gt;</span>© 2026 뉴스<span class="hljs-tag">&lt;/<span class="hljs-name">footer</span>&gt;</span>
</code></pre>
<p><strong>하는 일은 <code>div</code> 와 똑같습니다.</strong> 다른 건 <strong>이름뿐</strong>입니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EC%97%AC%EC%84%AF-%EA%B0%9C%EB%A9%B4-%EC%B6%A9%EB%B6%84%ED%95%A9%EB%8B%88%EB%8B%A4">여섯 개면 충분합니다</h1>
<table>
<thead>
<tr>
<th>태그</th>
<th>무엇을 담나</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>&lt;header&gt;</code></td>
<td>맨 위 — 사이트 이름, 로고</td>
</tr>
<tr>
<td><code>&lt;nav&gt;</code></td>
<td>메뉴 · 링크 모음</td>
</tr>
<tr>
<td><code>&lt;main&gt;</code></td>
<td>이 페이지의 <strong>본 내용</strong> (한 번만)</td>
</tr>
<tr>
<td><code>&lt;article&gt;</code></td>
<td>그것만 떼어내도 말이 되는 덩어리</td>
</tr>
<tr>
<td><code>&lt;section&gt;</code></td>
<td>주제로 묶은 구역</td>
</tr>
<tr>
<td><code>&lt;footer&gt;</code></td>
<td>맨 아래 — 저작권, 연락처</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%F0%9F%94%B4-%EC%99%9C-%EC%9D%B4%EB%A6%84%EC%9D%84-%EB%B6%99%EC%9D%B4%EB%82%98"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 왜 이름을 붙이나</h1>
<table>
<thead>
<tr>
<th>누가 읽나</th>
<th><code>div</code> 만 쓰면</th>
<th>이름을 붙이면</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>시각장애인의 스크린 리더</strong></td>
<td>&quot;그룹, 그룹, 그룹…&quot;</td>
<td>&quot;머리말&quot;, &quot;본문&quot;, &quot;기사&quot;</td>
</tr>
<tr>
<td><strong>검색엔진</strong></td>
<td>어디가 본문인지 추측</td>
<td>본문을 정확히 찾는다</td>
</tr>
<tr>
<td><strong>6개월 뒤의 나</strong></td>
<td>전부 <code>div</code></td>
<td>열자마자 구조가 보인다</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>화면은 똑같은데 왜 하냐</strong> 는 질문이 반드시 나옵니다.<br />
답: <strong>화면을 보지 않는 사용자와 기계가 있기 때문</strong>입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="article-%EA%B3%BC-section"><code>article</code> 과 <code>section</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">article</span>&gt;</span>
</code></pre>
<p><strong>떼어내도 말이 되는 덩어리</strong>인가 — 그것만 물으면 됩니다.</p>
<ul>
<li><strong>기사 한 편</strong> → <code>article</code> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> (다른 사이트에 퍼가도 말이 됨)</li>
<li><strong>댓글 하나</strong> → <code>article</code> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><strong>「관련 기사」 묶음</strong> → <code>section</code> (혼자 떼면 말이 안 됨)</li>
</ul>
<blockquote>
<p>헷갈리면 <strong><code>section</code> 을 쓰십시오.</strong> 틀려도 화면은 안 깨집니다.<br />
<img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 다만 <code>div</code> 로 도배하는 것보다는 <strong>틀린 이름이라도 붙이는 게 낫습니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="quiz" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" class="quiz" data-marpit-pagination="32" style="--paginate:true;--class:quiz;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EB%8B%A4%EC%8B%9C-%EB%9C%AF%EC%96%B4%EB%B4%85%EC%8B%9C%EB%8B%A4-8%EB%B6%84">다시 뜯어봅시다 (8분)</h1>
<p>아까 그 뉴스 사이트를 개발자도구로 다시 엽니다.</p>
<ol>
<li><code>header</code> · <code>nav</code> · <code>main</code> · <code>footer</code> 를 찾아보기</li>
<li>기사 본문은 <code>article</code> 입니까 <code>div</code> 입니까</li>
<li>★ <code>div</code> 만 쓴 사이트와 시맨틱 태그를 쓴 사이트를 <strong>둘 다</strong> 찾아보기</li>
</ol>
<blockquote>
<p><code>Ctrl+F</code> 로 개발자도구 안에서 검색할 수 있습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EC%98%A4%EB%8A%98-%EB%B0%B0%EC%9A%B4-%EA%B2%83">오늘 배운 것</h1>
<table>
<thead>
<tr>
<th>무엇</th>
<th>한 줄</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>웹</strong></td>
<td>브라우저가 <strong>요청</strong>하고 서버가 <strong>응답</strong>한다 — 그 뒤에 DB 가 있다</td>
</tr>
<tr>
<td><strong>화면의 정체</strong></td>
<td>서버가 보낸 글자를 브라우저가 펼친 것 · <code>F12</code> 로 본다</td>
</tr>
<tr>
<td><strong>HTML · CSS · JS</strong></td>
<td>무엇인가 · 어떻게 보이나 · 움직임 — 섞지 않는다</td>
</tr>
<tr>
<td><strong>태그</strong></td>
<td>열고 닫는다. 겹치지 않게 중첩한다</td>
</tr>
<tr>
<td><strong>시맨틱 태그</strong></td>
<td>하는 일은 같고 <strong>이름</strong>이 다르다</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EA%BC%AD-%EA%B8%B0%EC%96%B5%ED%95%A0-%EC%84%B8-%EA%B0%80%EC%A7%80">꼭 기억할 세 가지</h1>
<ol>
<li>
<p><strong>화면은 글자에서 나옵니다.</strong><br />
<code>F12</code> 를 눌러 언제든 확인할 수 있습니다.</p>
</li>
<li>
<p><strong>HTML 은 「무엇인가」를 적습니다.</strong><br />
크기·색·위치는 3일차(CSS)입니다.</p>
</li>
<li>
<p><strong>브라우저는 틀린 HTML 을 고쳐서 그립니다.</strong><br />
오류를 안 내주므로 <strong>들여쓰기로 스스로 잡아야</strong> 합니다.</p>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EB%8B%A4%EC%9D%8C-%EC%8B%9C%EA%B0%84-1103-%ED%99%94--4%EC%B0%A8%EC%8B%9C">다음 시간 (11/03 화 · 4차시)</h1>
<ul>
<li><strong>실습 ① — 기사 한 편</strong> <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 시작하자마자 오늘 배운 태그로 마크업합니다</li>
<li><strong>텍스트 태그와 목록</strong> — 문단·강조·<code>ul</code>/<code>ol</code></li>
<li><strong>링크와 이미지</strong> — <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 경로에서 절반이 막힙니다</li>
<li><strong>표와 폼</strong> — 검색창 만들기</li>
</ul>
<blockquote>
<p>오늘 만든 <code>day01</code> 폴더를 <strong>지우지 마세요.</strong> 내일 그 옆에 <code>day02</code> 를 만듭니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:f716kkczrr6jxa16ncuwrbvqv6yl1pwmhyyy595hr;" data-marpit-pagination-total="36">
<h1 id="%EA%B3%BC%EC%A0%9C">과제</h1>
<ol>
<li><strong>자주 가는 사이트 하나</strong>를 <code>F12</code> 로 열어, 시맨틱 태그를 몇 개나 쓰는지 세어 오기<br />
→ <code>header</code> <code>nav</code> <code>main</code> <code>article</code> <code>section</code> <code>footer</code> 중 몇 개?</li>
<li>여유가 되면 — 오늘 그린 <strong>웹 서비스 한 바퀴</strong>를 보지 않고 종이에 다시 그려 보기<br />
→ 브라우저 · 서버 · DB 와 화살표 네 개</li>
</ol>
</section>
