<td><code>#f5f5f5</code> · <code>#333</code></td>
<td style="text-align:right">각 1번</td>
<td>바탕 · 본문 글자</td>
</tr>
</tbody>
</table>
<p><strong>색 7종이 18곳에 적혀 있습니다.</strong> <code>16px</code> 은 따로 12번입니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EA%B7%B8%EB%9E%98%EC%84%9C-%EB%AD%90%EA%B0%80-%EB%AC%B8%EC%A0%9C%EC%9D%B8%EA%B0%80">그래서 뭐가 문제인가</h1>
<blockquote>
<p><strong>&quot;브랜드 색을 바꿉시다.&quot;</strong></p>
</blockquote>
<ul>
<li><code>#1f5065</code> 를 찾아 <strong>3곳</strong>을 고쳐야 합니다</li>
<li>한 곳만 빠뜨리면 <strong>그 자리에 옛날 색이 남습니다</strong></li>
<li>오류도 경고도 안 납니다. <strong>눈으로 찾아야</strong> 합니다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EC%98%A4%EB%8A%98-%ED%95%A0-%EC%9D%BC">오늘 할 일</h1>
<table>
<thead>
<tr>
<th>차시</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>CSS 변수</strong> — 값에 이름을 붙인다</td>
</tr>
<tr>
<td>2</td>
<td><strong>부품으로 나누기</strong> — 겹치는 것을 한 번만</td>
</tr>
<tr>
<td>3</td>
<td>마감 · <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>실습 ⑥ — 뉴스 화면 완성</strong> (산출물)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 오늘 만드는 화면은 <strong>JS 9일차로 그대로</strong>, 솜씨는 <strong>미니프로젝트 웹 페이지로</strong> 넘어갑니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-class="section" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" class="section" data-marpit-pagination="5" style="--paginate:true;--class:section;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="1%EC%B0%A8%EC%8B%9C">1차시</h1>
<h2 id="%EA%B0%92%EC%97%90-%EC%9D%B4%EB%A6%84%EC%9D%84-%EB%B6%99%EC%9D%B8%EB%8B%A4">값에 이름을 붙인다</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%ED%9D%A9%EC%96%B4%EC%A7%84-%EA%B0%92-vs-%EB%AA%A8%EC%9D%80-%EA%B0%92">흩어진 값 vs 모은 값</h1>
<svg style="display:block;margin:0 auto 18px" id="dg1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 356" width="1010" height="383" aria-label="같은 색 값이 여러 규칙에 흩어져 적혀 있으면 바꿀 때 전부 찾아 고쳐야 하지만 루트에 이름을 붙여 한 곳에 모아두면 그 한 줄만 바꾸면 된다">
  <defs>
    <marker id="dg1-d61-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5CC6DE" />
    </marker>
  </defs>
  <style>
#dg1 .stg{ font-family:var(--sans); font-size:20px; font-weight:600; fill:#9DB0BE; }
#dg1 .stgo{ font-family:var(--sans); font-size:20px; font-weight:600; fill:#5CC6DE; }
#dg1 .cod{ font-family:var(--mono); font-size:15px; fill:#FFFFFF; }
#dg1 .codh{ font-family:var(--mono); font-size:15px; fill:#F2C879; }
#dg1 .lbl{ font-family:var(--sans); font-size:15px; fill:#9DB0BE; }
#dg1 .hot{ font-family:var(--sans); font-size:19px; font-weight:600; fill:#F2C879; }
  </style>
  <text x="20" y="30" class="stg">흩어져 있으면 — 세 군데를 다 찾아야 한다</text>
  <rect x="20" y="46" width="400" height="52" rx="6" fill="#344A59" stroke="#6D869A" stroke-width="2" />
  <text x="36" y="68" class="cod">.site-header {</text>
  <text x="52" y="88" class="codh">background: #1f5065;</text>
  <rect x="20" y="110" width="400" height="52" rx="6" fill="#344A59" stroke="#6D869A" stroke-width="2" />
  <text x="36" y="132" class="cod">.badge {</text>
  <text x="52" y="152" class="codh">background: #1f5065;</text>
  <rect x="20" y="174" width="400" height="52" rx="6" fill="#344A59" stroke="#6D869A" stroke-width="2" />
  <text x="36" y="196" class="cod">.btn {</text>
  <text x="52" y="216" class="codh">background: #1f5065;</text>
  <text x="20" y="256" class="lbl">한 군데만 빠뜨려도 그 자리에 옛날 색이 남는다</text>
  <path d="M 440 136 L 490 136" stroke="#5CC6DE" stroke-width="2.5" fill="none" marker-end="url(#dg1-d61-a)" />
  <text x="510" y="30" class="stgo">이름을 붙여 한 곳에 모으면</text>
  <rect x="510" y="46" width="410" height="76" rx="6" fill="#1F5065" stroke="#5CC6DE" stroke-width="2" />
  <text x="526" y="68" class="cod">:root {</text>
  <text x="542" y="90" class="codh">--brand: #1f5065;</text>
  <text x="526" y="112" class="cod">}</text>
  <rect x="510" y="134" width="410" height="92" rx="6" fill="#344A59" stroke="#6D869A" stroke-width="2" />
  <text x="526" y="156" class="cod">.site-header { background: var(--brand) }</text>
  <text x="526" y="178" class="cod">.badge       { background: var(--brand) }</text>
  <text x="526" y="200" class="cod">.btn         { background: var(--brand) }</text>
  <text x="510" y="256" class="lbl">바꿀 곳은 위의 한 줄뿐이다</text>
  <text x="470" y="304" class="hot" text-anchor="middle">값을 쓰지 말고 이름을 쓴다</text>
  <text x="470" y="334" class="lbl" text-anchor="middle">이름은 「무슨 색인가」가 아니라 「어디에 쓰는가」로 짓는다</text>
</svg>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EC%93%B0%EB%8A%94-%EB%B2%95--%EB%91%90-%EA%B0%80%EC%A7%80%EB%BF%90%EC%9E%85%EB%8B%88%EB%8B%A4">쓰는 법 — 두 가지뿐입니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-pseudo">:root</span> {
  <span class="hljs-attr">--brand</span>: <span class="hljs-number">#1f5065</span>;      <span class="hljs-comment">/* ① 이름을 만든다 */</span>
}

<span class="hljs-selector-class">.badge</span> {
  <span class="hljs-attribute">background</span>: <span class="hljs-built_in">var</span>(--brand);   <span class="hljs-comment">/* ② 이름을 쓴다 */</span>
}
</code></pre>
<ul>
<li>이름은 <strong>반드시 <code>--</code> 로 시작</strong>하고, <strong>대소문자를 가립니다</strong></li>
<li>쓸 때는 <strong><code>var()</code> 로 감쌉니다.</strong> 그냥 <code>--brand</code> 라고 쓰면 안 됩니다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="root-%EA%B0%80-%EB%AD%94%EA%B0%80%EC%9A%94"><code>:root</code> 가 뭔가요</h1>
<p><code>:root</code> 는 <strong><code>&lt;html&gt;</code> 태그</strong>입니다. 문서에서 제일 바깥이죠.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-pseudo">:root</span> { <span class="hljs-attr">--brand</span>: <span class="hljs-number">#1f5065</span>; }
</code></pre>
<ul>
<li>변수는 <strong>상속됩니다</strong> — 색·글꼴과 같습니다 (3일차의 그것)</li>
<li>제일 바깥에 두면 <strong>문서 어디서나</strong> 쓸 수 있습니다</li>
<li><code>html { }</code> 이라고 써도 됩니다. <code>:root</code> 가 관례일 뿐입니다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 3일차에 &quot;상속되는 것과 안 되는 것&quot;을 봤습니다.<br />
<strong>변수는 상속되는 쪽</strong>입니다. 그래서 이 방법이 됩니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="compact" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" class="compact" data-marpit-pagination="9" style="--paginate:true;--class:compact;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EC%9D%B4%EB%A6%84%EC%9D%80-%EC%96%B4%EB%94%94%EC%97%90-%EC%93%B0%EB%8A%94%EA%B0%80%EB%A1%9C-%EC%A7%93%EC%8A%B5%EB%8B%88%EB%8B%A4">이름은 「어디에 쓰는가」로 짓습니다</h1>
<table>
<thead>
<tr>
<th>이름</th>
<th>어떤가</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>--blue</code></td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 나중에 빨강으로 바꾸면 <strong>이름이 거짓말</strong></td>
</tr>
<tr>
<td><code>--color1</code></td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 뜻이 없다. 셋째 달에 아무도 모른다</td>
</tr>
<tr>
<td><code>--brand</code></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 쓰임이다. 값이 바뀌어도 이름은 맞다</td>
</tr>
<tr>
<td><code>--surface</code></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> &quot;카드·사이드가 놓이는 바닥&quot;</td>
</tr>
<tr>
<td><code>--muted</code></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> &quot;흐리게 보일 글자&quot;</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>값이 바뀌어도 이름이 안 틀리게</strong> 짓는 것이 요령입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="quiz" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" class="quiz" data-marpit-pagination="10" style="--paginate:true;--class:quiz;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EC%9E%A0%EA%B9%90--%EC%9D%B4-%EC%A4%91-%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%AC%B8%EC%A0%9C%EC%9E%85%EB%8B%88%EA%B9%8C">잠깐 — 이 중 무엇이 문제입니까</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-pseudo">:root</span> { <span class="hljs-attr">--gap</span>: <span class="hljs-number">16px</span>; }

<span class="hljs-selector-class">.card</span>    { <span class="hljs-attribute">padding</span>: <span class="hljs-number">16px</span>; }
<span class="hljs-selector-class">.content</span> { <span class="hljs-attribute">padding</span>: <span class="hljs-number">16px</span>; }
<span class="hljs-selector-class">.badge</span>   { <span class="hljs-attribute">padding</span>: <span class="hljs-number">2px</span> <span class="hljs-number">8px</span>; }
<span class="hljs-selector-class">.card</span> <span class="hljs-selector-tag">dl</span> { <span class="hljs-attribute">gap</span>: <span class="hljs-number">6px</span>; }
</code></pre>
<p><strong><code>--gap</code> 으로 묶을 것은 몇 개입니까?</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EB%B3%80%EC%88%98%EB%8A%94-%EA%B0%99%EC%9D%80-%EB%9C%BB%EC%9D%84-%EB%AC%B6%EC%8A%B5%EB%8B%88%EB%8B%A4">변수는 「같은 뜻」을 묶습니다</h1>
<ul>
<li>숫자가 같다고 다 묶으면 <strong>하나를 바꿀 때 엉뚱한 데가 같이 바뀝니다</strong></li>
<li>실습 [2] 에서 <code>6px</code>·<code>8px</code>·<code>12px</code> 은 <strong>일부러 그대로 둡니다</strong></li>
<li>묶을지 말지 헷갈리면 이렇게 물어보십시오 —</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>&quot;이 값을 바꿀 때, 저기도 같이 바뀌어야 하나?&quot;</strong><br />
예면 묶고, 아니면 둡니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EB%8B%A4-%EB%AC%B6%EC%97%88%EB%8A%94%EC%A7%80-%ED%99%95%EC%9D%B8%ED%95%98%EB%8A%94-%EB%B2%95">다 묶었는지 확인하는 법</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-pseudo">:root</span> { <span class="hljs-attr">--brand</span>: <span class="hljs-number">#7a2e2e</span>; }   <span class="hljs-comment">/* 잠깐 바꿔 본다 */</span>
</code></pre>
<p><strong>머리·배지·단추 셋이 한꺼번에 바뀌면</strong> <code>--brand</code> 는 성공입니다.</p>
<ul>
<li>나머지는 <code>--surface</code> 를 <code>#ffe9e9</code> 로 바꿔 같은 식으로 확인하십시오</li>
<li>안 바뀌고 남은 곳 = <strong>아직 <code>var()</code> 로 안 바꾼 곳</strong></li>
<li>다 봤으면 원래 값으로 되돌립니다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 실습 [1] 의 채점이 이것입니다. 눈으로 세지 말고 <strong>바꿔 보십시오.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="compact" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" class="compact" data-marpit-pagination="13" style="--paginate:true;--class:compact;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EC%9E%90%EC%A3%BC-%EB%82%98%EB%8A%94-%EC%8B%A4%EC%88%98">자주 나는 실수</h1>
<table>
<thead>
<tr>
<th>쓴 것</th>
<th>무슨 일이 나나</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>background: --brand;</code></td>
<td><code>var()</code> 가 없다 → <strong>그 줄이 통째로 죽는다</strong></td>
</tr>
<tr>
<td><code>background: var(brand);</code></td>
<td><code>--</code> 가 없다 → 마찬가지</td>
</tr>
<tr>
<td><code>:root { brand: #1f5065; }</code></td>
<td><code>--</code> 없이 만들면 <strong>변수가 아니다</strong></td>
</tr>
<tr>
<td><code>var(--Brand)</code> · <code>var(--brnad)</code></td>
<td><strong>없는 변수</strong>다 → 조용히 아무 일도 안 난다</td>
</tr>
<tr>
<td><code>@media</code> 를 <code>:root</code> <strong>위</strong>에 뒀다</td>
<td>나중 선언이 이긴다 → 어두운 화면이 안 나온다</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 대소문자가 다른 것과 오타는 <strong>같은 일</strong>입니다 — 둘 다 없는 이름이죠.<br />
3일차의 「세미콜론 빠뜨리면 그 줄이 죽는다」와 같은 자리입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="section" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" class="section" data-marpit-pagination="14" style="--paginate:true;--class:section;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="2%EC%B0%A8%EC%8B%9C">2차시</h1>
<h2 id="%EC%86%90%EC%9C%BC%EB%A1%9C-%ED%95%B4%EB%B3%B4%EA%B3%A0-%EB%B6%80%ED%92%88%EC%9C%BC%EB%A1%9C-%EB%82%98%EB%88%88%EB%8B%A4">손으로 해보고, 부품으로 나눈다</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="quiz" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" class="quiz" data-marpit-pagination="15" style="--paginate:true;--class:quiz;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EC%8B%A4%EC%8A%B5-1--2--25%EB%B6%84">실습 [1] · [2] — 25분</h1>
<p><strong><code>style.css</code> 를 여십시오.</strong></p>
<ol>
<li><code>:root { }</code> 를 파일 맨 위에 만들고 색 7개에 이름 붙이기</li>
<li>위쪽 규칙의 색을 전부 <code>var(--이름)</code> 으로</li>
<li><code>--gap</code> · <code>--radius</code> 도 만들기 — <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>전부는 아닙니다</strong></li>
<li><code>--brand</code> 를 <code>#7a2e2e</code> 로 바꿔 확인하고, 되돌리기</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>막히면 손을 드십시오.</strong> 오늘은 진도가 아니라 <strong>산출물</strong>이 목표입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EB%B6%80%ED%92%88%EC%9D%B4%EB%9E%80-%EB%B3%84%EA%B2%8C-%EC%95%84%EB%8B%99%EB%8B%88%EB%8B%A4">부품이란 별게 아닙니다</h1>
<p><strong>이름이 붙은 한 덩어리</strong>입니다. 오늘 파일에 이미 둘이 있습니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.badge</span> { <span class="hljs-attribute">display</span>: inline-block; <span class="hljs-attribute">background</span>: <span class="hljs-built_in">var</span>(--brand);
         <span class="hljs-attribute">color</span>: <span class="hljs-built_in">var</span>(--surface); <span class="hljs-attribute">font-size</span>: <span class="hljs-number">12px</span>;
         <span class="hljs-attribute">padding</span>: <span class="hljs-number">2px</span> <span class="hljs-number">8px</span>; <span class="hljs-attribute">border-radius</span>: <span class="hljs-built_in">var</span>(--radius); }
</code></pre>
<ul>
<li>태그가 아니라 <strong>클래스</strong>에 붙였습니다 — <code>span</code> 이든 <code>a</code> 든 붙일 수 있습니다</li>
<li>HTML 에 <code>class=&quot;badge&quot;</code> 만 쓰면 어디서든 같은 모양이 나옵니다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> React 에서 「컴포넌트」라고 부를 그것의 <strong>CSS 판</strong>입니다.</p>
</blockquote>
</section>

<h1 id="%EA%B2%B9%EC%B9%98%EB%8A%94-%EA%B2%83%EC%9D%80-%ED%95%9C-%EB%B2%88%EB%A7%8C--%EC%89%BC%ED%91%9C">겹치는 것은 한 번만 — 쉼표</h1>
<p><code>.card</code> 와 <code>.side</code> 는 <strong>같은 모양</strong>입니다. 지금은 따로 적혀 있죠.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.card</span> { <span class="hljs-attribute">background</span>: <span class="hljs-number">#fff</span>; <span class="hljs-attribute">padding</span>: <span class="hljs-number">16px</span>; <span class="hljs-attribute">border</span>: <span class="hljs-number">1px</span> solid <span class="hljs-number">#ddd</span>; }
<span class="hljs-selector-class">.side</span> { <span class="hljs-attribute">background</span>: <span class="hljs-number">#fff</span>; <span class="hljs-attribute">padding</span>: <span class="hljs-number">16px</span>; <span class="hljs-attribute">border</span>: <span class="hljs-number">1px</span> solid <span class="hljs-number">#ddd</span>; }
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.card</span>,
<span class="hljs-selector-class">.side</span> { <span class="hljs-attribute">background</span>: <span class="hljs-built_in">var</span>(--surface); <span class="hljs-attribute">padding</span>: <span class="hljs-built_in">var</span>(--gap);
        <span class="hljs-attribute">border</span>: <span class="hljs-number">1px</span> solid <span class="hljs-built_in">var</span>(--line); <span class="hljs-attribute">border-radius</span>: <span class="hljs-built_in">var</span>(--radius); }
</code></pre>

<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 묶은 <strong>뒤에도</strong> 서로 다른 것은 각자 남깁니다 —<br />
<code>.card a { font-size: 18px }</code> 는 카드에만 있는 것이니 그대로 둡니다.</p>
</blockquote>

<h1 id="%EA%B7%B8%EB%9F%B0%EB%8D%B0-%EA%B3%A0%EC%B9%A0-%EA%B3%B3%EC%9D%B4-%EB%AA%87-%EA%B5%B0%EB%8D%B0%EC%9E%85%EB%8B%88%EA%B9%8C">그런데 고칠 곳이 몇 군데입니까</h1>
<ul>
<li><code>#777</code> 은 <strong>두 군데</strong>에 있습니다 — <code>.card dl</code> 과 푸터</li>
<li><code>--muted</code> 로 묶었다면 <strong>한 줄</strong>입니다</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-pseudo">:root</span> { <span class="hljs-attr">--muted</span>: <span class="hljs-number">#6f6f6f</span>; }   <span class="hljs-comment">/* 끝 */</span>
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>한 시간 전에</strong> 한 일의 값어치가 여기서 나옵니다.<br />
<strong>실습 ★★④ 가 이것입니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EA%B7%B8%EB%A6%AC%EA%B3%A0-%EC%9D%B4%EA%B2%83%EC%9D%B4-%EC%98%A4%EB%8A%98%EC%9D%98-%EA%B0%92%EC%96%B4%EC%B9%98%EC%9E%85%EB%8B%88%EB%8B%A4">그리고 이것이 오늘의 값어치입니다</h1>
<p><strong><code>article.html</code> 을 여십시오. CSS 는 한 줄도 안 고쳤습니다.</strong></p>
<table>
<thead>
<tr>
<th>잰 것</th>
<th><code>list.html</code></th>
<th><code>article.html</code></th>
</tr>
</thead>
<tbody>
<tr>
<td><code>.site-header</code></td>
<td>1085 × 64</td>
<td><strong>똑같다</strong></td>
</tr>
<tr>
<td><code>.search</code></td>
<td>y=114 · 높이 68</td>
<td><strong>똑같다</strong></td>
</tr>
<tr>
<td><code>.side</code></td>
<td>x=825 · 폭 260</td>
<td><strong>똑같다</strong></td>
</tr>
<tr>
<td><code>.badge</code></td>
<td>40 × 23</td>
<td><strong>똑같다</strong></td>
</tr>
</tbody>
</table>
<p>새로 쓴 것은 <strong>본문 규칙 두 개</strong>뿐입니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-class="compact" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" class="compact" data-marpit-pagination="25" style="--paginate:true;--class:compact;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EB%A7%88%EA%B0%90-%E2%91%A1-%EA%B8%80%EC%A4%84%EC%9D%B4-%EB%84%88%EB%AC%B4-%EA%B8%B8%EB%A9%B4-%EC%95%88-%EC%9D%BD%ED%9E%99%EB%8B%88%EB%8B%A4">마감 ② 글줄이 너무 길면 안 읽힙니다</h1>
<p>상세 화면 본문을 1100px 창에서 재면:</p>
<table>
<thead>
<tr>
<th></th>
<th style="text-align:right">문단 폭</th>
<th style="text-align:right">문단 사이</th>
</tr>
</thead>
<tbody>
<tr>
<td>그냥 두면</td>
<td style="text-align:right"><strong>793px</strong></td>
<td style="text-align:right"><strong>0px</strong> (붙어 있다)</td>
</tr>
<tr>
<td><code>max-width: 62ch</code> + 여백</td>
<td style="text-align:right"><strong>546px</strong></td>
<td style="text-align:right">16px</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.article</span> <span class="hljs-selector-tag">p</span> { <span class="hljs-attribute">max-width</span>: <span class="hljs-number">62ch</span>; <span class="hljs-attribute">margin-bottom</span>: <span class="hljs-built_in">var</span>(--gap); }
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <code>ch</code> 는 <strong><code>0</code> 한 글자의 폭</strong>입니다. 영문 60자쯤이고 <strong>한글로는 40자쯤</strong><br />
나옵니다 (재보면 39자). 375px 에서는 창이 더 좁아 <strong>아무 일도 안 합니다.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="quiz" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" class="quiz" data-marpit-pagination="26" style="--paginate:true;--class:quiz;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EC%8B%A4%EC%8A%B5-%E2%91%A5--25%EB%B6%84">실습 ⑥ — 25분</h1>
<table>
<thead>
<tr>
<th>문항</th>
<th>무엇</th>
</tr>
</thead>
<tbody>
<tr>
<td>[1][2]</td>
<td>변수 (2차시에 했습니다)</td>
</tr>
<tr>
<td>[3]</td>
<td><code>.card</code> 와 <code>.side</code> 를 쉼표로 묶기</td>
</tr>
<tr>
<td><strong>[4]</strong></td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong><code>article.html</code> 열고 본문 둘만</strong> 만들기</td>
</tr>
<tr>
<td>★[5]</td>
<td>어두운 화면</td>
</tr>
<tr>
<td>★★</td>
<td>변수 안의 변수 · 좁을 때 <code>--gap</code> · <code>focus</code> · 대비</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>[4] 까지가 오늘의 산출물입니다.</strong> ★ 는 남는 사람만.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%E2%98%855-%EC%96%B4%EB%91%90%EC%9A%B4-%ED%99%94%EB%A9%B4--%EA%B0%92%EB%A7%8C-%EB%B0%94%EA%BF%89%EB%8B%88%EB%8B%A4">★[5] 어두운 화면 — 값만 바꿉니다</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-keyword">@media</span> (<span class="hljs-attribute">prefers-color-scheme</span>: dark) {
  <span class="hljs-selector-pseudo">:root</span> { <span class="hljs-attr">--bg</span>: <span class="hljs-number">#16202a</span>; <span class="hljs-attr">--surface</span>: <span class="hljs-number">#1f2c38</span>; <span class="hljs-attr">--text</span>: <span class="hljs-number">#e8eef3</span>; }
}
</code></pre>
<ul>
<li><strong>선택자는 하나도 안 건드립니다.</strong> 값만 바꿉니다</li>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 이 블록은 기본 <code>:root</code> <strong>아래</strong>에 — 나중 선언이 이깁니다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>브랜드 위 글자를 <code>--surface</code> 로 묶었다면 여기서 터집니다</strong> —<br />
머리·배지 글자가 같이 어두워져 <strong>1.62:1</strong>. 그래서 <code>--on-brand</code> 를 따로 뒀습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="compact" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" class="compact" data-marpit-pagination="28" style="--paginate:true;--class:compact;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EC%98%A4%EB%8A%98-%EC%9E%90%EC%A3%BC-%EB%82%98%EB%8A%94-%EC%98%A4%EB%A5%98">오늘 자주 나는 오류</h1>
<table>
<thead>
<tr>
<th>증상</th>
<th>원인</th>
</tr>
</thead>
<tbody>
<tr>
<td>변수가 아무 데도 안 먹는다</td>
<td><code>var()</code> 를 안 썼거나 <code>--</code> 를 빠뜨렸다</td>
</tr>
<tr>
<td>한 군데만 색이 안 바뀐다</td>
<td>거기만 아직 값으로 적혀 있다</td>
</tr>
<tr>
<td>배지가 뚱뚱해졌다</td>
<td><code>--gap</code> 을 배지에도 묶었다</td>
</tr>
<tr>
<td>묶었더니 글자 크기까지 같아졌다</td>
<td>다른 것까지 쉼표 안으로 넣었다</td>
</tr>
<tr>
<td>어두운 화면이 안 나온다</td>
<td>밝은 모드거나 <code>@media</code> 를 <code>:root</code> <strong>위</strong>에 뒀다</td>
</tr>
<tr>
<td>어두운 화면에서 머리 글자가 안 보인다</td>
<td>글자색까지 <code>--surface</code> 로 묶었다</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="compact" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" class="compact" data-marpit-pagination="29" style="--paginate:true;--class:compact;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EC%99%84%EC%84%B1-%EC%A0%90%EA%B2%80%ED%91%9C">완성 점검표</h1>
<p>내보내기 전에 이 여섯 개를 보십시오.</p>
<table>
<thead>
<tr>
<th></th>
<th>확인</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>창을 <strong>375px 까지</strong> 줄여도 가로 스크롤이 없다</td>
</tr>
<tr>
<td>2</td>
<td><code>Tab</code> 으로 다닐 때 <strong>지금 어디인지 보인다</strong> (★★③)</td>
</tr>
<tr>
<td>3</td>
<td>흐린 글자의 <strong>대비가 4.5 이상</strong>이다 (★★④)</td>
</tr>
<tr>
<td>4</td>
<td>모든 <code>img</code> 에 <strong><code>alt</code></strong> 가 있다 (1일차)</td>
</tr>
<tr>
<td>5</td>
<td>색 값이 <strong><code>:root</code> 에만</strong> 있다</td>
</tr>
<tr>
<td>6</td>
<td>두 화면이 <strong>같은 <code>style.css</code></strong> 를 쓴다</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EC%98%A4%EB%8A%98-%EB%B0%B0%EC%9A%B4-%EA%B2%83">오늘 배운 것</h1>
<table>
<thead>
<tr>
<th>무엇</th>
<th>한 줄</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>--이름</code> / <code>var()</code></td>
<td>값에 이름을 붙인다</td>
</tr>
<tr>
<td><code>:root</code></td>
<td>제일 바깥. 변수는 <strong>상속된다</strong></td>
</tr>
<tr>
<td>이름 짓기</td>
<td><strong>쓰임</strong>으로. 「무슨 색」이 아니라</td>
</tr>
<tr>
<td>쉼표로 묶기</td>
<td>겹치는 것은 한 번만</td>
</tr>
<tr>
<td><code>:focus-visible</code></td>
<td>키보드로 다니는 사람을 위한 두 줄</td>
</tr>
<tr>
<td><code>prefers-color-scheme</code></td>
<td>값만 바꿔 어두운 화면</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EA%BC%AD-%EA%B8%B0%EC%96%B5%ED%95%A0-%EC%84%B8-%EA%B0%80%EC%A7%80">꼭 기억할 세 가지</h1>
<ol>
<li>
<p><strong>값을 쓰지 말고 이름을 씁니다.</strong><br />
바꿀 곳이 한 곳이 됩니다.</p>
</li>
<li>
<p><strong>묶는 기준은 숫자가 아니라 뜻입니다.</strong><br />
&quot;이걸 바꿀 때 저기도 같이 바뀌어야 하나?&quot;</p>
</li>
<li>
<p><strong>부품을 만들어 두면 다음 화면이 거저 됩니다.</strong><br />
오늘 <code>article.html</code> 에서 새로 쓴 것은 본문 규칙 두 개뿐이었습니다.</p>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="compact" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" class="compact" data-marpit-pagination="32" style="--paginate:true;--class:compact;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="htmlcss-6%EC%9D%BC--%EC%97%AC%EA%B8%B0%EA%B9%8C%EC%A7%80-%EC%99%94%EC%8A%B5%EB%8B%88%EB%8B%A4">HTML/CSS 6일 — 여기까지 왔습니다</h1>
<table>
<thead>
<tr>
<th>일</th>
<th>무엇을</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>웹 서비스 한 바퀴 · HTML 뼈대 · <strong>시맨틱 태그</strong></td>
</tr>
<tr>
<td>2</td>
<td>기사 한 편 · 링크 · 이미지 · 표 · <strong>폼</strong></td>
</tr>
<tr>
<td>3</td>
<td>목록 완성 · <strong>선택자</strong> · 우선순위 · <strong>박스 모델</strong></td>
</tr>
<tr>
<td>4</td>
<td><strong>Flexbox</strong> — 한 줄 배치</td>
</tr>
<tr>
<td>5</td>
<td><strong>Grid</strong> · 미디어 쿼리 — 판과 반응형</td>
</tr>
<tr>
<td>6</td>
<td><strong>변수 · 부품</strong> — 완성</td>
</tr>
</tbody>
</table>
<p><strong>입문에서 시작해 뉴스 화면 두 개를 혼자 그렸습니다.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EC%98%A4%EB%8A%98-%EB%A7%8C%EB%93%A0-%EA%B2%83%EC%9D%B4-%EC%96%B4%EB%94%94%EB%A1%9C-%EA%B0%80%EB%82%98">오늘 만든 것이 어디로 가나</h1>
<table>
<thead>
<tr>
<th>언제</th>
<th>어떻게 쓰이나</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>미니프로젝트</strong></td>
<td><strong>분석 결과 페이지</strong>를 이 솜씨로 — 차트 <code>img</code> · 수치 <code>table</code></td>
</tr>
<tr>
<td><strong>JS 9일차</strong></td>
<td>이 <code>list.html</code> 에 <strong>기사를 코드로 채웁니다</strong></td>
</tr>
<tr>
<td><strong>React</strong></td>
<td><code>.badge</code>·<code>.btn</code> 이 그대로 <strong>컴포넌트</strong>가 됩니다</td>
</tr>
<tr>
<td><strong>크롤링(내일)</strong></td>
<td>오늘 쓴 <strong>태그와 클래스로 찾아냅니다</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong><code>03-html-css\day06</code> 폴더를 지우지 마십시오.</strong> 다시 씁니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="compact" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" class="compact" data-marpit-pagination="34" style="--paginate:true;--class:compact;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EB%8B%A4%EC%9D%8C-%EA%B3%BC%EB%AA%A9--%ED%81%AC%EB%A1%A4%EB%A7%81-1110--1113--4%EC%9D%BC">다음 과목 — 크롤링 (11/10 ~ 11/13 · 4일)</h1>
<p><strong>Python 으로 웹에서 데이터를 모읍니다.</strong></p>
<ul>
<li>HTTP 요청과 응답 — 브라우저가 하던 일을 코드로</li>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>HTML 을 다시 봅니다</strong> — 이번엔 <em>그리는</em> 쪽이 아니라 <em>읽는</em> 쪽으로</li>
<li><code>BeautifulSoup</code> — <strong>선택자로</strong> 원하는 것만 뽑기 (3일차 그 선택자입니다)</li>
<li>모은 것을 <strong>DB 에 넣기</strong> — 1과목과 이어집니다</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 3일차에 배운 <code>.card &gt; a</code> 같은 선택자를 <strong>크롤링 2일차(11/11)</strong> 에 그대로 씁니다.<br />
오늘 만든 <code>list.html</code> 이 그때 <strong>연습 대상</strong>이 됩니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:2vanpidld7bysojgkn8rue86zl5v5g0r4dxv8au60as;" data-marpit-pagination-total="35">
<h1 id="%EA%B3%BC%EC%A0%9C--%EC%A0%9C%EC%B6%9C">과제 · 제출</h1>
<ol>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>실습 ⑥ [4] 까지 완성해 제출</strong> — <code>style.css</code> 하나면 됩니다<br />
(제출처는 강사가 알려드립니다. <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>오늘이 마지막이라 다음 기회가 없습니다</strong>)</li>
<li><strong>완성 점검표 6개</strong>를 직접 확인하고, 안 되는 것이 있으면 적어오기</li>
<li>여유가 되면 — 자주 가는 사이트에서 <strong>반복되는 부품</strong>을 셋 찾아<br />
이름을 붙여오기 (<code>.card</code> 같은 식으로)</li>
</ol>
